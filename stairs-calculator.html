<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Corner Deck Stair Calculator</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --ink:#16202b; --muted:#6b7885; --line:#dde3ea;
  --accent:#0f6fbf; --accent2:#e8f2fb; --warn:#b45309; --warnbg:#fff7e6;
  --err:#b91c1c; --errbg:#fee; --ok:#166534; --okbg:#eaf7ee; --wood:#d9a86c;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
h1{font-size:17px;margin:0}
h2{font-size:15px;margin:22px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
h3{font-size:13px;margin:16px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);
  padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header .sub{color:var(--muted);font-size:12px}
header .spacer{flex:1}
button{font:inherit;padding:5px 11px;border:1px solid var(--line);background:#fff;border-radius:5px;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
main{display:grid;grid-template-columns:var(--sbw,340px) 8px 1fr;gap:10px;padding:16px;align-items:start}
#split{align-self:stretch;min-height:60vh;cursor:col-resize;border-radius:4px;background:transparent;
  position:relative;touch-action:none}
#split::before{content:"";position:absolute;inset:0 3px;background:var(--line);border-radius:2px}
#split:hover::before,#split.drag::before{background:var(--accent)}
body.resizing{cursor:col-resize;user-select:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px}
#inputs{position:sticky;top:57px;max-height:calc(100vh - 74px);overflow:auto}
#inputs h3:first-child{margin-top:0}
/* input grows with the column instead of staying pinned at 108px */
.f{display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,42%);gap:6px 8px;align-items:center;margin-bottom:6px}
.f label{font-size:12.5px}
.f input[type=text],.f input[type=number],.f select{font-variant-numeric:tabular-nums}
.f .hint{grid-column:1/-1;font-size:11.5px;color:var(--muted);margin:-3px 0 4px}
input,select{font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:4px;width:100%;background:#fff}
input[type=checkbox]{width:auto}
input.bad{border-color:var(--err);background:#fff5f5}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.tabs button.on{background:var(--accent2);border-color:var(--accent);color:var(--accent);font-weight:600}
.panel{display:none}
.panel.on{display:block}
table{border-collapse:collapse;width:100%;font-size:12.5px;margin:6px 0 14px}
th,td{border:1px solid var(--line);padding:4px 7px;text-align:right;vertical-align:top}
th{background:#f0f3f6;font-weight:600;text-align:right;white-space:nowrap}
td:first-child,th:first-child,.tl{text-align:left}
tbody tr:nth-child(even){background:#fafbfc}
tfoot td{font-weight:600;background:#f0f3f6}
.dec{color:var(--muted);font-size:11px;margin-left:4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-variant-numeric:tabular-nums}
.big{display:flex;gap:22px;flex-wrap:wrap;margin:8px 0 4px}
.big div{background:var(--accent2);border:1px solid #cfe3f5;border-radius:6px;padding:8px 12px;min-width:120px}
.big b{display:block;font-size:19px;font-weight:600}
.big span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.msg{border-radius:6px;padding:8px 11px;margin:6px 0;font-size:12.5px;border:1px solid}
.msg.e{background:var(--errbg);border-color:#f5c2c2;color:var(--err)}
.msg.w{background:var(--warnbg);border-color:#f0d9a8;color:var(--warn)}
.msg.i{background:var(--okbg);border-color:#c6e6d1;color:var(--ok)}
.msg b{font-weight:600}
svg{max-width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:6px}
.note{font-size:12px;color:var(--muted);margin:4px 0 12px}
.pill{display:inline-block;font-size:11px;padding:1px 6px;border-radius:9px;background:#eef1f4;color:var(--muted);margin-left:5px}
.pill.rip{background:#fdf0dd;color:var(--warn)}
.pill.ok{background:var(--okbg);color:var(--ok)}
.sheet{page-break-inside:avoid;margin-bottom:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.svgwrap{overflow:auto;margin:6px 0}
.svgwrap svg{display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:11.5px;color:var(--muted);margin:4px 0 8px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:14px;height:10px;border:1px solid;border-radius:2px;display:inline-block;flex:none}
h4{font-size:12.5px;margin:6px 0 4px;color:var(--ink)}
#panel-tests table td:nth-child(2){text-align:center}
.tests-summary{font-weight:600}
@media print{
  @page{size:letter portrait;margin:12mm}
  header,#inputs,#split,.tabs,.noprint{display:none!important}
  main{display:block;padding:0}
  body{background:#fff;font-size:11px}
  .card{border:0;padding:0}
  .panel{display:block!important;page-break-before:always}
  .panel:first-of-type{page-break-before:avoid}
  h2{page-break-after:avoid}
  table{font-size:10px}
  .sheet{break-inside:avoid}
  #printhead{display:block!important;margin-bottom:8px}
}
#printhead{display:none}
</style>
</head>
<body>
<header>
  <h1 id="app-title">Corner Deck Stair Calculator</h1>
  <span class="sub" id="app-sub">cascading pyramid stair &middot; 2 faces + mitered outside corner</span>
  <span class="spacer"></span>
  <label class="sub"><span id="t-lang">Language</span>
    <select id="lang" style="width:auto;display:inline-block;margin-left:4px">
      <option value="en">English</option><option value="fr">Fran&ccedil;ais</option>
    </select>
  </label>
  <label class="sub"><span id="t-units">Units</span>
    <select id="units" style="width:auto;display:inline-block;margin-left:4px">
      <option value="in">Imperial</option><option value="mm">Metric (mm)</option><option value="both">Both</option>
    </select>
  </label>
  <button id="btn-save">Export JSON</button>
  <button id="btn-load">Import</button>
  <button id="btn-reset">Reset</button>
  <button id="btn-print" class="primary">Print / PDF</button>
  <input type="file" id="file" accept=".json" style="display:none">
</header>
<main>
  <aside id="inputs" class="card"></aside>
  <div id="split" title="Drag to resize · double-click to reset"></div>
  <section>
    <div id="printhead"></div>
    <nav class="tabs" id="tabs"></nav>
    <div id="panels"></div>
  </section>
</main>

function t(s){
  let out = s;
  if(S && S.lang==="fr"){
    if(FR[s]!==undefined) out = FR[s];
    else if(s && /[a-zA-Z]{3}/.test(s)) MISSING_T.add(s);
  }
  for(let i=1;i<arguments.length;i++) out = out.split("{"+(i-1)+"}").join(String(arguments[i]));
  return out;
}
const isFR = () => S && S.lang==="fr";
const dec = s => isFR() ? String(s).replace(".", ",") : String(s);   // 9.333 -> 9,333

/* ---------- 1. units ---------------------------------------------------- */
const MM = 25.4;
function fmtIn(x){
  const neg = x < 0; x = Math.abs(x);
  const s16 = Math.round(x*16);
  let whole = Math.floor(s16/16), num = s16%16, den = 16;
  while(num && num%2===0){ num/=2; den/=2; }
  let out = num ? (whole ? whole+"-"+num+"/"+den : num+"/"+den) : String(whole);
  return (neg?"-":"")+out+'"';
}
function fmtMm(x){ const v = x*MM; return dec(Math.abs(v)<100 ? v.toFixed(1) : Math.round(v))+" mm"; }
function L(x){                                   // headline length, current units
  if(!isFinite(x)) return "—";
  if(S.units==="mm")   return fmtMm(x);
  if(S.units==="both") return fmtIn(x)+" / "+fmtMm(x);
  return fmtIn(x);
}
function LD(x){                 // length, plus the exact decimal ONLY when the
  if(!isFinite(x)) return "—";  // fraction is a rounding of it — otherwise noise
  if(S.units==="mm") return fmtMm(x);
  const off = Math.abs(x*16 - Math.round(x*16)) > 0.02;
  return L(x)+(off ? '<span class="dec">= '+dec(x.toFixed(3))+'"</span>' : "");
}
function parseLen(str){
  if(typeof str === "number") return str;
  /* Accept a comma as the decimal mark, so a French keyboard entry works. */
  let s = String(str).trim().toLowerCase().replace(/[“”″]/g,'"').replace(/′/g,"'").replace(/(\d),(\d)/g,"$1.$2");
  if(!s) return NaN;
  let unit = null;
  if(/mm$/.test(s)){ unit="mm"; s=s.replace(/mm$/,""); }
  else if(/cm$/.test(s)){ unit="cm"; s=s.replace(/cm$/,""); }
  else if(/"$/.test(s)||/in$/.test(s)){ unit="in"; s=s.replace(/(in|")$/,""); }
  s = s.trim();
  let ft = 0;
  const fm = s.match(/^(\d+(?:\.\d+)?)\s*'\s*(.*)$/);
  if(fm){ ft = parseFloat(fm[1]); s = fm[2].trim(); unit = unit||"in"; }
  let v = 0;
  if(s){
    const m = s.match(/^(\d+(?:\.\d+)?)?(?:[\s-]*(\d+)\s*\/\s*(\d+))?$/);
    if(!m || (!m[1] && !m[2])) return NaN;
    v = (m[1]?parseFloat(m[1]):0) + (m[2]?parseInt(m[2],10)/parseInt(m[3],10):0);
  }
  let inches = ft*12 + v;
  if(unit==="mm" || (unit===null && S.units==="mm")) inches = inches/MM;
  else if(unit==="cm") inches = inches/2.54;
  return inches;
}

function onFormInput(e){
  const t = e.target;
  if(t.dataset.k){
    const k = t.dataset.k, ty = t.dataset.t;
    if(ty==="chk") S[k] = t.checked;
    else if(ty==="len"){ const v = parseLen(t.value); if(isNaN(v)){ t.classList.add("bad"); return; } t.classList.remove("bad"); S[k]=v; }
    else if(ty==="int"){ const v = parseInt(t.value,10); if(!(v>0)) return; S[k]=v; }
    else S[k] = t.value;
    const f = FIELDS.find(f=>f.k===k);
    if(f && (f.t==="sel"||f.t==="chk")) { save(); renderForm(); return run(); }
  } else if(t.dataset.code){ CODE[t.dataset.code] = parseFloat(t.value)||0; }
  else if(t.dataset.stock){ STOCK[t.dataset.stock][t.dataset.p] = parseFloat(t.value)||0; }
  else return;
  save(); run();
}

/* ---------- 8. small parsing helpers ------------------------------------ */
function parseStockLens(){
  return String(S.stockLen||"").split(",").map(s=>parseFloat(s.trim()))
    .filter(x=>isFinite(x) && x>0).sort((a,b)=>a-b);
}
function pickStockLen(need, lens){
  lens = lens || parseStockLens();
  for(const Ln of lens) if(Ln >= need-1e-6) return Ln;
  return null;                                   // nothing long enough — needs a splice
}
function parsePrices(){
  const map = {};
  if(!S.price) return map;
  for(const part of String(S.price).split(",")){
    const idx = part.lastIndexOf(":");
    if(idx<0) continue;
    const name = part.slice(0,idx).trim(), val = parseFloat(part.slice(idx+1));
    if(name && isFinite(val)) map[name] = val;
  }
  return map;
}

/* ---------- 9. board fitting — "do I have to cut boards?" --------------- */
/* depth must be filled by boards of width w with a normal gap between them.
   n = number of full boards you get if you also leave a trailing gap-width
   of space after the last one (so a rip or another board could follow). */
function fitBoards(depth, w, gap){
  gap = gap || 0;
  const n = Math.max(1, Math.floor((depth+gap)/(w+gap)));
  const spanN = n*w + (n-1)*gap;                 // n boards, n-1 internal gaps
  const remainder = depth - spanN;                // >= 0 by construction of n
  const exact = Math.abs(remainder) < 0.0625;      // within 1/16" — no rip needed
  const rip = remainder - gap;                     // depth - n*w - n*gap
  const overshootN = n+1;
  const overshootSpan = overshootN*w + n*gap;      // n+1 full boards, n gaps
  const overshoot = overshootSpan - depth;
  let altGap = null;
  if(n>1){
    const g = (depth - n*w)/(n-1);
    if(g>=0.125 && g<=0.375) altGap = g;           // only "sane" if 1/8"–3/8"
  }
  /* n+1 boards with the gap TIGHTENED fills the depth exactly with no rip.
     gT = 0 means the boards butt tight — fine for composite or an indoor
     tread, but it gives up drainage on PT. Offered as an alternative, never
     forced, because "2 boards butted = exactly 11" is often what you want. */
  let altGapTight = null;
  const gT = (depth - overshootN*w)/n;
  if(gT >= -1e-9 && gT <= gap + 1e-9) altGapTight = Math.max(0, gT);
  let recommend;
  if(exact) recommend = "exact";
  else if(altGap!=null) recommend = "altgap";
  else if(rip>0.01 && rip<w*0.92) recommend = "rip";
  else recommend = "overshoot";
  return {depth,w,gap,n,spanN,exact,remainder,rip,overshootN,overshootSpan,overshoot,altGap,altGapTight,recommend};
}

/* ---------- 10. rise-mode solvers --------------------------------------- */
function fixedTable(){
  const H = S.totalRise, rows = [];
  for(let N=1;N<=12;N++){
    const r = H/N, mm = inMM(r);
    rows.push({N, r, mm, inCode: mm>=CODE.riserMin && mm<=CODE.riserMax,
      onGrid: Math.abs(r*16-Math.round(r*16))<0.01});
  }
  return rows;
}
function flexibleSearch(){
  const target = S.targetRise, tol = S.riseTol;
  const rMinIn = CODE.riserMin/MM, rMaxIn = CODE.riserMax/MM;
  const lo = Math.ceil(rMinIn*16), hi = Math.floor(rMaxIn*16);
  const results = [];
  for(let N=1;N<=12;N++){
    for(let s16=lo; s16<=hi; s16++){
      const r = s16/16, total = N*r;
      if(Math.abs(total-target) <= tol){
        const round = (s16%4===0) ? 3 : (s16%2===0) ? 2 : 1;   // 1/4 > 1/8 > 1/16
        results.push({N, r, total, round, d7:Math.abs(r-7), dTarget:Math.abs(total-target)});
      }
    }
  }
  results.sort((a,b)=> b.round-a.round || a.d7-b.d7 || a.dTarget-b.dTarget);
  return results;
}

/* ---------- 11. validation ----------------------------------------------- */
function validate(model){
  const warnings = [];
  const rmm=inMM(model.r), Rmm=inMM(model.R), Tmm=inMM(model.R+model.nose);
  if(rmm<CODE.riserMin || rmm>CODE.riserMax)
    warnings.push({level:"error", msg:t("Riser height {0} is outside the code range {1}–{2} mm.", LD(model.r), CODE.riserMin, CODE.riserMax)});
  if(Rmm<CODE.runMin || Rmm>CODE.runMax)
    warnings.push({level:"error", msg:t("Run {0} is outside the code range {1}–{2} mm.", LD(model.R), CODE.runMin, CODE.runMax)});
  if(Tmm<CODE.treadDepthMin)
    warnings.push({level:"error", msg:t("Tread depth {0} is below the code minimum {1} mm.", LD(model.R+model.nose), CODE.treadDepthMin)});
  /* Narrowest walking width on a leg is the INNER edge of its top tread —
     Wb + (k-1)R with k=1, i.e. Wb itself. (Measuring at the outer edge would
     add a full run and let an undersized stair pass the check.) */
  const widthFront=model.Wx, widthSide=model.Wy;
  if(inMM(widthFront)<CODE.widthMin)
    warnings.push({level:"error", msg:t("Front leg walking width {0} (narrowest point — back of the top tread) is below the minimum {1} mm.", LD(widthFront), CODE.widthMin)});
  if(inMM(widthSide)<CODE.widthMin)
    warnings.push({level:"error", msg:t("Side leg walking width {0} (narrowest point — back of the top tread) is below the minimum {1} mm.", LD(widthSide), CODE.widthMin)});
  if(model.N>CODE.handrailOverRisers)
    warnings.push({level:"warn", msg:t("Handrail required: {0} risers exceeds {1} (mention only — not sized here).", model.N, CODE.handrailOverRisers)});
  let guardFlagged = false;
  if(inMM(model.H)>CODE.guardOverHeight){
    warnings.push({level:"warn", msg:t("Guard likely required: the platform surface is {0} above the deck (mention only — not sized here).", LD(model.H))});
    guardFlagged = true;
  }
  if(!guardFlagged){
    for(const lvl of model.levels){
      if(inMM(lvl.z)>CODE.guardOverHeight){
        warnings.push({level:"warn", msg:t("Guard may be required: the tread at level {0} is {1} above the deck (mention only).", lvl.k, LD(lvl.z))});
        break;
      }
    }
  }
  if(S.riserStyle==="open" && inMM(model.r)>CODE.openRiserMaxGap)
    warnings.push({level:"warn", msg:t("Open riser gap {0} exceeds the {1} mm code maximum.", LD(model.r), CODE.openRiserMaxGap)});
  if(Math.abs(model.r*16-Math.round(model.r*16))>0.02)
    warnings.push({level:"warn", msg:t("Riser height {0}\" does not land on a 1/16\" increment — lay out every riser mark from one reference face, do not stack measured increments.", dec(model.r.toFixed(3)))});
  if(inMM(model.Wy)<CODE.landingMinDepth)
    warnings.push({level:"warn", msg:t("Landing depth at the door is {0} (platform frame, wall to riser face); code wants at least {1} mm. The nosing overhang does not count as walking surface.", LD(model.Wy), CODE.landingMinDepth)});
  if(S.method==="stringers"){
    const stv = stringersForLeg("front", model), hipv = hipStringer(model);
    if(!stv.fitsStock)
      warnings.push({level:"error", msg:t("Leg stringers need a board at least {0} wide (notch {1} + throat {2}); a {3} is only {4}.", fmtIn(stv.minWidth), fmtIn(stv.notchDepth), fmtIn(S.throatMin), S.stringerStock, fmtIn(stv.stock.w))});
    if(!hipv.fitsStock)
      warnings.push({level:"error", msg:t("The hip stringer needs a board at least {0} wide — its run is R×√2 = {1}, so the notch is deeper. A {2} leaves only {3} of throat.", fmtIn(hipv.minWidth), L(hipv.run), S.stringerStock, fmtIn(hipv.throat))});
  } else if(model.base>0){
    const bb = boxesForLevel(model, model.N-1);
    if(!bb.rimStockOK)
      warnings.push({level:"error", msg:t("Bearing on the deck structure makes the bottom box rim {0}, deeper than a {1} ({2}). Use deeper stock for that box.", LD(bb.rimH), S.frameStock, fmtIn(sk(S.frameStock).w))});
  }
  if(S.includePlatform){
    const pfv = platformModel(model);
    if(pfv.braceNeeded)
      warnings.push({level:"warn", msg:t("Floating platform legs are {0} tall — double them into an L at the corners and brace them diagonally, or use 4x4 posts.", LD(pfv.legH))});
    if(pfv.ripFrame)
      warnings.push({level:"warn", msg:t("A {0} is deeper than the whole platform ({1}) — rip the frame stock down, or pick a shallower stock.", S.platFrame, LD(pfv.height))});
  }
  const stockLens = parseStockLens();
  const maxStock = stockLens.length ? Math.max(...stockLens) : 0;
  if(maxStock){
    const bottomFront = model.footX, bottomSide = model.footY;
    if(bottomFront>maxStock)
      warnings.push({level:"warn", msg:t("The longest board needed on the front leg (bottom level, {0}) exceeds your longest stock length ({1}) — plan a splice over a stringer or joist.", L(bottomFront), L(maxStock))});
    if(bottomSide>maxStock)
      warnings.push({level:"warn", msg:t("The longest board needed on the side leg (bottom level, {0}) exceeds your longest stock length ({1}) — plan a splice over a stringer or joist.", L(bottomSide), L(maxStock))});
  }
  return warnings;
}
/* ---------- 12. geometry -------------------------------------------------
   House wall at y=0. Platform footprint platX (along wall, X) by platY (out
   from wall, Y). Steps cascade in +y (front face) and +x (side face),
   wrapping the outside corner at (platX,platY) on a 45 degree miter.
   Level k = 1 (top) .. N-1 (bottom). z_k = H - k*r, always from exact r. */
function computeModel(){
  const R=S.run, nose=S.nosing, N=S.risers, H=S.totalRise;
  const r = H/N;
  const Wx=S.platX, Wy=S.platY;
  /* A captured riser board sits ON the tread below and tucks UNDER the tread
     above, so ITS face — not the frame — is the last vertical surface, and the
     nosing is measured from there. That makes the tread board one riser
     thickness deeper than the going. Without this the tread stops at the
     frame and the riser's top edge is left exposed. */
  const riserT = (S.riserStyle==="closed" && S.riserFit==="captured") ? sk(S.riserStock).t : 0;
  const Tb = R + riserT + nose;      // board depth — what you cut
  const Twalk = R + nose;            // riser face to nosing tip — what code measures
  const levels = [];
  for(let k=1;k<=N-1;k++) levels.push({k, z:H-k*r, T:Tb, Twalk});
  const footX = Wx+(N-1)*R+riserT+nose, footY = Wy+(N-1)*R+riserT+nose;
  /* base = how far BELOW the finished deck surface the framing bears. Landing
     on the deck structure means cutting through the decking, so the bottom of
     the framing sits one deck-board thickness low. This deliberately does NOT
     touch r, H or any tread height: the rise stays finished-to-finished, and
     only the framing that reaches down to bearing gets longer. */
  const base = S.bottomBearing==="structure" ? Math.max(0, S.deckBoardT) : 0;
  return {R,nose,N,H,r,Wx,Wy,levels,footX,footY,base,deckT:Math.max(0,S.deckBoardT),
          riserT, Tb, Twalk, platFinX:Wx+riserT+nose, platFinY:Wy+riserT+nose};
}

/* One tread leg, one level. style: "miter" (mitered outside corner, boards
   run parallel to the face, offset o_j accumulates width+gap) or "through"
   (S.throughLeg runs full length square-cut, the other leg butts short). */
function treadLegBoards(legName, k, model, style){
  const R=model.R, nose=model.nose;
  const Wb = legName==="front" ? model.Wx : model.Wy;
  const T = model.Tb;
  const {fit} = treadBoardWidths(model);
  const offs = treadBoardOffsets(model);          // [0] = the nosing board
  const boards = [];
  if(style==="miter"){
    offs.forEach((b,i)=>boards.push({j:i+1, o:b.o, w:b.w,
      long:Wb+(k-1)*R+b.o+b.w, short:Wb+(k-1)*R+b.o}));
  } else {                                        // through-leg / butt style
    const isThrough = S.throughLeg===legName;
    const len = isThrough ? (Wb+k*R+model.riserT+nose) : (Wb+(k-1)*R);
    offs.forEach((b,i)=>boards.push({j:i+1, o:b.o, w:b.w, long:len, short:len}));
  }
  return {fit, boards, T, style, Wb, legName, k};
}

/* Pure geometric leg trapezoid area (no board/gap rounding) — used by the
   plan drawing and the self-test that miter vs through cover equal area. */
function ringLegAreaMiter(Wb,k,R,Tb){
  const short = Wb+(k-1)*R;
  return Tb*short + Tb*Tb/2;
}
function ringLegAreaThrough(Wb,k,R,Tb,isThrough){
  const short = Wb+(k-1)*R;
  return isThrough ? Tb*(short+Tb) : Tb*short;
}

/* Risers. N risers total (riser 1 = platform's own face .. riser N = the
   outermost, at the deck). Outside corner mitered on the board THICKNESS
   (a 45 degree cut across thickness t shortens the back point by exactly t). */
function riserBoards(model){
  if(S.riserStyle==="open") return null;
  const t = sk(S.riserStock).t;
  const rh = S.riserFit==="captured" ? (model.r - sk(S.treadStock).t) : model.r;
  /* Riser 1 tucks under the PLATFORM decking, not under a tread board, so if
     those two are different thicknesses it is a different height to the rest. */
  const rh1 = S.riserFit==="captured"
    ? (model.r - (S.includePlatform ? sk(S.platSurface).t : sk(S.treadStock).t)) : model.r;
  const rows = [];
  for(let k=1;k<=model.N;k++){
    const frontLong = model.Wx+(k-1)*model.R, sideLong = model.Wy+(k-1)*model.R;
    rows.push({
      k, height: k===1 ? rh1 : rh,
      front:{long:frontLong, short:frontLong-t},
      side:{long:sideLong, short:sideLong-t}
    });
  }
  return {rows, height:rh, height1:rh1, t};
}

/* Corner-style comparison: total board count / length / area per level,
   used by the "compare" corner-joint option in the Framing panel. */
function compareCornerStyles(model){
  const out = {miter:{count:0,total:0}, through:{count:0,total:0}};
  for(const lvl of model.levels){
    for(const legName of ["front","side"]){
      for(const style of ["miter","through"]){
        const tb = treadLegBoards(legName, lvl.k, model, style);
        out[style].count += tb.boards.length;
        out[style].total += tb.boards.reduce((s,b)=>s+b.long,0);
      }
    }
  }
  return out;
}
/* ---------- 13. cut stringers -------------------------------------------- */
function stringerPositions(total, span){
  const count = Math.max(2, Math.ceil(total/span)+1);
  const step = total/(count-1);
  const pos = [];
  for(let i=0;i<count;i++) pos.push(i*step);
  return pos;
}
/* Minimum board length: build the sawtooth (nosing-line) profile for c
   notches and project every vertex onto the slope direction — the spread
   of those projections is the exact minimum length, no rule-of-thumb. */
function projectStringerLength(c, r, R, Ls, drop){
  if(c<=0) return 0;
  const verts = [[0,0]];
  for(let i=0;i<c;i++){ verts.push([(i+1)*R, i*r]); verts.push([(i+1)*R, (i+1)*r]); }
  /* The bottom of the stringer is NOT the bottom notch corner (0,0): material
     continues down the bottom plumb face to the level cut that bears on the
     deck, i.e. `drop` = r - tread thickness below it. That vertex projects
     NEGATIVE along the slope, so it lengthens the board by drop*r/Ls. Leaving
     it out understates the board — about 3" on a 7/11 stair, enough to buy a
     board one stock length too short. The top plumb cut needs no allowance:
     it leans back from the top notch corner, which stays the far extreme. */
  verts.push([0, -(drop||0)]);
  const ux = R/Ls, uy = r/Ls;
  let min=Infinity, max=-Infinity;
  for(const [x,y] of verts){ const p = x*ux+y*uy; if(p<min) min=p; if(p>max) max=p; }
  return max-min;
}
function stringersForLeg(legName, model){
  const Wb = legName==="front" ? model.Wx : model.Wy;
  const R=model.R, N=model.N, r=model.r;
  const stock = sk(S.stringerStock);
  const total = Wb+(N-1)*R;
  /* Spacing is governed by what the TREADS can span between supports, not by
     the stringer's own span — 5/4x6 treads need 16" o.c. even though the 2x12
     carrying them is good for 24". */
  const spanLimit = sk(S.treadStock).span || 24;
  const positions = stringerPositions(total, spanLimit);
  const Ls = hyp(r,R);
  const notchDepth = r*R/Ls;
  const throat = stock.w - notchDepth;
  const minWidth = notchDepth + S.throatMin;          // narrowest board that can carry this pitch
  const drop = Math.max(0, r - sk(S.treadStock).t) + model.base;   // bottom plumb face, down to bearing
  const stockLens = parseStockLens();
  const list = positions.map(p=>{
    let kmin = Math.max(1, Math.ceil((p-Wb)/R)+1);
    if(kmin>N) kmin = N;
    const c = Math.max(0, N-kmin);
    const reqLen = c>0 ? projectStringerLength(c,r,R,Ls,drop) : 0;
    const boardLen = c>0 ? pickStockLen(reqLen, stockLens) : null;
    return {pos:p, kmin, c, reqLen, boardLen};
  }).filter(s=>s.c>0);
  const groups = {};
  for(const s of list) (groups[s.c] = groups[s.c] || []).push(s);
  return {legName, Wb, R, N, r, Ls, notchDepth, throat, positions, list, groups, stock,
          minWidth, spanLimit, drop, fitsStock: stock.w >= minWidth - 1e-9,
          spacing: positions.length>1 ? positions[1]-positions[0] : 0};
}
/* Hip stringer at the outside corner: same rise r, run R*sqrt2, carries all
   N-1 notches, 45 degree plan bevels, and its own (usually tighter) throat. */
function hipStringer(model){
  const R=model.R, r=model.r, N=model.N;
  const Rh = R*Math.SQRT2;
  const c = N-1;
  const Ls = hyp(r,Rh);
  const notchDepth = r*Rh/Ls;
  const stock = sk(S.stringerStock);
  const throat = stock.w-notchDepth;
  const minWidth = notchDepth + S.throatMin;
  const drop = Math.max(0, r - sk(S.treadStock).t) + model.base;
  const reqLen = projectStringerLength(c,r,Rh,Ls,drop);
  const boardLen = pickStockLen(reqLen, parseStockLens());
  return {run:Rh, rise:r, c, Ls, notchDepth, throat, reqLen, boardLen, stock, drop,
          minWidth, fitsStock: stock.w >= minWidth - 1e-9};
}

/* ---------- 14. box frames ------------------------------------------------
   One L-shaped box per level k, rim height = r - tread thickness. Load path:
   box k's outer rim bears on box k+1's tread boards directly over box k+1's
   inner rim; box k's inner rim needs blocking down to the deck except k=1
   (fastens to the platform frame) and k=N-1 (sits on the deck). */
function boxesForLevel(model,k){
  const R=model.R, r=model.r;
  /* Every box is r - tread thickness tall, EXCEPT the bottom one when the
     framing bears on the deck structure: it reaches a decking thickness lower,
     so it is that much deeper and may need wider stock. */
  const isBottom = k===model.N-1;
  const rimH = r - sk(S.treadStock).t + (isBottom ? model.base : 0);
  const rimStock = sk(S.frameStock);
  const spacing = sk(S.treadStock).span || 24;
  const legs = ["front","side"].map(legName=>{
    const Wb = legName==="front" ? model.Wx : model.Wy;
    const outer = Wb+k*R, inner = Wb+(k-1)*R;
    const joistLen = Math.max(0, R-2*rimStock.t);
    /* ceil, not floor: floor(71/24)+1 = 3 joists leaves 35" clear on a 24"
       span. ceil(71/24)+1 = 5 gives 17-3/4" clear. */
    const joistCount = Math.max(2, Math.ceil(outer/spacing)+1);
    return {legName, outer, inner, joistLen, joistCount, joistSpacing: outer/Math.max(1,joistCount-1)};
  });
  return {k, rimH, isBottom, legs, rimFit: fitBoards(rimH, rimStock.w, 0),
          rimStockOK: rimStock.w >= rimH - 1e-9};
}
/* The inner rim runs the whole length of BOTH legs, so it needs a block at
   every joist position — not one per level. Level 1 fastens to the platform
   frame and the bottom level sits on the deck, so neither needs blocks. */
function boxSupportBlocks(model){
  const blocks = [];
  const spacing = sk(S.treadStock).span || 24;
  for(let k=2;k<=model.N-2;k++){
    const height = model.H-(k+1)*model.r + model.base;   // z_(k+1) down to the bearing plane
    for(const legName of ["front","side"]){
      const Wb = legName==="front" ? model.Wx : model.Wy;
      const inner = Wb+(k-1)*model.R;
      blocks.push({k, legName, inner, height,
        qty: Math.max(2, Math.ceil(inner/spacing)+1),
        note:"under level "+k+"'s "+legName+" inner rim, down to the deck"});
    }
  }
  return blocks;
}

/* ---------- 15. platform framing ----------------------------------------- */
function platformModel(model){
  const surf = sk(S.platSurface), frame = sk(S.platFrame);
  /* Frame height reaches from the underside of its decking down to bearing. */
  const height = model.H - surf.t + model.base;
  const dir = S.platJoistDir;                     // 'y' = out from wall, 'x' = along wall
  const alongJoist = dir==="y" ? model.Wy : model.Wx;
  const acrossJoist = dir==="y" ? model.Wx : model.Wy;
  const joistLen = Math.max(0, alongJoist-2*frame.t);
  const joistCount = Math.max(2, Math.ceil(acrossJoist/(surf.span||16))+1);   // ceil: see boxesForLevel
  const rimPieces = [
    {len:model.Wx, qty:2, role:"platform rim (X, full length)"},
    {len:Math.max(0,model.Wy-2*frame.t), qty:2, role:"platform rim (Y, fit between)"}
  ];
  /* The platform IS the top tread, so its decking overhangs the two faces that
     have steps below them by the nosing — same detail as every other tread.
     The frame stays Wx × Wy; only the decking is bigger. */
  /* Overhang past the frame = riser thickness (the platform's own riser board
     is captured under this decking) + the nosing. */
  const nose = model.nose, over = model.riserT + nose;
  const deckBoardLen = (dir==="y" ? model.Wx : model.Wy) + over;   // boards run across the overhung face
  const deckFillDim  = (dir==="y" ? model.Wy : model.Wx) + over;
  const deckFit = fitBoards(deckFillDim, surf.w, S.treadGap);
  /* FLOATING platform, built entirely from the platform frame stock: a box
     frame whose depth is that stock's width, standing on legs cut from the
     same stock. Nothing is attached to the house. */
  const frameDepth = frame.w;
  const legH = height - frameDepth;                       // what the legs have to make up
  const legSpan = frame.span || 24;
  const legCols = Math.max(2, Math.ceil(model.Wx/legSpan)+1);
  const legRows = Math.max(2, Math.ceil(model.Wy/legSpan)+1);
  const needsLegs = legH > 0.25;
  const legCount = needsLegs ? legCols*legRows : 0;
  const ripFrame = height < frameDepth - 0.0626;          // stock deeper than the whole platform
  return {height, dir, joistLen, joistCount, rimPieces, deckFit, deckBoardLen, deckFillDim,
          surf, frame, nose, finX:model.platFinX, finY:model.platFinY,
          frameDepth, legH, legSpan, legCols, legRows, legCount, needsLegs, ripFrame,
          braceNeeded: needsLegs && legH > 3*frame.t*2};
}
/* ---------- 15b. skirts on the open side face (X=0) ---------------------- */
/* The exposed end runs from the platform face (y=Wy, z=H) down to the deck
   (y=footY, z=0), so a single raking skirt board covers it. Minimum board
   width has to reach from the nosing line past the step corners. */
function skirtPieces(model){
  const runTotal = (model.N-1)*model.R + model.nose;
  const rake = hyp(runTotal, model.H);
  const minW = model.r*model.R/hyp(model.r,model.R) + 2;
  const out = [{role:t("Side skirt (open X=0 face)"), stock:S.skirtStock, len:rake, qty:1, angle:t("rake"),
    note:t("cut to the step profile; needs a board at least {0} wide ({1} is {2})", fmtIn(minW), S.skirtStock, fmtIn(sk(S.skirtStock).w))}];
  if(S.includePlatform)
    out.push({role:t("Platform side skirt (X=0)"), stock:S.skirtStock, len:model.Wy, qty:1,
      note:t("clads the platform rim on the open side")});
  return out;
}
function skirtInfo(model){
  const minW = model.r*model.R/hyp(model.r,model.R) + 2;
  return {rake: hyp((model.N-1)*model.R+model.nose, model.H), minW, wide: sk(S.skirtStock).w >= minW};
}

/* ---------- 16. piece collection ----------------------------------------- */
function collectPieces(model){
  const pieces = [];
  const style = S.cornerStyle==="through" ? "through" : "miter";  // compare uses miter for the cut list
  for(const lvl of model.levels){
    for(const legName of ["front","side"]){
      const tb = treadLegBoards(legName, lvl.k, model, style);
      for(const b of tb.boards){
        pieces.push({role:t("Tread L{0} {1} bd{2}", lvl.k, t(legName), b.j), stock:S.treadStock, len:b.long, qty:1,
          angle: style==="miter" ? "45°/90°" : "90°/90°", note:t("offset {0}", fmtIn(b.o))});
      }
    }
  }
  if(S.riserStyle==="closed"){
    const rb = riserBoards(model);
    for(const row of rb.rows){
      pieces.push({role:t("Riser {0} {1}", row.k, t("front")), stock:S.riserStock, len:row.front.long, qty:1, angle:"45°/90°"});
      pieces.push({role:t("Riser {0} {1}", row.k, t("side")), stock:S.riserStock, len:row.side.long, qty:1, angle:"45°/90°"});
    }
  }
  if(S.method==="stringers"){
    for(const legName of ["front","side"]){
      const st = stringersForLeg(legName, model);
      for(const s of st.list){
        /* The PIECE is the stringer's cut length, not the stock it comes from —
           feeding the stock length in here made the packer buy a whole board per
           stringer instead of nesting two or three on one. */
        pieces.push({role:t("{0} stringer ({1} notches)", t(legName), s.c), stock:S.stringerStock, len:s.reqLen, qty:1,
          angle:t("layout marks"), note:t("at {0}", fmtIn(s.pos))+(s.boardLen?"":t(" — needs splice"))});
      }
    }
    const hip = hipStringer(model);
    pieces.push({role:t("Hip stringer ({0} notches)", hip.c), stock:S.stringerStock, len:hip.reqLen, qty:1,
      angle:t("45° plan bevel"), note: hip.boardLen?"":t("needs splice")});
  } else {
    for(const lvl of model.levels){
      const bx = boxesForLevel(model, lvl.k);
      const rimNote = t("rim height {0}", fmtIn(bx.rimH))+(bx.isBottom&&model.base>0?t(" (deeper — bears on the deck structure)"):"");
      for(const leg of bx.legs){
        pieces.push({role:t("Box {0} {1} outer rim", lvl.k, t(leg.legName)), stock:S.frameStock, len:leg.outer, qty:1, angle:"45°", note:rimNote});
        pieces.push({role:t("Box {0} {1} inner rim", lvl.k, t(leg.legName)), stock:S.frameStock, len:leg.inner, qty:1, angle:"45°", note:rimNote});
        pieces.push({role:t("Box {0} {1} joist", lvl.k, t(leg.legName)), stock:S.frameStock, len:leg.joistLen, qty:leg.joistCount, angle:"90°"});
      }
      pieces.push({role:t("Box {0} corner block", lvl.k), stock:S.frameStock, len:hyp(sk(S.frameStock).w,sk(S.frameStock).w), qty:1, angle:"45°"});
    }
    for(const blk of boxSupportBlocks(model)){
      pieces.push({role:t("Support block (box {0} {1})", blk.k, t(blk.legName)), stock:S.frameStock,
        len:Math.max(blk.height,0.25), qty:blk.qty,
        note:t("under level {0}'s {1} inner rim, down to the deck", blk.k, t(blk.legName))});
    }
  }
  /* Skirts. Only the X=0 side face is ever exposed — the wall closes Y=0, and
     the other two faces are the stairs themselves. */
  if(S.faceX0==="open"){
    const sk1 = skirtPieces(model);
    for(const p of sk1) pieces.push(p);
  }
  if(S.includePlatform){
    const pf = platformModel(model);
    for(const rp of pf.rimPieces) pieces.push({role:t(rp.role), stock:S.platFrame, len:rp.len, qty:rp.qty});
    pieces.push({role:t("Platform joist"), stock:S.platFrame, len:pf.joistLen, qty:pf.joistCount});
    if(pf.needsLegs)
      pieces.push({role:t("Platform leg (floating)"), stock:S.platFrame, len:pf.legH, qty:pf.legCount,
        note:t("{0} × {1} grid at {2} o.c.", pf.legCols, pf.legRows, fmtIn(pf.legSpan))});
    pieces.push({role:t("Platform decking"), stock:S.platSurface, len:pf.deckBoardLen, qty:pf.deckFit.n + (pf.deckFit.recommend==="rip"?1:pf.deckFit.recommend==="overshoot"?1:0)});
  }
  return pieces.filter(p=>p.len>0 && p.qty>0);
}

/* ---------- 17. bin packing (first-fit-decreasing) ----------------------- */
/* When a new bin is needed, try every stock length long enough for the
   current (largest remaining) piece, simulate packing the rest into it,
   and keep whichever length gives the best fill. */
function binPack(pieces){
  const kerf = S.kerf, minOff = S.minOffcut;
  const stockLens = parseStockLens();
  const byStock = {};
  for(const p of pieces) (byStock[p.stock] = byStock[p.stock] || []).push(p);
  const out = {};
  for(const stockName in byStock){
    let items = [];
    for(const p of byStock[stockName]) for(let i=0;i<p.qty;i++) items.push({len:p.len, role:p.role});
    items.sort((a,b)=>b.len-a.len);
    const bins = [];
    while(items.length){
      const first = items[0];
      const candidates = stockLens.filter(L=>L>=first.len);
      const tryLens = candidates.length ? candidates : [Math.max(first.len, stockLens.length?Math.max(...stockLens):first.len)];
      let best = null;
      for(const L of tryLens){
        let remaining = L, taken = [], used = 0;
        for(let idx=0; idx<items.length; idx++){
          const it = items[idx];
          const need = it.len + (used>0 ? kerf : 0);
          if(need <= remaining){ remaining -= need; used++; taken.push(idx); }
        }
        const fill = (L-remaining)/L;
        if(!best || fill>best.fill || (fill===best.fill && L<best.L)) best = {L, taken, fill, remaining};
      }
      const cuts = best.taken.map(i=>items[i]);
      bins.push({stockLen:best.L, cuts, waste:best.remaining});
      best.taken.sort((a,b)=>b-a).forEach(i=>items.splice(i,1));
    }
    out[stockName] = bins.map(b=>({...b, wastePct: b.stockLen?(b.waste/b.stockLen*100):0, offcutUsable: b.waste>=minOff}));
  }
  return out;
}

/* ---------- 18. SVG drawing helpers -------------------------------------- */
function svgOpen(w,h){ return '<svg viewBox="0 0 '+w.toFixed(0)+' '+h.toFixed(0)+'" xmlns="http://www.w3.org/2000/svg">'; }
function svgLine(x1,y1,x2,y2,extra){ return '<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" '+(extra||'stroke="#334" stroke-width="1"')+'/>'; }
function svgText(x,y,s,extra){ return '<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" '+(extra||'font-size="10" fill="#334"')+'>'+s+'</text>'; }
function svgRect(x,y,w,h,extra){ return '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'" '+(extra||'fill="none" stroke="#334"')+'/>'; }
/* Rough advance width of an SVG label. Used to size gutters and canvases from
   the ACTUAL text, so a longer translation cannot run off the drawing. */
function estTextW(s,fs){ return String(s).length*(fs||10)*0.55; }
function svgPoly(pts,extra){ return '<polygon points="'+pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")+'" '+(extra||'fill="none" stroke="#334"')+'/>'; }
function dimLineH(x1,x2,y,label){
  const t=4;
  return svgLine(x1,y,x2,y,'stroke="#333" stroke-width=".75"')
    +svgLine(x1,y-t,x1,y+t,'stroke="#333" stroke-width=".75"')
    +svgLine(x2,y-t,x2,y+t,'stroke="#333" stroke-width=".75"')
    +'<text x="'+((x1+x2)/2).toFixed(1)+'" y="'+(y-5).toFixed(1)+'" font-size="10" fill="#333" text-anchor="middle">'+label+'</text>';
}
function dimLineV(x,y1,y2,label,side){
  const t=4, left = side==="left";
  return svgLine(x,y1,x,y2,'stroke="#333" stroke-width=".75"')
    +svgLine(x-t,y1,x+t,y1,'stroke="#333" stroke-width=".75"')
    +svgLine(x-t,y2,x+t,y2,'stroke="#333" stroke-width=".75"')
    +'<text x="'+(left?x-6:x+6).toFixed(1)+'" y="'+((y1+y2)/2).toFixed(1)+'" font-size="10" fill="#333" text-anchor="'+(left?"end":"start")+'">'+label+'</text>';
}
function scaleBarSVG(x,y,scale){ const oneFoot=12*scale; return svgLine(x,y,x+oneFoot,y,'stroke="#000" stroke-width="2"')+svgText(x,y-4,t("scale: 1 ft"),'font-size="9" fill="#000"'); }
/* leader line from a point on the drawing out to a label in the gutter */
function svgLead(px,py,tx,ty,txt,anchor){
  return svgLine(px,py,tx+(anchor==="end"?6:-6),ty-3,'stroke="#7a8794" stroke-width=".7"')
    +'<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="1.7" fill="#7a8794"/>'
    +'<text x="'+tx.toFixed(1)+'" y="'+ty.toFixed(1)+'" font-size="10" fill="#223" text-anchor="'+(anchor||"start")+'">'+txt+'</text>';
}
/* ---------- 18b. materials palette & section geometry -------------------- */

  tread:'fill="#e6bd8c" stroke="#a97b45" stroke-width=".8"',

function materialsLegend(){
  return legendHTML([["#e6bd8c","#a97b45",t("tread boards ({0})", S.treadStock)],
    ["#d3a06a","#a97b45",t("riser boards ({0})", S.riserStyle==="closed"?S.riserStock:t("none — open"))],
    [S.method==="boxes"?"#c2a884":"#cdb693", "#8a6a45",
      S.method==="boxes"?t("box frame / joists ({0})", S.frameStock):t("stringers ({0})", S.stringerStock)],
    ["#cfe0ef","#5b87ad",t("platform frame")],
    ["#d3d9df","#9aa6b2",t("existing deck / house wall")]]);
}
/* The front-leg section: every piece of material, in stair coordinates
   (u = distance out from the house wall, z = height above the deck surface). */
/* Laid out from the NOSING inwards: board 1 is a full board with its front
   edge ON the nosing tip, and any odd piece is ripped at the BACK, where the
   riser board covers it. Overshooting backwards is not an option — behind the
   tread's back edge sits the frame of the level above. */
function treadBoardWidths(model){
  const stock=sk(S.treadStock), gap=S.treadGap, T=model.Tb, w=stock.w;
  const fit=fitBoards(T, w, gap);                    // kept for the alternatives readout
  const nFull=Math.max(1, Math.floor((T+gap)/(w+gap)));
  const covered=nFull*w+(nFull-1)*gap, rem=T-covered;
  let widths=Array(nFull).fill(w), backRip=0, exact=false, slack=0;
  if(rem<0.0626) exact=true;                         // back edge lands on the frame
  else if(rem<=gap+0.0626) slack=rem;                // absorbed by a wider gap at the back
  else { backRip=rem-gap; widths.push(backRip); }    // filler strip at the back
  return {widths, effGap:gap, fit, nFull, backRip, exact, slack, T};
}
/* Front-anchored offsets, measured from the tread's back edge datum.
   Index 0 is the nosing board. */
function treadBoardOffsets(model){
  const {widths, effGap}=treadBoardWidths(model);
  const out=[]; let front=model.Tb;
  for(const w of widths){ const back=front-w; out.push({o:back, w}); front=back-effGap; }
  return out;
}
function sectionPieces(model){
  const tt=sk(S.treadStock).t, rt=sk(S.riserStock).t;
  const st=S.includePlatform ? sk(S.platSurface).t : tt;
  const {widths, effGap} = treadBoardWidths(model);
  const {Wy,R,nose,r,N,H} = model;
  const treads=[], risers=[], frames=[];
  const offs = treadBoardOffsets(model);
  for(let k=1;k<=N-1;k++){
    const z=H-k*r, u0=Wy+(k-1)*R;
    const bds = offs.map(b=>({u:u0+b.o, w:b.w}));      // front-anchored on the nosing
    treads.push({k, z, u0, u1:u0+R, bds, depth:model.Tb});
    // zBot = z_(k+1); the bottom step reaches the bearing plane, which is -base
    frames.push({k, u0, u1:u0+R, zTop:z-tt, zBot:(k===N-1 ? -model.base : H-(k+1)*r)});
  }
  for(let k=1;k<=N;k++){                                        // riser 1 = platform face
    risers.push({k, u:Wy+(k-1)*R, zTop:(k===1? H-st : H-(k-1)*r-tt), zBot:H-k*r});
  }
  return {treads, risers, frames, tt, rt, st, widths, effGap};
}
/* ---------- 18c. terminology diagram ------------------------------------- */
function renderTerminologySVG(model){
  const r=model.r, R=model.R, n=model.nose;
  const tt=sk(S.treadStock).t, rt=sk(S.riserStock).t, st=S.includePlatform?sk(S.platSurface).t:tt;
  const sc=Math.min(12, 190/Math.max(R,1), 150/Math.max(r,1));
  const pd=Math.min(model.Wy,15);                                // platform shown, truncated
  const base=model.base, dT=model.deckT, jD=5.5;
  const closed0 = S.riserStyle==="closed";
  /* Gutters are sized from the real label text so a longer translation cannot
     push a leader line off the canvas. */
  const LBL_L=[t("platform decking = the top tread"),
    base>0?t("platform frame — down to the joists"):t("platform frame — sits on the decking"),
    t("existing deck joists"),
    base>0?t("existing decking — cut away under the stair"):t("existing decking, z = 0 on top"),
    closed0?t("riser 1 = the platform's own face"):"", t("total rise H"),
    base>0?t("framing {0} deeper — rise unchanged", fmtIn(base)):""];
  const LBL_R=[t("tread board ({0} × {1})", S.treadStock, treadBoardWidths(model).widths.length),
    S.riserStyle==="open"?t("riser board (omitted — open riser)"):t("riser board ({0})", S.riserStock),
    S.method==="boxes"?t("box rim / frame"):t("cut stringer behind"),
    t("bearing: rim above lands over the rim below"), t("unit rise r"),
    t("tread surface — level {0} height z", model.N-1), n>0.01?t("nosing {0}", fmtIn(n)):""];
  const FOOT=t("schematic — 2 steps of your actual rise/run shown");
  const gl=Math.max(...LBL_L.map(s=>estTextW(s,10)))+24;
  const gr=Math.max(...LBL_R.map(s=>estTextW(s,10)))+26;
  const mT=18, mB=34;
  const rt0=model.riserT;
  const uMin=-5, uMax=pd+2*R+rt0+n+6, zMax=3*r+2.5, zMin=-(dT+jD)-1;
  const W=Math.max(gl+(uMax-uMin)*sc+gr, gl+estTextW(FOOT,9)+24), H=(zMax-zMin)*sc+mT+mB;
  const X=u=>gl+(u-uMin)*sc, Y=z=>mT+(zMax-z)*sc;
  const box=(u0,u1,z0,z1,style)=>svgRect(X(u0),Y(z1),(u1-u0)*sc,(z1-z0)*sc,style);
  let s=svgOpen(W,H);
  s+=box(-5,0,zMin,3*r,MAT.wall)+svgText(X(-4.6),Y(3*r)-5,t("house"),'font-size="9" fill="#78838f"');
  s+=box(uMin,uMax,-dT-jD,-dT,MAT.exist);                        // existing joists
  if(base>0) s+=box(pd+2*R+n,uMax,-dT,0,MAT.exist);              // decking, cut away under the stair
  else s+=box(uMin,uMax,-dT,0,MAT.exist);
  s+=box(0,pd,-base,3*r-st,MAT.plat);
  s+=svgLine(X(pd*0.5),Y(0),X(pd*0.5),Y(3*r),'stroke="#5b87ad" stroke-width=".7" stroke-dasharray="3 3"');
  s+=svgText(X(1),Y(3*r-st)+13,t("platform continues to the wall"),'font-size="8.5" fill="#5b87ad"');
  // two steps, exactly as the calculator builds them
  const lv=[{z:2*r,u0:pd},{z:r,u0:pd+R}];
  const structStyle = S.method==="boxes" ? MAT.frame : MAT.string;
  const closed = S.riserStyle==="closed";
  for(const l of lv){
    const bot = (l.z===r) ? -base : l.z-r;                       // bottom step reaches bearing
    s+=box(l.u0,l.u0+R,bot,l.z-tt,structStyle);                  // box rim / stringer
    s+=box(l.u0,l.u0+R+rt0+n,l.z-tt,l.z,MAT.tread);              // tread — laps the riser, then the nosing
    s+=svgLine(X(l.u0+R/2),Y(l.z),X(l.u0+R/2),Y(l.z-tt),'stroke="#a97b45" stroke-width=".6"');
    if(closed) s+=box(l.u0+R,l.u0+R+rt,bot,l.z-tt,MAT.riser);    // riser below/in front
  }
  s+=box(0,pd+rt0+n,3*r-st,3*r,MAT.platDeck);                    // platform decking, overhanging the riser face
  if(closed) s+=box(pd,pd+rt,2*r,3*r-st,MAT.riser);              // riser 1 clads the platform face, on its outside
  // ---- labels, left gutter
  const Lx=gl-14;
  s+=svgLead(X(pd*0.6),Y(3*r-st/2),Lx,Y(3*r)-4,LBL_L[0],"end");
  s+=svgLead(X(pd*0.75),Y(1.9*r),Lx,Y(3*r)+12,LBL_L[1],"end");
  s+=svgLead(X(-2.5),Y(-dT-jD/2),Lx,Y(0)+18,LBL_L[2],"end");
  s+=svgLead(X(uMax-3),Y(-dT/2),Lx,Y(0)+30,LBL_L[3],"end");
  if(closed) s+=svgLead(X(pd+rt/2),Y(2.5*r),Lx,Y(2.6*r),LBL_L[4],"end");
  s+=dimLineV(X(-3.2),Y(3*r),Y(0),LBL_L[5],"left");
  if(base>0) s+=dimLineV(X(-3.2),Y(0),Y(-base),LBL_L[6],"left");
  // ---- labels, right gutter
  const Rx=X(uMax)+16;
  const t1=lv[0], t2=lv[1];
  s+=svgLead(X(t1.u0+R*0.55),Y(t1.z-tt/2),Rx,Y(3*r)-2,LBL_R[0]);
  s+=svgLead(X(t1.u0+R+rt/2),Y(t1.z-r/2),Rx,Y(3*r)+14,LBL_R[1]);
  s+=svgLead(X(t1.u0+R*0.3),Y(t1.z-tt-(r-tt)/2),Rx,Y(3*r)+30,LBL_R[2]);
  s+=svgLead(X(t2.u0+2),Y(t2.z+0.4),Rx,Y(3*r)+46,LBL_R[3]);
  s+=dimLineV(X(uMax-2.5),Y(2*r),Y(r),LBL_R[4]);
  /* run = nosing tip to nosing tip */
  const tip1=t1.u0+R+rt0+n, tip2=t2.u0+R+rt0+n;
  s+=svgLine(X(tip1),Y(t1.z),X(tip1),Y(0)+20,'stroke="#999" stroke-width=".6" stroke-dasharray="2 2"');
  s+=svgLine(X(tip2),Y(t2.z),X(tip2),Y(0)+20,'stroke="#999" stroke-width=".6" stroke-dasharray="2 2"');
  s+=dimLineH(X(tip1),X(tip2),Y(0)+16,t("unit run R — nosing to nosing"));
  // walking depth: riser face behind, to the nosing tip in front
  s+=dimLineH(X(t2.u0+rt0),X(t2.u0+R+rt0+n),Y(0)+32,t("tread depth T = R + nosing"));
  if(n>0.01) s+=svgLead(X(t2.u0+R+rt0+n/2),Y(t2.z-tt/2),Rx,Y(0)+8,LBL_R[6]);
  s+=svgLead(X(t2.u0+R*0.5),Y(t2.z),Rx,Y(r)+2,LBL_R[5]);
  s+=scaleBarSVG(gl,H-10,sc);
  s+=svgText(gl,H-22,FOOT,'font-size="9" fill="#78838f"');
  s+="</svg>";
  return s;
}

/* Realistic plan: every board drawn at its true width with its real gap and
   mitered end, framing below shown as hidden (dashed) lines. */
function renderPlanSVG(model){
  const {Wx,Wy,R,nose,N,footX,footY}=model;
  const style = S.cornerStyle==="through" ? "through" : "miter";
  const capBottom=t("front leg — steps descend this way (+Y)");
  const rightLabels=[t("side leg (+X)"), t("45° miter line"), t("hip stringer")];
  const mL=52, mT=40, mB=52;
  const mR=Math.max(76, Math.max(...rightLabels.map(s=>estTextW(s,9)))+24);
  const scale=Math.min(7.5, 690/Math.max(footX+5,1));
  const W=Math.max(mL+(footX+5)*scale+mR, mL+estTextW(capBottom,9)+24), H=mT+(footY+5)*scale+mB;
  const X=x=>mL+x*scale, Y=y=>mT+y*scale;
  let s=svgOpen(W,H);
  // house wall along y=0, and the open/walled far side face at x=0
  s+=svgRect(X(0)-4,Y(-4),(footX+4)*scale+4,4*scale,MAT.wall);
  s+=svgText(X(1),Y(-4)+12,t("house wall"),'font-size="10" fill="#78838f"');
  if(S.faceX0==="wall") s+=svgRect(X(-4),Y(-4),4*scale,(footY+4)*scale,MAT.wall);
  else s+=svgText(X(0)-8,Y(footY/2),t("open side (skirt)"),'font-size="9" fill="#a06a2c" transform="rotate(-90 '+(X(0)-8).toFixed(1)+' '+Y(footY/2).toFixed(1)+')" text-anchor="middle"');
  // platform frame (its decking is drawn later, so the nosing overhangs the treads)
  s+=svgRect(X(0),Y(0),Wx*scale,Wy*scale,MAT.plat);
  // tread boards, level by level
  for(const lvl of model.levels){
    const k=lvl.k;
    for(const legName of ["front","side"]){
      const tb=treadLegBoards(legName,k,model,style);
      const base=(legName==="front"?Wy:Wx)+(k-1)*R;      // depth coordinate of the tread's inner edge
      for(const b of tb.boards){
        const a=base+b.o, c2=a+b.w;                       // this board's near/far edge in the depth direction
        if(legName==="front"){
          s+=(style==="miter")
            ? svgPoly([[X(0),Y(a)],[X(b.short),Y(a)],[X(b.long),Y(c2)],[X(0),Y(c2)]],MAT.tread)
            : svgRect(X(0),Y(a),b.long*scale,b.w*scale,MAT.tread);
        } else {
          s+=(style==="miter")
            ? svgPoly([[X(a),Y(0)],[X(a),Y(b.short)],[X(c2),Y(b.long)],[X(c2),Y(0)]],MAT.tread)
            : svgRect(X(a),Y(0),b.w*scale,b.long*scale,MAT.tread);
        }
      }
    }
    // miter line and level tag
    const ix=Wx+(k-1)*R, iy=Wy+(k-1)*R, ox=Wx+k*R+model.riserT+nose, oy=Wy+k*R+model.riserT+nose;
    if(style==="miter") s+=svgLine(X(ix),Y(iy),X(ox),Y(oy),'stroke="#8c3b3b" stroke-width="1.1" stroke-dasharray="5 3"');
    s+=svgText(X(ox)-5,Y(oy)-5,"L"+k,'font-size="9.5" fill="#6b4a2a" text-anchor="end"');
  }
  /* Platform decking last, so its nosing overhangs level 1's tread the same way
     every tread overhangs the one below it. Frame is Wx × Wy; decking is +nosing
     on the two faces that have steps. */
  const fX=model.platFinX, fY=model.platFinY;
  if(S.includePlatform){
    const ps=sk(S.platSurface), pg=S.treadGap;
    if(S.platJoistDir==="y"){ for(let o=0;o<fY-0.01;o+=ps.w+pg) s+=svgRect(X(0),Y(o),fX*scale,Math.min(ps.w,fY-o)*scale,MAT.platDeck); }
    else { for(let o=0;o<fX-0.01;o+=ps.w+pg) s+=svgRect(X(o),Y(0),Math.min(ps.w,fX-o)*scale,fY*scale,MAT.platDeck); }
  } else s+=svgRect(X(0),Y(0),fX*scale,fY*scale,MAT.platDeck);
  if(model.nose>0.01){
    s+=svgLine(X(0),Y(Wy),X(Wx),Y(Wy),'stroke="#5b87ad" stroke-width=".8" stroke-dasharray="3 2"');
    s+=svgLine(X(Wx),Y(0),X(Wx),Y(Wy),'stroke="#5b87ad" stroke-width=".8" stroke-dasharray="3 2"');
    s+=svgText(X(Wx)+3,Y(Wy)+11,t("platform frame {0} × {1}", L(Wx), L(Wy)),'font-size="8.5" fill="#5b87ad"');
  }
  s+=svgText(X(Math.min(Wx,fX)/2),Y(Wy/2),
    model.nose>0.01 ? t("platform {0} × {1} finished", L(fX), L(fY)) : t("platform {0} × {1}", L(fX), L(fY)),
    'font-size="10" fill="#33556e" text-anchor="middle"');
  if(style==="miter") s+=svgText(X(footX)+6,Y(footY)-2,t("45° miter line"),'font-size="9" fill="#8c3b3b"');
  // framing below, hidden-line dashed
  const dash='stroke="#4c6076" stroke-width=".8" stroke-dasharray="3 2.5"';
  if(S.method==="boxes"){
    for(const lvl of model.levels){
      const bx=boxesForLevel(model,lvl.k);
      for(const leg of bx.legs){
        const inner=(leg.legName==="front"?Wy:Wx)+(lvl.k-1)*R, outer=inner+R;
        if(leg.legName==="front"){
          s+=svgLine(X(0),Y(inner),X(Wx+(lvl.k-1)*R),Y(inner),dash);
          s+=svgLine(X(0),Y(outer),X(leg.outer),Y(outer),dash);
          for(let i=0;i<leg.joistCount;i++){ const x=Math.min(i*leg.joistSpacing,leg.outer); s+=svgLine(X(x),Y(inner),X(x),Y(outer),dash); }
        } else {
          s+=svgLine(X(inner),Y(0),X(inner),Y(Wy+(lvl.k-1)*R),dash);
          s+=svgLine(X(outer),Y(0),X(outer),Y(leg.outer),dash);
          for(let i=0;i<leg.joistCount;i++){ const y=Math.min(i*leg.joistSpacing,leg.outer); s+=svgLine(X(inner),Y(y),X(outer),Y(y),dash); }
        }
      }
    }
  } else {
    for(const legName of ["front","side"]){
      const st=stringersForLeg(legName,model);
      for(const g of st.list){
        const start=(legName==="front"?Wy:Wx)+(g.kmin-1)*R;
        if(legName==="front") s+=svgLine(X(g.pos),Y(start),X(g.pos),Y(footY),dash);
        else s+=svgLine(X(start),Y(g.pos),X(footX),Y(g.pos),dash);
      }
    }
    s+=svgLine(X(Wx),Y(Wy),X(footX),Y(footY),'stroke="#4c6076" stroke-width="1.6" stroke-dasharray="6 3"');
    s+=svgText(X(footX)+6,Y(footY)+12,t("hip stringer"),'font-size="9" fill="#4c6076"');
  }
  s+=svgText(mL,Y(footY)+34,capBottom,'font-size="9" fill="#667"');
  s+=svgText(X(footX)+16,Y(footY/2),t("side leg (+X)"),'font-size="9" fill="#667"');
  s+=dimLineH(X(0),X(footX),Y(footY)+18,L(footX));
  s+=dimLineV(X(footX)+46,Y(0),Y(footY),L(footY));
  s+=scaleBarSVG(mL,H-12,scale);
  s+="</svg>";
  return s;
}

function renderElevationSVG(model){
  /* Realistic section through the FRONT leg: u = distance out from the house
     wall, z = height above the existing deck surface. The platform is drawn
     cut short (break line) so the steps stay large and legible. */
  const P=sectionPieces(model);
  const {r,R,N,H,nose,Wy,base,deckT}=model;
  const joistD=7.25;                                    // existing deck joist, drawn only
  const pd=Math.min(Wy,18), shift=Wy-pd;
  const uMin=-5, uMax=pd+(N-1)*R+model.riserT+nose+P.rt+8;
  /* A stringer's plumb cut at the platform reaches bw·Ls/R below the first
     seat, which on a steep pitch dips below the deck framing. */
  const plumbLow = S.method==="stringers" ? (H-P.tt)-sk(S.stringerStock).w*hyp(r,R)/R : 0;
  const zMin=Math.min(-(deckT+joistD)-1, plumbLow-1), zMax=H+3;
  const scale=Math.min(7.5, 620/(uMax-uMin));
  /* Left margin has to hold the rise dimension and the bearing note, which are
     anchored to its right edge — size it from the actual text. */
  const dimLbl=t("H = {0}", L(H)), note1=t("framing only —"), note2=t("rise is unchanged");
  const footer=t("section through the front leg — the side leg is identical, using the platform's other dimension");
  const mL=Math.max(96, estTextW(dimLbl,10)+22, estTextW(note1,8.5)+18, estTextW(note2,8.5)+18);
  const mR=44, mT=22, mB=64;
  const W=Math.max(mL+(uMax-uMin)*scale+mR, mL+estTextW(footer,9)+24), Ht=mT+(zMax-zMin)*scale+mB;
  const D=u=>u-shift, X=d=>mL+(d-uMin)*scale, Y=z=>mT+(zMax-z)*scale;
  const box=(u0,u1,z0,z1,st)=>svgRect(X(D(u0)),Y(z1),(u1-u0)*scale,(z1-z0)*scale,st);
  const boxD=(d0,d1,z0,z1,st)=>svgRect(X(d0),Y(z1),(d1-d0)*scale,(z1-z0)*scale,st);
  let s=svgOpen(W,Ht);
  s+=svgRect(X(uMin),Y(H+1),(0-uMin)*scale,(H+1-zMin)*scale,MAT.wall);
  s+=svgText(X(uMin)+3,Y(H+1)+12,t("house"),'font-size="9" fill="#78838f"');
  /* Existing deck: joists always, decking either full width or cut away where
     the new framing bears on the structure. */
  s+=boxD(uMin,uMax,-deckT-joistD,-deckT,MAT.exist);
  s+=svgText(X(uMax)-4,Y(-deckT-joistD)+12,t("existing deck joists"),'font-size="9" fill="#78838f" text-anchor="end"');
  const outerEdge=D(Wy+(N-1)*R+nose);
  if(base>0){
    s+=boxD(outerEdge,uMax,-deckT,0,MAT.exist);
    s+=svgLine(X(uMin),Y(0),X(outerEdge),Y(0),'stroke="#9aa6b2" stroke-width=".8" stroke-dasharray="4 3"');
    s+=svgText(X(uMin)+4,Y(0)-4,t("decking cut away — framing bears on the joists"),'font-size="8.5" fill="#8a6a45"');
    s+=svgText(X(uMax)-4,Y(-deckT)+11,t("existing decking {0}", fmtIn(deckT)),'font-size="8.5" fill="#78838f" text-anchor="end"');
  } else {
    s+=boxD(uMin,uMax,-deckT,0,MAT.exist);
    s+=svgText(X(uMax)-4,Y(0)+12,t("existing deck surface"),'font-size="9" fill="#78838f" text-anchor="end"');
  }
  /* Floating platform: frame stock on edge at the top, legs of the same stock
     below — drawn as it is actually built, not as a solid block. */
  if(S.includePlatform){
    const pf=platformModel(model);
    const frameTop=H-P.st, frameBot=Math.max(-base, frameTop-pf.frameDepth);
    s+=box(Wy-pd,Wy,frameBot,frameTop,MAT.plat);
    if(pf.needsLegs){
      const legT=Math.max(pf.frame.t,1);
      for(const lu of [Wy-pd+0.5, Wy-legT-0.5]) s+=box(lu,lu+legT,-base,frameBot,MAT.plat);
      const midU=Wy-pd/2;
      if(pd>legT*6) s+=box(midU,midU+legT,-base,frameBot,MAT.plat);
      s+=svgLead(X(D(Wy-legT-0.5))-2,Y((frameBot-base)/2),X(D(Wy-pd))+4,Y(-base)-6,
        t("{0} legs @ {1}", pf.legCount, fmtIn(pf.legH)));
    }
  } else s+=box(Wy-pd,Wy,-base,H-P.st,MAT.plat);
  s+=svgLine(X(2),Y(-base),X(2),Y(H),'stroke="#5b87ad" stroke-width=".9" stroke-dasharray="5 3"');
  s+=svgText(X(3.5),Y(H)-5,(shift>0.5?t("platform {0} deep, shown cut", L(Wy)):t("platform")),'font-size="8.5" fill="#33556e"');
  if(S.method==="stringers"){
    const Ls=hyp(r,R), bw=sk(S.stringerStock).w;
    /* PROPORTIONS. The board's top edge is the nosing line — the line through
       the FRONT corner of every seat, i.e. (Wy+kR, H−kr−tt). Extrapolated back
       to the platform face that is H − tt, one riser ABOVE the first seat's
       back corner. Offsetting the lower edge from that back corner (the notch
       apex) instead is what drew a 2x12 as a plank: the apex line sits
       r·cosθ below the true edge, so the board came out bw + notch deep.
       Lower edge = bw perpendicular below the nosing line, which on a vertical
       cut is bw·Ls/R down. */
    const edgeAtFace = H - P.tt;                           // nosing line at u = Wy
    const lowAtFace  = edgeAtFace - bw*Ls/R;               // lower edge at u = Wy
    const seatTop    = H - r - P.tt;                       // first seat = top of the plumb face
    const pts=[];
    for(let k=1;k<=N-1;k++){ pts.push([Wy+(k-1)*R, H-k*r-P.tt]); pts.push([Wy+k*R, H-k*r-P.tt]); }
    pts.push([Wy+(N-1)*R, -base]);                         // bottom plumb face, down to bearing
    /* Level cut runs along the bearing plane to wherever the lower edge meets
       it; on a short flight the lower edge can reach bearing before the face. */
    const cutU = Wy + Math.max(0, lowAtFace+base)*R/r;
    pts.push([cutU, -base]);
    if(lowAtFace > -base) pts.push([Wy, lowAtFace]);       // back up the lower edge to the face
    s+=svgPoly(pts.map(p=>[X(D(p[0])),Y(p[1])]),MAT.string);
    // the nosing line the notches are laid out from
    s+=svgLine(X(D(Wy)),Y(edgeAtFace),X(D(Wy+(N-1)*R)),Y(edgeAtFace-(N-1)*r),
      'stroke="#0f6fbf" stroke-width=".9" stroke-dasharray="4 3"');
    const plumbBot=Math.max(lowAtFace,-base);
    s+=svgLine(X(D(Wy)),Y(seatTop),X(D(Wy)),Y(plumbBot),'stroke="#6b5335" stroke-width="1.6"');
    s+=svgLead(X(D(Wy)),Y((seatTop+plumbBot)/2),X(D(Wy))+22,Y(plumbBot)-6,t("plumb cut against the platform rim"));
    s+=svgText(X(D(Wy+(N-1)*R))-6,Y(-base)-7,t("cut stringer"),'font-size="9" fill="#6b5335" text-anchor="end"');
    if(base>0) s+=svgLead(X(D(Wy+(N-1)*R))-14,Y(-base/2),X(D(Wy+(N-1)*R))-20,Y(-deckT-joistD)+24,t("level cut bears on the joist"),"end");
  } else {
    for(const f of P.frames) s+=box(f.u0,f.u1,f.zBot,f.zTop,MAT.frame);
    for(const b of boxSupportBlocks(model)) if(b.legName==="front")
      s+=box(Wy+(b.k-1)*R, Wy+(b.k-1)*R+sk(S.frameStock).t*2, -base, b.height-base, MAT.block);
  }
  if(S.riserStyle==="closed") for(const ri of P.risers) s+=box(ri.u, ri.u+P.rt, ri.zBot, ri.zTop, MAT.riser);
  for(const t of P.treads){
    for(const b of t.bds) s+=box(b.u, b.u+b.w, t.z-P.tt, t.z, MAT.tread);
    s+=svgText(X(D(t.u0))+3,Y(t.z)-4,"L"+t.k,'font-size="8.5" fill="#6b4a2a"');
  }
  /* Platform decking last: it is the top tread, so it overhangs by the nosing. */
  s+=box(Wy-pd,Wy+model.riserT+nose,H-P.st,H,MAT.platDeck);
  if(nose>0.01) s+=svgLead(X(D(Wy+model.riserT+nose/2)),Y(H-P.st/2),X(D(Wy))+16,Y(H)+14,t("platform nosing {0}", fmtIn(nose)));
  s+=dimLineV(X(uMin)-14,Y(H),Y(0),dimLbl,"left");
  if(base>0){
    s+=dimLineV(X(uMin)-14,Y(0),Y(-base),fmtIn(base),"left");
    s+=svgText(X(uMin)-14,Y(-base)+16,note1,'font-size="8.5" fill="#8a6a45" text-anchor="end"');
    s+=svgText(X(uMin)-14,Y(-base)+26,note2,'font-size="8.5" fill="#8a6a45" text-anchor="end"');
  }
  const lastT=P.treads[P.treads.length-1];
  if(lastT){
    /* Run is nosing to nosing — dimension it between the two nosing tips, not
       between frame faces (same length, but the frame reads as the wrong datum). */
    const tip=lastT.u0+model.Tb;
    s+=svgLine(X(D(tip)),Y(lastT.z-r*0.5),X(D(tip)),Y(0)+28,'stroke="#999" stroke-width=".6" stroke-dasharray="2 2"');
    s+=svgLine(X(D(tip-R)),Y(lastT.z+r*0.5),X(D(tip-R)),Y(0)+28,'stroke="#999" stroke-width=".6" stroke-dasharray="2 2"');
    s+=dimLineH(X(D(tip-R)),X(D(tip)),Y(0)+24,t("R = {0} nosing to nosing", L(R)));
    s+=dimLineV(X(D(lastT.u0+model.Tb))+20,Y(lastT.z),Y(lastT.z-r),t("r = {0}", L(r)));
    // nosing is measured from the riser FACE, not the frame
    if(nose>0.01) s+=dimLineH(X(D(lastT.u0+R+model.riserT)),X(D(lastT.u0+model.Tb)),Y(lastT.z)-14,L(nose));
  }
  s+=svgText(mL,Ht-24,footer,'font-size="9" fill="#78838f"');
  s+=scaleBarSVG(mL,Ht-8,scale);
  s+="</svg>";
  return s;
}

/* One stringer, drawn as the actual board it is cut from. +x runs UP the
   stair. The bottom end is a plumb face down to `drop` below the bottom seat,
   then a LEVEL cut that bears flat — it runs horizontally to the board's lower
   edge, it is not a line to the corner of the board. */
function stringerProfileSVG(c,r,R,drop,bw,title){
  if(c<=0) return "<p>"+t("No notches to draw.")+"</p>";
  const Ls=hyp(r,R);
  const ux=R/Ls, uy=r/Ls, px=uy, py=-ux;             // px,py = perpendicular, below the nosing line
  const notch=[[0,0]];
  for(let i=0;i<c;i++){ notch.push([(i+1)*R, i*r]); notch.push([(i+1)*R,(i+1)*r]); }
  /* Lower edge = nosing line offset perpendicular by the board width. The top
     plumb cut trims it at x=c*R; the level cut trims it at z=-drop. */
  const t1=(c*R-bw*px)/ux,   aLow=[c*R, bw*py+t1*uy];
  const t0=(-drop-bw*py)/uy, bLow=[bw*px+t0*ux, -drop];
  const outline=notch.concat([aLow, bLow, [0,-drop]]);
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  for(const [x,y] of outline){ x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y); }
  const margin=36, scale=Math.min(8, 660/Math.max(1,x1-x0));
  const W=Math.max((x1-x0)*scale+2*margin+40, margin+estTextW(title,10)+24), H=(y1-y0)*scale+2*margin+30;
  const X=x=>margin+(x-x0)*scale, Y=y=>H-margin-(y-y0)*scale;
  let s=svgOpen(W,H);
  // board outline: lower edge, bottom plumb face + level cut, top plumb cut
  s+=svgPoly(outline.map(p=>[X(p[0]),Y(p[1])]),MAT.string);
  // notch profile drawn heavy — this is the cut line
  let path="M"+X(0).toFixed(1)+" "+Y(0).toFixed(1);
  for(let i=0;i<c;i++){ path+=" H"+X((i+1)*R).toFixed(1)+" V"+Y((i+1)*r).toFixed(1); }
  s+='<path d="'+path+'" fill="none" stroke="#654" stroke-width="2"/>';
  // nosing line + a layout tick at every notch corner (spacing = Ls along the edge)
  s+=svgLine(X(0),Y(0),X(c*R),Y(c*r),'stroke="#0f6fbf" stroke-width="1" stroke-dasharray="3 3"');
  for(let i=0;i<=c;i++){
    const tx=i*R, ty=i*r;
    s+=svgLine(X(tx),Y(ty),X(tx+2.2*px),Y(ty+2.2*py),'stroke="#0f6fbf" stroke-width="1.2"');
    if(i<c) s+=svgText(X(tx+R/2),Y(ty+r/2)-2,String(i+1),'font-size="9" fill="#0f6fbf" text-anchor="middle"');
  }
  s+=svgText(X(0)-2,Y(-drop)+12,t("level cut — bears here, drop {0}", fmtIn(drop)),'font-size="8.5" fill="#a55"');
  s+=svgText(X(c*R)+4,Y(c*r)+11,t("plumb cut"),'font-size="8.5" fill="#a55"');
  s+=svgText(margin,H-24,title,'font-size="10" fill="#333"');
  s+=scaleBarSVG(margin, H-8, scale);
  s+="</svg>";
  return s;
}
/* The same stringer seen ON THE BOARD you buy: the stock laid flat, the cut
   nested inside it, and the offcut at the end. Profile coords are rotated into
   board coords, where the nosing line IS the board's top edge:
       x' = (u·R + z·r)/Ls        y' = (u·r − z·R)/Ls
   so every notch is a triangle on the top edge, one Ls apart. */
function stringerStockSVG(c,r,R,drop,bw,stockLen,title,copies){
  if(c<=0) return "";
  const Ls=hyp(r,R), ux=R/Ls, uy=r/Ls, pxx=uy, pyy=-ux;
  const B = p => [(p[0]*R + p[1]*r)/Ls, (p[0]*r - p[1]*R)/Ls];
  const notch=[[0,0]];
  for(let i=0;i<c;i++){ notch.push([(i+1)*R, i*r]); notch.push([(i+1)*R,(i+1)*r]); }
  const t1=(c*R-bw*pxx)/ux,   aLow=[c*R, bw*pyy+t1*uy];
  const t0=(-drop-bw*pyy)/uy, bLow=[bw*pxx+t0*ux, -drop];
  const raw=notch.concat([aLow,bLow,[0,-drop]]).map(B);
  const x0=-Math.min(...raw.map(p=>p[0]));
  const pts=raw.map(p=>[p[0]+x0, p[1]]);
  const req=Math.max(...pts.map(p=>p[0]));
  const total=Math.max(stockLen||0, req);
  const kerf=S.kerf||0;
  /* How many of THIS stringer come out of one board — otherwise the sheet
     implies a whole board per stringer while the cut list packs several. */
  const nFit=Math.max(1, Math.min(copies||1, Math.floor((total+kerf)/(req+kerf))));
  const used=nFit*req+(nFit-1)*kerf;
  const waste=total-used;
  const sc=Math.min(6.5, 680/Math.max(total,1));
  const mL=46, mR=30, mT=40, mB=52;
  const W=Math.max(mL+total*sc+mR, mL+estTextW(title,10)+24), H=mT+bw*sc+mB;
  const X=x=>mL+x*sc, Y=y=>mT+y*sc;
  let s=svgOpen(W,H);
  // the board you buy
  s+=svgRect(X(0),Y(0),total*sc,bw*sc,'fill="#f2ede4" stroke="#9d8f7a" stroke-width="1"');
  for(let n=0;n<nFit;n++){
    const dx=n*(req+kerf);
    s+=svgPoly(pts.map(p=>[X(p[0]+dx),Y(p[1])]),MAT.string);
    if(n>0) s+=svgLine(X(dx-kerf/2),Y(0),X(dx-kerf/2),Y(bw),'stroke="#a55" stroke-width="1" stroke-dasharray="2 2"');
    // layout marks along the top edge, every Ls
    for(let i=0;i<=c;i++){
      const xm=dx+x0+i*Ls;
      s+=svgLine(X(xm),Y(0),X(xm),Y(0)-9,'stroke="#0f6fbf" stroke-width="1.2"');
      if(n===0) s+=svgText(X(xm),Y(0)-12,L(i*Ls),'font-size="8" fill="#0f6fbf" text-anchor="middle"');
      if(i<c) s+=svgText(X(xm+Ls/2),Y(r*R/Ls*0.6),String(i+1),'font-size="10" fill="#0f6fbf" text-anchor="middle"');
    }
  }
  if(waste>0.5){
    s+=svgRect(X(used),Y(0),waste*sc,bw*sc,'fill="#e8e2d6" stroke="#bfae95" stroke-dasharray="3 2"');
    s+=svgText(X(used+waste/2),Y(bw/2)+3,t("offcut {0}", L(waste)),'font-size="9" fill="#8a7a5f" text-anchor="middle"');
  }
  s+=svgText(X(0),Y(0)-24,t("marks along the top edge, every {0}", L(Ls)),'font-size="8.5" fill="#0f6fbf"');
  s+=dimLineH(X(0),X(req),Y(bw)+20,t("cut length {0}", L(req)));
  s+=dimLineH(X(0),X(total),Y(bw)+38,
    nFit>1 ? t("buy {0} — {1} per board", L(total), nFit) : t("buy {0}", L(total)));
  s+=svgText(mL,H-8,title,'font-size="10" fill="#333"');
  s+="</svg>";
  return s;
}
/* One sheet per DISTINCT stringer in the job, plus the hip — they are not all
   the same board: the ones nearer the corner carry fewer notches. */
function renderStringerSheets(model){
  const bw=sk(S.stringerStock).w, Ls=hyp(model.r,model.R);
  let h="";
  for(const legName of ["front","side"]){
    const st=stringersForLeg(legName,model);
    const seen=new Set();
    for(const g of st.list){
      if(seen.has(g.c)) continue;
      seen.add(g.c);
      const qty=st.list.filter(x=>x.c===g.c).length;
      const title=t("{0} leg · {1} notches (levels {2}–{3}) · ×{4} · run {5} rise {6} · marks every {7} · board ≥ {8}",
          t(legName), g.c, g.kmin, model.N, qty, L(model.R), L(model.r), L(Ls), L(g.reqLen))
        +(g.boardLen ? t(" — cut from {0}", L(g.boardLen)) : t(" — NEEDS A SPLICE"));
      const perBoard=g.boardLen ? Math.max(1, Math.floor((g.boardLen+S.kerf)/(g.reqLen+S.kerf))) : 1;
      const boardsNeeded=Math.ceil(qty/perBoard);
      h+='<div class="sheet"><h4>'+t("On the board — {0} needed, {1} per board, {2} board(s)", qty, Math.min(perBoard,qty), boardsNeeded)+"</h4>"
        +'<div class="svgwrap">'+stringerStockSVG(g.c,model.r,model.R,st.drop,bw,g.boardLen,title,Math.min(perBoard,qty))+"</div>"
        +'<h4>'+t("Finished profile")+"</h4>"
        +'<div class="svgwrap">'+stringerProfileSVG(g.c,model.r,model.R,st.drop,bw,title)+"</div></div>";
    }
  }
  const hip=hipStringer(model);
  const hipTitle=t("HIP stringer · run {0} (R×√2) · {1} notches · marks every {2} · board ≥ {3} · throat {4}",
    L(hip.run), hip.c, L(hip.Ls), L(hip.reqLen), fmtIn(hip.throat));
  h+='<div class="sheet"><h4>'+t("Hip on the board — 1 × {0}", S.stringerStock)+"</h4>"
    +'<div class="svgwrap">'+stringerStockSVG(hip.c,model.r,hip.run,hip.drop,bw,hip.boardLen,hipTitle)+"</div>"
    +'<h4>'+t("Finished profile")+"</h4>"
    +'<div class="svgwrap">'+stringerProfileSVG(hip.c,model.r,hip.run,hip.drop,bw,hipTitle)+"</div></div>";
  return h;
}
/* ---------- 19. panel renderers ------------------------------------------ */
function fitLabel(fit){
  return fit.recommend==="exact" ? t("exact fit") : fit.recommend==="altgap" ? t("gap adjusted")
       : fit.recommend==="rip" ? t("1 rip") : t("overshoot");
}
function fitSummaryHTML(label, fit){
  let s = '<div class="msg '+(fit.exact?"i":"w")+'"><b>'+label+':</b> ';
  if(fit.exact) s += t("{0} board(s), exact fit — no cutting needed.", fit.n);
  else if(fit.recommend==="altgap") s += t("{0} boards, gap adjusted to {1} (no rip).", fit.n, fmtIn(fit.altGap));
  else if(fit.recommend==="rip") s += t("{0} full board(s) + 1 rip at {1}.", fit.n, fmtIn(Math.max(fit.rip,0)));
  else {
    s += t("{0} full boards, overshoots by {1} — absorb into the nosing/tread depth.", fit.overshootN, fmtIn(fit.overshoot));
    if(fit.altGapTight!=null) s += " "+t("Or {0} boards with the gap tightened to {1}{2} for an exact fit with no rip.",
      fit.overshootN, fmtIn(fit.altGapTight), fit.altGapTight<0.01 ? t(" (butted tight — no drainage gap)") : "");
  }
  s += ' <span class="pill">'+t("alt: gap={0}, tight gap={1}, rip={2}, overshoot={3}",
      fit.altGap!=null?fmtIn(fit.altGap):t("n/a"),
      fit.altGapTight!=null?fmtIn(fit.altGapTight):t("n/a"),
      fmtIn(Math.max(fit.rip,0)), fmtIn(fit.overshoot))+'</span></div>';
  return s;
}
/* Describes the ACTUAL tread layout (nosing-anchored), then the alternatives. */
function treadLayoutHTML(model, fit){
  const lay = treadBoardWidths(model);
  let msg;
  if(lay.exact)
    msg = t("{0} full boards — the first flush with the nosing, the last flush with the back. No cutting.", lay.nFull);
  else if(lay.backRip)
    msg = t("{0} full boards starting at the nosing, plus one ripped to {1} at the BACK, where the riser board covers it.", lay.nFull, fmtIn(lay.backRip));
  else
    msg = t("{0} full boards starting at the nosing; the extra {1} falls in the gap at the back, out of sight.", lay.nFull, fmtIn(lay.slack));
  return '<div class="msg '+(lay.exact?"i":"w")+'"><b>'+t("Tread board depth ({0})", LD(model.Tb))+':</b> '+msg
    +' <span class="pill">'+t("board 1 = the nosing board")+'</span>'
    +' <span class="pill">'+t("alt: tight gap={0}, one-piece rip={1}", (fit.altGapTight!=null?fmtIn(fit.altGapTight):t("n/a")), fmtIn(Math.max(fit.rip,0)))+'</span></div>';
}
function renderSummaryPanel(model){

function renderSchedulePanel(model){

    h += '<div class="note">'+t('Total rise is locked at {0}. Every option for N=1–12 is shown; click "use" to adopt one.', LD(S.totalRise))+'</div>';
    h += '<table><thead><tr><th>N</th><th>'+t("Riser r")+'</th><th>'+t("In code?")+'</th><th>'+t('On 1/16"?')+'</th><th></th></tr></thead><tbody>';
    for(const row of fixedTable()) h += "<tr><td>"+row.N+"</td><td>"+LD(row.r)+"</td><td>"+(row.inCode?'<span class="pill ok">'+t("yes")+'</span>':'<span class="pill rip">'+t("no")+'</span>')+"</td><td>"+(row.onGrid?t("yes"):t("no"))+"</td><td><button data-pickn=\""+row.N+"\">"+t("use")+"</button></td></tr>";

function renderCompareTable(model){
  const totals = compareCornerStyles(model);
  const packed = {};
  for(const style of ["miter","through"]){
    const pieces = [];
    for(const lvl of model.levels) for(const legName of ["front","side"]){
      const tb = treadLegBoards(legName, lvl.k, model, style);
      for(const b of tb.boards) pieces.push({role:"t", stock:S.treadStock, len:b.long, qty:1});
    }
    const bins = binPack(pieces);
    let waste=0, bought=0;
    for(const stockName in bins) for(const bin of bins[stockName]){ waste+=bin.waste; bought+=bin.stockLen; }
    packed[style] = bought ? (waste/bought*100) : 0;
  }
  let h = '<table><thead><tr><th>'+t("Style")+'</th><th>'+t("Boards")+'</th><th>'+t("Total length")+'</th><th>'+t("Waste %")+'</th></tr></thead><tbody>';

const SB_MIN=240, SB_MAX=900, SB_DEF=340;
function clampSB(w){ return Math.max(SB_MIN, Math.min(SB_MAX, Math.round(w))); }
function applySidebar(){
  document.documentElement.style.setProperty("--sbw", clampSB(S.sidebarW||SB_DEF)+"px");
}
function initSplitter(){
  const bar=document.getElementById("split"), main=document.querySelector("main");
  if(!bar) return;
  let dragging=false;
  const widthFrom = clientX => clampSB(clientX - main.getBoundingClientRect().left - parseFloat(getComputedStyle(main).paddingLeft));
  bar.addEventListener("pointerdown", e=>{
    dragging=true; bar.classList.add("drag"); document.body.classList.add("resizing");
    bar.setPointerCapture(e.pointerId); e.preventDefault();
  });
  bar.addEventListener("pointermove", e=>{ if(!dragging) return; S.sidebarW=widthFrom(e.clientX); applySidebar(); });
  const end = e => {
    if(!dragging) return;
    dragging=false; bar.classList.remove("drag"); document.body.classList.remove("resizing");
    try{ bar.releasePointerCapture(e.pointerId); }catch(_){}
    save();                                        // only persist once the drag ends
  };
  bar.addEventListener("pointerup", end);
  bar.addEventListener("pointercancel", end);
  bar.addEventListener("dblclick", ()=>{ S.sidebarW=SB_DEF; applySidebar(); save(); });
  /* keyboard: focusable and arrow-adjustable */
  bar.tabIndex=0;
  bar.addEventListener("keydown", e=>{
    const step = e.shiftKey?40:10;
    if(e.key==="ArrowLeft"){ S.sidebarW=clampSB((S.sidebarW||SB_DEF)-step); applySidebar(); save(); e.preventDefault(); }
    if(e.key==="ArrowRight"){ S.sidebarW=clampSB((S.sidebarW||SB_DEF)+step); applySidebar(); save(); e.preventDefault(); }
  });
}

function runTests(){
  const results = [];
