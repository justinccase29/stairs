<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Corner Deck Stair Calculator</title>
<style>
:root{
  /* Height of the sticky header. Everything that parks under it — the input
     column and the tab bar — offsets by this, and JS keeps it true when the
     header wraps to two rows on a narrow window. */
  --hh:57px;
  --bg:#f6f7f9; --card:#fff; --ink:#16202b; --muted:#6b7885; --line:#dde3ea;
  --accent:#0f6fbf; --accent2:#e8f2fb; --warn:#b45309; --warnbg:#fff7e6;
  --err:#b91c1c; --errbg:#fee; --ok:#166534; --okbg:#eaf7ee; --wood:#d9a86c;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
h1{font-size:17px;margin:0}
h2{font-size:15px;margin:22px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
h3{font-size:13px;margin:16px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);
  padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header .sub{color:var(--muted);font-size:12px}
header .sub.bad{color:var(--warn);font-weight:600}
header .spacer{flex:1}
button{font:inherit;padding:5px 11px;border:1px solid var(--line);background:#fff;border-radius:5px;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
main{display:grid;grid-template-columns:var(--sbw,340px) 8px 1fr;gap:10px;padding:16px;align-items:start}
#split{align-self:stretch;min-height:60vh;cursor:col-resize;border-radius:4px;background:transparent;
  position:relative;touch-action:none}
#split::before{content:"";position:absolute;inset:0 3px;background:var(--line);border-radius:2px}
#split:hover::before,#split.drag::before{background:var(--accent)}
body.resizing{cursor:col-resize;user-select:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px}
#inputs{position:sticky;top:var(--hh);max-height:calc(100vh - var(--hh) - 17px);overflow:auto}
#inputs h3:first-child{margin-top:0}
/* input grows with the column instead of staying pinned at 108px */
.f{display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,42%);gap:6px 8px;align-items:center;margin-bottom:6px}
.f label{font-size:12.5px}
.f input[type=text],.f input[type=number],.f select{font-variant-numeric:tabular-nums}
.f .hint{grid-column:1/-1;font-size:11.5px;color:var(--muted);margin:-3px 0 4px}
input,select{font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:4px;width:100%;background:#fff}
input[type=checkbox]{width:auto}
input.bad{border-color:var(--err);background:#fff5f5}
/* The tab bar stays put under the header, so you can switch panels from
   anywhere in a long sheet without scrolling back to the top. The negative
   top margin cancels its own padding, so pinning it moves nothing. */
.tabs{display:flex;gap:4px;flex-wrap:wrap;
  position:sticky;top:var(--hh);z-index:8;
  background:var(--bg);border-bottom:1px solid var(--line);
  margin:-8px 0 10px;padding:8px 0 7px}
.tabs button.on{background:var(--accent2);border-color:var(--accent);color:var(--accent);font-weight:600}
.panel{display:none}
.panel.on{display:block}
table{border-collapse:collapse;width:100%;font-size:12.5px;margin:6px 0 14px}
th,td{border:1px solid var(--line);padding:4px 7px;text-align:right;vertical-align:top}
th{background:#f0f3f6;font-weight:600;text-align:right;white-space:nowrap}
td:first-child,th:first-child,.tl{text-align:left}
tbody tr:nth-child(even){background:#fafbfc}
tfoot td{font-weight:600;background:#f0f3f6}
.dec{color:var(--muted);font-size:11px;margin-left:4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-variant-numeric:tabular-nums}
.big{display:flex;gap:22px;flex-wrap:wrap;margin:8px 0 4px}
.big div{background:var(--accent2);border:1px solid #cfe3f5;border-radius:6px;padding:8px 12px;min-width:120px}
.big b{display:block;font-size:19px;font-weight:600}
.big span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.msg{border-radius:6px;padding:8px 11px;margin:6px 0;font-size:12.5px;border:1px solid}
.msg.e{background:var(--errbg);border-color:#f5c2c2;color:var(--err)}
.msg.w{background:var(--warnbg);border-color:#f0d9a8;color:var(--warn)}
.msg.i{background:var(--okbg);border-color:#c6e6d1;color:var(--ok)}
.msg b{font-weight:600}
svg{max-width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:6px}
.note{font-size:12px;color:var(--muted);margin:4px 0 12px}
.pill{display:inline-block;font-size:11px;padding:1px 6px;border-radius:9px;background:#eef1f4;color:var(--muted);margin-left:5px}
.pill.rip{background:#fdf0dd;color:var(--warn)}
.pill.ok{background:var(--okbg);color:var(--ok)}
.sheet{page-break-inside:avoid;margin-bottom:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.svgwrap{overflow:auto;margin:6px 0}
.svgwrap svg{display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:11.5px;color:var(--muted);margin:4px 0 8px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:14px;height:10px;border:1px solid;border-radius:2px;display:inline-block;flex:none}
h4{font-size:12.5px;margin:6px 0 4px;color:var(--ink)}
h5{font-size:12px;margin:12px 0 4px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.cuts td:nth-child(2),.cuts th:nth-child(2){text-align:left}
.cuts td:last-child,.cuts th:last-child{text-align:left;color:var(--muted);font-size:11.5px}
.cutgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}
@media(max-width:900px){.cutgrid{grid-template-columns:1fr}}
#panel-tests table td:nth-child(2){text-align:center}
.tests-summary{font-weight:600}
@media print{
  @page{size:letter portrait;margin:12mm}
  header,#inputs,#split,.tabs,.noprint{display:none!important}
  main{display:block;padding:0}
  body{background:#fff;font-size:11px}
  .card{border:0;padding:0}
  .panel{display:block!important;page-break-before:always}
  .panel:first-of-type{page-break-before:avoid}
  h2{page-break-after:avoid}
  table{font-size:10px}
  .sheet{break-inside:avoid}
  #printhead{display:block!important;margin-bottom:8px}
}
#printhead{display:none}
</style>
</head>
<body>
<header>
  <h1 id="app-title">Corner Deck Stair Calculator</h1>
  <span class="sub" id="app-sub">cascading pyramid stair &middot; 2 faces + mitered outside corner</span>
  <span class="spacer"></span>
  <span class="sub" id="savestate"></span>
  <label class="sub"><span id="t-lang">Language</span>
    <select id="lang" style="width:auto;display:inline-block;margin-left:4px">
      <option value="en">English</option><option value="fr">Fran&ccedil;ais</option>
    </select>
  </label>
  <label class="sub"><span id="t-units">Units</span>
    <select id="units" style="width:auto;display:inline-block;margin-left:4px">
      <option value="in">Imperial</option><option value="mm">Metric (mm)</option><option value="both">Both</option>
    </select>
  </label>
  <button id="btn-undo" style="display:none">Restore previous</button>
  <button id="btn-save">Export JSON</button>
  <button id="btn-load">Import</button>
  <button id="btn-reset">Reset</button>
  <button id="btn-print" class="primary">Print / PDF</button>
  <input type="file" id="file" accept=".json" style="display:none">
</header>
<main>
  <aside id="inputs" class="card"></aside>
  <div id="split" title="Drag to resize · double-click to reset"></div>
  <section>
    <div id="printhead"></div>
    <nav class="tabs" id="tabs"></nav>
    <div id="panels"></div>
  </section>
</main>

  "Corner step shape":"Forme du coin des marches",
  "Square — 90° corner, mitered":"Carré — coin à 90°, à onglet",
  "Tapered — 45° clip that widens":"Effilé — pan coupé à 45° qui s'élargit",
  "Square keeps the 90° corner and carries it on a hip stringer / mitered rims. Tapered clips the corner at 45°: the platform stays a square point and each step cuts more off, so the corner face grows down the stair. The platform itself is unchanged either way.":
    "Carré conserve le coin à 90° porté par un limon d'arête / des bordures à onglet. Effilé coupe le coin à 45° : la plateforme reste un point carré et chaque marche en retire davantage, si bien que le pan du coin s'élargit vers le bas. La plateforme elle-même ne change pas dans les deux cas.",
  "How much taper":"Ampleur de l'effilement",
  "Match the legs' going":"Égaler le giron des ailes",
  "Set the clip growth per step":"Fixer l'élargissement par marche",
  "Matching makes the going across the diagonal equal to the unit run, which is the only setting where the corner step is the same depth as the rest of the stair, the corner tread boards are the same layout as the legs, and the corner stringers are identical to the common ones. It fixes the clip growth at R×(2−√2).":
    "Égaler rend le giron en travers de la diagonale égal au giron courant : c'est le seul réglage où la marche du coin a la même profondeur que le reste de l'escalier, où les planches du coin suivent la même disposition que les ailes, et où les limons de coin sont identiques aux limons communs. L'élargissement est alors fixé à R×(2−√2).",
  "Clip grows per step":"Élargissement par marche",
  "How much more the 45° clip takes off each step down. 0 gives the same clip on every step and a diagonal 1.41× deeper than the legs; anything up to the unit run is allowed, and the going across the diagonal comes out at (2R − this) ÷ √2.":

    "Le coin effilé n'a pas de pointe à 90° : le pan est porté par des limons de coin perpendiculaires — et comme le giron de la diagonale vaut les mêmes {0} que les ailes, ce sont les MÊMES planches qu'un limon commun : entaille de {1}, âme de {2}. L'arête du coin carré exige un giron de R×√2 = {3} et ne sort souvent pas d'un {4}.",
  "With a tapered corner there is no hip: the flat face gets CORNER stringers, C1… across it, numbered from one end. The same ID is on the plan view, on its sheet and in the cut list.":

  "corner stringer, 45° plan bevels":"limon de coin, biseaux à 45° en plan",

  "Tapered corner.":"Coin effilé.",
  "The platform keeps its square corner — it is the apex. Each step clips {0} more off at 45°, so the corner face opens from {1} on the top step to {2} on the bottom one. Every corner cut is {3}° off square (the two faces meet at 135°), not 45°.":

  "The going across it is the same {0} as the legs, so the corner treads use the same board layout and the corner stringers are the same board as a common one — no hip.":

  "The two corner hips — H1 and H2":"Les deux arêtes du coin — H1 et H2",
  "Ring k's joint line, where the leg tread boards meet the corner ones, runs from (Wx+(k−1)R−c, Wy+(k−1)R) to (Wx+kR−c′, Wy+kR). Its direction is (R−dc, R) for EVERY k, and ring 1's starts at the platform corner itself — so all of them are segments of ONE straight line from that corner down to the deck. There are two, mirrored. That makes them hips, and they get a real notched stringer: a member on the hip carries the mitered ends of the leg boards and of the corner boards at once, which is exactly what those miters need.":
    "La ligne de joint de l'anneau k, là où les planches des ailes rejoignent celles du coin, va de (Wx+(k−1)R−c, Wy+(k−1)R) à (Wx+kR−c′, Wy+kR). Sa direction est (R−dc, R) pour CHAQUE k, et celle de l'anneau 1 part du coin même de la plateforme — toutes sont donc des segments d'UNE seule droite allant de ce coin jusqu'à la terrasse. Il y en a deux, en miroir. Ce sont donc des arêtes, et elles méritent un vrai limon entaillé : une pièce sur l'arête porte à la fois les bouts à onglet des planches des ailes et ceux des planches du coin, exactement ce qu'il faut à ces onglets.",

function t(s){
  let out = s;
  if(S && S.lang==="fr"){
    if(FR[s]!==undefined) out = FR[s];
    else if(s && /[a-zA-Z]{3}/.test(s)) MISSING_T.add(s);
  }
  for(let i=1;i<arguments.length;i++) out = out.split("{"+(i-1)+"}").join(String(arguments[i]));
  return out;
}
const isFR = () => S && S.lang==="fr";
const dec = s => isFR() ? String(s).replace(".", ",") : String(s);   // 9.333 -> 9,333

/* ---------- 1. units ---------------------------------------------------- */
const MM = 25.4;
function fmtIn(x){
  const neg = x < 0; x = Math.abs(x);
  const s16 = Math.round(x*16);
  let whole = Math.floor(s16/16), num = s16%16, den = 16;
  while(num && num%2===0){ num/=2; den/=2; }
  let out = num ? (whole ? whole+"-"+num+"/"+den : num+"/"+den) : String(whole);
  return (neg?"-":"")+out+'"';
}
function fmtMm(x){ const v = x*MM; return dec(Math.abs(v)<100 ? v.toFixed(1) : Math.round(v))+" mm"; }
function L(x){                                   // headline length, current units
  if(!isFinite(x)) return "—";
  if(S.units==="mm")   return fmtMm(x);
  if(S.units==="both") return fmtIn(x)+" / "+fmtMm(x);
  return fmtIn(x);
}
function LD(x){                 // length, plus the exact decimal ONLY when the
  if(!isFinite(x)) return "—";  // fraction is a rounding of it — otherwise noise
  if(S.units==="mm") return fmtMm(x);
  const off = Math.abs(x*16 - Math.round(x*16)) > 0.02;
  return L(x)+(off ? '<span class="dec">= '+dec(x.toFixed(3))+'"</span>' : "");
}
function parseLen(str){
  if(typeof str === "number") return str;
  /* Accept a comma as the decimal mark, so a French keyboard entry works. */
  let s = String(str).trim().toLowerCase().replace(/[“”″]/g,'"').replace(/′/g,"'").replace(/(\d),(\d)/g,"$1.$2");
  if(!s) return NaN;
  let unit = null;
  if(/mm$/.test(s)){ unit="mm"; s=s.replace(/mm$/,""); }
  else if(/cm$/.test(s)){ unit="cm"; s=s.replace(/cm$/,""); }
  else if(/"$/.test(s)||/in$/.test(s)){ unit="in"; s=s.replace(/(in|")$/,""); }
  s = s.trim();
  let ft = 0;
  const fm = s.match(/^(\d+(?:\.\d+)?)\s*'\s*(.*)$/);
  if(fm){ ft = parseFloat(fm[1]); s = fm[2].trim(); unit = unit||"in"; }
  let v = 0;
  if(s){
    const m = s.match(/^(\d+(?:\.\d+)?)?(?:[\s-]*(\d+)\s*\/\s*(\d+))?$/);
    if(!m || (!m[1] && !m[2])) return NaN;
    v = (m[1]?parseFloat(m[1]):0) + (m[2]?parseInt(m[2],10)/parseInt(m[3],10):0);
  }
  let inches = ft*12 + v;
  if(unit==="mm" || (unit===null && S.units==="mm")) inches = inches/MM;
  else if(unit==="cm") inches = inches/2.54;
  return inches;
}
const r16 = x => Math.round(x*16)/16;            // nearest 1/16"
const hyp  = (a,b) => Math.sqrt(a*a+b*b);

function onFormInput(e){
  const t = e.target;
  SAVE_STATE.dirty = true;          // this session has earned the right to write
  if(t.dataset.k){
    const k = t.dataset.k, ty = t.dataset.t;
    if(ty==="chk") S[k] = t.checked;
    else if(ty==="len"){ const v = parseLen(t.value); if(isNaN(v)){ t.classList.add("bad"); return; } t.classList.remove("bad"); S[k]=v; }
    else if(ty==="int"){ const v = parseInt(t.value,10); if(!(v>0)) return; S[k]=v; }
    else S[k] = t.value;
    const f = FIELDS.find(f=>f.k===k);
    if(f && (f.t==="sel"||f.t==="chk")) { save(); renderForm(); return run(); }
  } else if(t.dataset.code){ CODE[t.dataset.code] = parseFloat(t.value)||0; }
  else if(t.dataset.stock){ STOCK[t.dataset.stock][t.dataset.p] = parseFloat(t.value)||0; }
  else return;
  save(); run();
}
/* ---------- 7. persistence ----------------------------------------------
   Every edit is written to localStorage immediately and read back on open.
   A silent failure here looks exactly like "it doesn't remember anything", so
   the outcome is always reported in the header rather than swallowed. */
let SAVE_STATE = {ok:null, at:null, restored:false, dirty:false, badPayload:false, from:null};
function showSaveState(){
  const el = document.getElementById("savestate");
  if(!el) return;
  if(SAVE_STATE.ok===false){
    el.textContent = "⚠ " + t("Not saving — this browser is blocking storage. Use Export JSON.");
    el.className = "sub bad";
  } else if(SAVE_STATE.badPayload){
    el.textContent = "⚠ " + t("Your saved design could not be read — it is kept, click Restore previous.");
    el.className = "sub bad";
  } else {
    el.className = "sub";
    if(SAVE_STATE.at){
      const time = SAVE_STATE.at.toLocaleTimeString(S.lang==="fr"?"fr-CA":"en-CA",{hour:"2-digit",minute:"2-digit"});
      el.textContent = t("Saved {0}", time);
    } else if(SAVE_STATE.restored){
      /* Name what came back, so a silent revert to the defaults is obvious at a
         glance instead of looking like a normal restore. */
      el.textContent = t("Restored: {0} risers, {1}", S.risers,
        S.method==="boxes" ? t("box frames") : t("stringers"));
    } else el.textContent = "";
  }
  const btn = document.getElementById("btn-undo");
  if(btn) btn.style.display = hasBackup() ? "" : "none";
}
const SAVE_KEY = "stairs-calc-v1", SAVE_BAK = "stairs-calc-v1-prev", SAVE_VER = 3;
/* Every payload carries its version, so a future rename can migrate instead of
   silently falling back to the default for that field. */
const snapshot = () => JSON.stringify({v:SAVE_VER, S, CODE, STOCK});
function save(){
  try{
    const next = snapshot(), prev = localStorage.getItem(SAVE_KEY);
    /* One step of undo: keep the payload we are about to replace. A bad write
       then costs a click instead of the whole design. */
    if(prev && prev!==next) localStorage.setItem(SAVE_BAK, prev);
    localStorage.setItem(SAVE_KEY, next);
    /* verify it actually landed — some browsers accept the write and drop it */
    SAVE_STATE.ok = localStorage.getItem(SAVE_KEY)===next;
    SAVE_STATE.at = new Date();
  }catch(e){
    SAVE_STATE.ok = false;
    console.warn("Could not save project:", e);
  }
  showSaveState();
  return SAVE_STATE.ok;
}
/* THE FLUSH IS THE DANGEROUS ONE. It fires on unload and on hide, whatever the
   page happens to be holding — so if a visit started from the defaults because
   the load did not restore (storage briefly unreadable, a payload this build
   cannot parse, a fresh profile), leaving the page would write those defaults
   straight over a good design. That is a one-way loss and it is exactly what
   "it forgot my options after an update" looks like. So: only a session that
   restored the saved design, or that actually changed something, is allowed to
   write on the way out. */
function flushSave(){
  try{
    const stored = localStorage.getItem(SAVE_KEY);
    if(stored && !SAVE_STATE.restored && !SAVE_STATE.dirty) return false;
    if(stored===snapshot()) return true;                 // nothing to write
    return save();
  }catch(e){ return false; }
}
function migrate(data){
  if(!data.v) data.v = 1;                       // v1 had no version field
  /* v3 ships the Home Depot Greenfield Park prices as the default. Anyone
     saved before that has price:"" and would keep an empty field forever, so
     drop the key and let the default fill in — but ONLY when it is empty, so a
     price you typed yourself is never overwritten. */
  if(data.v < 3 && data.S && !String(data.S.price||"").trim()) delete data.S.price;
  return data;
}
function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    const data = migrate(JSON.parse(raw));
    if(data.S) Object.assign(S, data.S);
    if(data.CODE) Object.assign(CODE, data.CODE);
    /* MERGE the stock library over the defaults, never replace it: a saved
       library from an older build is missing anything added since, and dropping
       those left stock selects pointing at names that no longer existed. */
    if(data.STOCK) STOCK = Object.assign(JSON.parse(JSON.stringify(STOCK_DEFAULT)), data.STOCK);
    SAVE_STATE.restored = true;
    SAVE_STATE.from = data.v;
    return true;
  }catch(e){
    /* Do not let a corrupt payload become a silent reset — keep it, say so. */
    try{ localStorage.setItem(SAVE_BAK, localStorage.getItem(SAVE_KEY)||""); }catch(_){}
    SAVE_STATE.badPayload = true;
    console.warn("Could not restore saved project:", e);
    return false;
  }
}
/* Put back whatever the previous save held. */
function restorePrevious(){
  try{
    const bak = localStorage.getItem(SAVE_BAK);
    if(!bak) return false;
    const cur = localStorage.getItem(SAVE_KEY);
    const data = migrate(JSON.parse(bak));
    Object.assign(S, DEFAULTS, data.S||{});
    Object.assign(CODE, CODE_DEFAULT, data.CODE||{});
    STOCK = Object.assign(JSON.parse(JSON.stringify(STOCK_DEFAULT)), data.STOCK||{});
    if(cur) localStorage.setItem(SAVE_BAK, cur);          // swap, so it undoes itself
    localStorage.setItem(SAVE_KEY, snapshot());
    SAVE_STATE.dirty = false;
    return true;
  }catch(e){ console.warn("Could not restore the previous design:", e); return false; }
}
const hasBackup = () => { try{
  const b=localStorage.getItem(SAVE_BAK); return !!b && b!==localStorage.getItem(SAVE_KEY);
}catch(e){ return false; } };

/* ---------- 8. small parsing helpers ------------------------------------ */
function parseStockLens(){
  return String(S.stockLen||"").split(",").map(s=>parseFloat(s.trim()))
    .filter(x=>isFinite(x) && x>0).sort((a,b)=>a-b);
}
function pickStockLen(need, lens){
  lens = lens || parseStockLens();
  for(const Ln of lens) if(Ln >= need-1e-6) return Ln;
  return null;                                   // nothing long enough — needs a splice
}
/* Lumber is not priced per board — a 16' 2x12 is not four times a 4' one, and
   the long lengths carry a premium per foot. Three forms, most specific wins:
     2x6@96:12.50    this stock AT that length          -> exact
     2x6:1.65/ft     this stock by the foot             -> len/12 * rate
     2x6:14.50       one flat price whatever the length -> legacy, still works
   Length is written in the current unit, so "2x6@2438:12.50" works in mm. */
function parsePrices(){
  const out = {exact:{}, perFt:{}, flat:{}};
  if(!S.price) return out;
  for(const part of String(S.price).split(",")){
    const idx = part.lastIndexOf(":");
    if(idx<0) continue;
    let name = part.slice(0,idx).trim();
    const rhs = part.slice(idx+1).trim();
    const val = parseFloat(rhs.replace(",", "."));
    if(!name || !isFinite(val)) continue;
    const at = name.lastIndexOf("@");
    if(at>0){
      /* A bare @length is INCHES, like the "Stock lengths you can buy (in)"
         field it pairs with — otherwise switching the display to mm would
         reinterpret @96 as 96 mm and every price would miss. Write @2438mm if
         you really mean metric. */
      const raw = name.slice(at+1).trim();
      const len = /[a-z"'′″]/i.test(raw) ? parseLen(raw) : parseFloat(raw.replace(",", "."));
      name = name.slice(0,at).trim();
      if(isFinite(len) && len>0){ (out.exact[name] = out.exact[name] || {})[Math.round(len*16)] = val; continue; }
    }
    if(/\/\s*(ft|pi|foot|')\s*$/i.test(rhs)) out.perFt[name] = val;
    else out.flat[name] = val;
  }
  return out;
}
/* Price of ONE board of this stock at this length, and where it came from, so
   the cut list can show its working instead of an unexplained number. */
function priceBoard(prices, name, len){
  const ex = prices.exact[name];
  if(ex){
    const key = Math.round(len*16);
    if(ex[key]!=null) return {cost:ex[key], basis:"exact"};
  }
  if(prices.perFt[name]!=null) return {cost:prices.perFt[name]*len/12, basis:"perFt", rate:prices.perFt[name]};
  if(prices.flat[name]!=null) return {cost:prices.flat[name], basis:"flat"};
  /* A length we were not given but the stock has other lengths priced: fall
     back to the cheapest per-foot rate implied by them, flagged as an estimate
     rather than silently costing the board at zero. */
  if(ex){
    const keys = Object.keys(ex).map(Number);
    if(keys.length){
      const nearest = keys.reduce((a,b)=>Math.abs(b-len*16)<Math.abs(a-len*16)?b:a);
      const rate = ex[nearest]/(nearest/16);
      return {cost:rate*len, basis:"scaled", from:nearest/16};
    }
  }
  return {cost:0, basis:"none"};
}

/* ---------- 9. board fitting — "do I have to cut boards?" --------------- */
/* depth must be filled by boards of width w with a normal gap between them.
   n = number of full boards you get if you also leave a trailing gap-width
   of space after the last one (so a rip or another board could follow). */
function fitBoards(depth, w, gap){
  gap = gap || 0;
  const n = Math.max(1, Math.floor((depth+gap)/(w+gap)));
  const spanN = n*w + (n-1)*gap;                 // n boards, n-1 internal gaps
  const remainder = depth - spanN;                // >= 0 by construction of n
  const exact = Math.abs(remainder) < 0.0625;      // within 1/16" — no rip needed
  const rip = remainder - gap;                     // depth - n*w - n*gap
  const overshootN = n+1;
  const overshootSpan = overshootN*w + n*gap;      // n+1 full boards, n gaps
  const overshoot = overshootSpan - depth;
  let altGap = null;
  if(n>1){
    const g = (depth - n*w)/(n-1);
    if(g>=0.125 && g<=0.375) altGap = g;           // only "sane" if 1/8"–3/8"
  }
  /* n+1 boards with the gap TIGHTENED fills the depth exactly with no rip.
     gT = 0 means the boards butt tight — fine for composite or an indoor
     tread, but it gives up drainage on PT. Offered as an alternative, never
     forced, because "2 boards butted = exactly 11" is often what you want. */
  let altGapTight = null;
  const gT = (depth - overshootN*w)/n;
  if(gT >= -1e-9 && gT <= gap + 1e-9) altGapTight = Math.max(0, gT);
  let recommend;
  if(exact) recommend = "exact";
  else if(altGap!=null) recommend = "altgap";
  else if(rip>0.01 && rip<w*0.92) recommend = "rip";
  else recommend = "overshoot";
  return {depth,w,gap,n,spanN,exact,remainder,rip,overshootN,overshootSpan,overshoot,altGap,altGapTight,recommend};
}

/* ---------- 10. rise-mode solvers --------------------------------------- */
function fixedTable(){
  const H = S.totalRise, rows = [];
  for(let N=1;N<=12;N++){
    const r = H/N, mm = inMM(r);
    rows.push({N, r, mm, inCode: mm>=CODE.riserMin && mm<=CODE.riserMax,
      onGrid: Math.abs(r*16-Math.round(r*16))<0.01});
  }
  return rows;
}
function flexibleSearch(){
  const target = S.targetRise, tol = S.riseTol;
  const rMinIn = CODE.riserMin/MM, rMaxIn = CODE.riserMax/MM;
  const lo = Math.ceil(rMinIn*16), hi = Math.floor(rMaxIn*16);
  const results = [];
  for(let N=1;N<=12;N++){
    for(let s16=lo; s16<=hi; s16++){
      const r = s16/16, total = N*r;
      if(Math.abs(total-target) <= tol){
        const round = (s16%4===0) ? 3 : (s16%2===0) ? 2 : 1;   // 1/4 > 1/8 > 1/16
        results.push({N, r, total, round, d7:Math.abs(r-7), dTarget:Math.abs(total-target)});
      }
    }
  }
  results.sort((a,b)=> b.round-a.round || a.d7-b.d7 || a.dTarget-b.dTarget);
  return results;
}

/* ---------- 11. validation ----------------------------------------------- */
function validate(model){
  const warnings = [];
  const rmm=inMM(model.r), Rmm=inMM(model.R), Tmm=inMM(model.R+model.nose);
  if(rmm<CODE.riserMin || rmm>CODE.riserMax)
    warnings.push({level:"error", msg:t("Riser height {0} is outside the code range {1}–{2} mm.", LD(model.r), CODE.riserMin, CODE.riserMax)});
  if(Rmm<CODE.runMin || Rmm>CODE.runMax)
    warnings.push({level:"error", msg:t("Run {0} is outside the code range {1}–{2} mm.", LD(model.R), CODE.runMin, CODE.runMax)});
  if(Tmm<CODE.treadDepthMin)
    warnings.push({level:"error", msg:t("Tread depth {0} is below the code minimum {1} mm.", LD(model.R+model.nose), CODE.treadDepthMin)});
  /* Narrowest walking width on a leg is the INNER edge of its top tread —
     Wb + (k-1)R with k=1, i.e. Wb itself. (Measuring at the outer edge would
     add a full run and let an undersized stair pass the check.) */
  const widthFront=model.Wx, widthSide=model.Wy;
  if(inMM(widthFront)<CODE.widthMin)
    warnings.push({level:"error", msg:t("Front leg walking width {0} (narrowest point — back of the top tread) is below the minimum {1} mm.", LD(widthFront), CODE.widthMin)});
  if(inMM(widthSide)<CODE.widthMin)
    warnings.push({level:"error", msg:t("Side leg walking width {0} (narrowest point — back of the top tread) is below the minimum {1} mm.", LD(widthSide), CODE.widthMin)});
  if(model.N>CODE.handrailOverRisers)
    warnings.push({level:"warn", msg:t("Handrail required: {0} risers exceeds {1} (mention only — not sized here).", model.N, CODE.handrailOverRisers)});
  let guardFlagged = false;
  if(inMM(model.H)>CODE.guardOverHeight){
    warnings.push({level:"warn", msg:t("Guard likely required: the platform surface is {0} above the deck (mention only — not sized here).", LD(model.H))});
    guardFlagged = true;
  }
  if(!guardFlagged){
    for(const lvl of model.levels){
      if(inMM(lvl.z)>CODE.guardOverHeight){
        warnings.push({level:"warn", msg:t("Guard may be required: the tread at level {0} is {1} above the deck (mention only).", lvl.k, LD(lvl.z))});
        break;
      }
    }
  }
  if(S.riserStyle==="open" && inMM(model.r)>CODE.openRiserMaxGap)
    warnings.push({level:"warn", msg:t("Open riser gap {0} exceeds the {1} mm code maximum.", LD(model.r), CODE.openRiserMaxGap)});
  if(Math.abs(model.r*16-Math.round(model.r*16))>0.02)
    warnings.push({level:"warn", msg:t("Riser height {0}\" does not land on a 1/16\" increment — lay out every riser mark from one reference face, do not stack measured increments.", dec(model.r.toFixed(3)))});
  if(inMM(model.Wy)<CODE.landingMinDepth)
    warnings.push({level:"warn", msg:t("Landing depth at the door is {0} (platform frame, wall to riser face); code wants at least {1} mm. The nosing overhang does not count as walking surface.", LD(model.Wy), CODE.landingMinDepth)});
  if(S.method==="stringers"){
    const stv = stringersForLeg("front", model), hipv = hipStringer(model);
    if(!stv.fitsStock)
      warnings.push({level:"error", msg:t("Leg stringers need a board at least {0} wide (notch {1} + throat {2}); a {3} is only {4}.", fmtIn(stv.minWidth), fmtIn(stv.notchDepth), fmtIn(S.throatMin), S.stringerStock, fmtIn(stv.stock.w))});
    /* a tapered corner has no hip — its face is carried by corner stringers,
       checked separately below */
    if(!model.taper.on && !hipv.fitsStock)
      warnings.push({level:"error", msg:t("The hip stringer needs a board at least {0} wide — its run is R×√2 = {1}, so the notch is deeper. A {2} leaves only {3} of throat.", fmtIn(hipv.minWidth), L(hipv.run), S.stringerStock, fmtIn(hipv.throat))});
  } else if(model.base>0){
    const bb = boxesForLevel(model, model.N-1);
    if(!bb.rimStockOK)
      warnings.push({level:"error", msg:t("Bearing on the deck structure makes the bottom box rim {0}, deeper than a {1} ({2}). Use deeper stock for that box.", LD(bb.rimH), S.frameStock, fmtIn(sk(S.frameStock).w))});
  }
  /* ---- the tapered corner has its own going, and its own way to go wrong ---- */
  if(model.taper.on){
    const tp=model.taper, gmm=tp.g*MM, wmm=(tp.g+model.nose)*MM;
    if(gmm<CODE.runMin || gmm>CODE.runMax)
      warnings.push({level:"error", msg:t("The corner step is {0} deep across the diagonal ({1} mm), outside the {2}–{3} mm the code allows for a run. Set the taper to match the legs' going, or change the clip growth.",
        LD(tp.g), dec(Math.round(gmm)), CODE.runMin, CODE.runMax)});
    else if(Math.abs(tp.g-model.R)>0.0626)
      warnings.push({level:"warn", msg:t("The corner step is {0} deep where the legs are {1} — legal, but it is a different depth underfoot at the corner, and its tread boards need their own layout. Matching the legs' going removes both.", LD(tp.g), LD(model.R))});
    if(wmm<CODE.treadDepthMin)
      warnings.push({level:"error", msg:t("Walking depth across the corner is {0} ({1} mm), below the {2} mm minimum.", LD(tp.g+model.nose), dec(Math.round(wmm)), CODE.treadDepthMin)});
    /* the clip must not eat the legs away */
    const legEnd=k=>Math.min(model.Wx,model.Wy)+k*model.R-model.clip(k);
    const bottomLeg=legEnd(model.N-1);
    if(bottomLeg<=0)
      warnings.push({level:"error", msg:t("The clip has eaten the legs: by the bottom step it takes off {0}, more than the leg is long. Reduce the clip growth, or use fewer risers.", LD(model.clip(model.N-1)))});
    else if(bottomLeg<CODE.widthMin/MM)
      warnings.push({level:"warn", msg:t("By the bottom step the clip leaves only {0} of straight leg ({1} mm) before the corner starts, under the {2} mm minimum stair width — the corner is most of the step down there.", LD(bottomLeg), dec(Math.round(bottomLeg*MM)), CODE.widthMin)});
    if(S.method==="stringers"){
      const cs=cornerStringers(model);
      if(cs && !cs.fitsStock)
        warnings.push({level:"error", msg:t("The corner stringers will not come out of a {0}: the notch bites {1} deep and leaves {2} of throat, so they need a board at least {3} wide.", S.stringerStock, fmtIn(cs.notchDepth), fmtIn(cs.throat), fmtIn(cs.minWidth))});
      if(cs && !cs.spansOK)
        warnings.push({level:"warn", msg:t("On the bottom step the corner treads have to cross {0} between supports, more than the {1} a {2} can span. Add a stringer across the corner face, or use tread stock with a longer span.", LD(cs.worstSpan), fmtIn(cs.spanLimit), S.treadStock)});
    }
  }
  if(S.includePlatform){
    const pfv = platformModel(model);
    if(pfv.braceNeeded)
      warnings.push({level:"warn", msg:t("Floating platform legs are {0} tall out of {1}, which is a plank on edge at that height — double them into an L at the corners and brace them diagonally, or set the leg stock to 4x4.", LD(pfv.legH), pfv.legName)});
    if(pfv.ripFrame)
      warnings.push({level:"warn", msg:t("A {0} is deeper than the whole platform ({1}) — rip the frame stock down, or pick a shallower stock.", S.platFrame, LD(pfv.height))});
  }
  const stockLens = parseStockLens();
  const maxStock = stockLens.length ? Math.max(...stockLens) : 0;
  if(maxStock){
    const bottomFront = model.footX, bottomSide = model.footY;
    if(bottomFront>maxStock)
      warnings.push({level:"warn", msg:t("The longest board needed on the front leg (bottom level, {0}) exceeds your longest stock length ({1}) — plan a splice over a stringer or joist.", L(bottomFront), L(maxStock))});
    if(bottomSide>maxStock)
      warnings.push({level:"warn", msg:t("The longest board needed on the side leg (bottom level, {0}) exceeds your longest stock length ({1}) — plan a splice over a stringer or joist.", L(bottomSide), L(maxStock))});
  }
  return warnings;
}
/* ---------- 12. geometry -------------------------------------------------
   House wall at y=0. Platform footprint platX (along wall, X) by platY (out
   from wall, Y). Steps cascade in +y (front face) and +x (side face),
   wrapping the outside corner at (platX,platY) on a 45 degree miter.
   Level k = 1 (top) .. N-1 (bottom). z_k = H - k*r, always from exact r. */
/* ---------- 11b. the corner: square, or a 45° clip that widens -------------
   The platform keeps its square corner — it is the apex. Ring k clips that
   corner back by `c_k = k·dc` along each leg, so the flat 45° face grows as the
   stair descends. Two numbers fall out of dc and nothing else needs a branch:

     joint slope   m = (R − dc)/R      dx per dy along the tread/rim joint
     diagonal going g = (2R − dc)/√2   depth of the corner step, face to face

   dc = 0 is the square corner the tool has always drawn: c_k ≡ 0, m = 1, 45°
   miters, no diagonal face at all. So every formula below is written once, with
   the square case as dc = 0 — no parallel code path to drift out of step.

   dc = R(2−√2) ≈ 0.586R is the interesting one: it makes g = R, so the corner
   step is exactly as deep as the legs, its tread boards use the same layout,
   the joint lands on the true bisector of the 135° corner (a 22.5° saw setting,
   the octagon detent), and the corner stringers become identical to the common
   ones — the R√2 hip that will not come out of a 2x12 simply disappears. */
function cornerTaper(R){
  if(S.cornerShape!=="taper")
    return {on:false, dc:0, m:1, g:R*Math.SQRT2, sawDeg:45, diagSet:0};
  const auto = R*(2-Math.SQRT2);
  /* dc must stay under R: at R the clip eats outward as fast as the ring grows
     and the legs stop getting longer; past it the corner swallows them. */
  const dc = S.taperMode==="custom" ? Math.max(0, Math.min(S.taperGrow, R-1/16)) : auto;
  const m = (R-dc)/R;
  /* Cut angle for a board running ALONG the diagonal. With dc = auto the joint
     bisects the 135° corner and this equals m, but a custom clip puts the joint
     off the bisector and the two boards take different angles. */
  const jx=R-dc, jy=R, cd=Math.abs(jx-jy)/(Math.SQRT2*hyp(jx,jy));
  return {on:true, dc, m, g:(2*R-dc)/Math.SQRT2, auto,
          sawDeg:Math.atan(m)*180/Math.PI,
          diagSet: cd>=1 ? 0 : cd/Math.sqrt(1-cd*cd)};
}
function computeModel(){
  const R=S.run, nose=S.nosing, N=S.risers, H=S.totalRise;
  const r = H/N;
  const Wx=S.platX, Wy=S.platY;
  /* A captured riser board sits ON the tread below and tucks UNDER the tread
     above, so ITS face — not the frame — is the last vertical surface, and the
     nosing is measured from there. That makes the tread board one riser
     thickness deeper than the going. Without this the tread stops at the
     frame and the riser's top edge is left exposed. */
  const riserT = (S.riserStyle==="closed" && S.riserFit==="captured") ? sk(S.riserStock).t : 0;
  const Tb = R + riserT + nose;      // board depth — what you cut
  const Twalk = R + nose;            // riser face to nosing tip — what code measures
  const levels = [];
  for(let k=1;k<=N-1;k++) levels.push({k, z:H-k*r, T:Tb, Twalk});
  const footX = Wx+(N-1)*R+riserT+nose, footY = Wy+(N-1)*R+riserT+nose;
  /* base = how far BELOW the finished deck surface the framing bears. Landing
     on the deck structure means cutting through the decking, so the bottom of
     the framing sits one deck-board thickness low. This deliberately does NOT
     touch r, H or any tread height: the rise stays finished-to-finished, and
     only the framing that reaches down to bearing gets longer. */
  const base = S.bottomBearing==="structure" ? Math.max(0, S.deckBoardT) : 0;
  const taper = cornerTaper(R);
  return {R,nose,N,H,r,Wx,Wy,levels,footX,footY,base,deckT:Math.max(0,S.deckBoardT),
          riserT, Tb, Twalk, platFinX:Wx+riserT+nose, platFinY:Wy+riserT+nose,
          /* clip taken off the corner at ring k — 0 at the platform, which is
             why the platform stays a square point whatever the taper */
          taper, clip:k=>k*taper.dc,
          TbDiag: taper.g + riserT + nose,      // board depth across the corner face
          TwalkDiag: taper.g + nose};
}

/* One tread leg, one level. style: "miter" (mitered outside corner, boards
   run parallel to the face, offset o_j accumulates width+gap) or "through"
   (S.throughLeg runs full length square-cut, the other leg butts short). */
function treadLegBoards(legName, k, model, style){
  const R=model.R, nose=model.nose;
  const Wb = legName==="front" ? model.Wx : model.Wy;
  const T = model.Tb;
  const {fit} = treadBoardWidths(model);
  const offs = treadBoardOffsets(model);          // [0] = the nosing board
  const boards = [];
  if(style==="miter"){
    /* The joint with the corner starts at the ring's inner corner LESS whatever
       the taper clipped off there, and runs outward at slope m. Square corner:
       clip 0, m 1, so this is the old x = Wx + (y − Wy) miter exactly. */
    const base = Wb+(k-1)*R - model.clip(k-1), m = model.taper.m;
    offs.forEach((b,i)=>boards.push({j:i+1, o:b.o, w:b.w,
      long:base+(b.o+b.w)*m, short:base+b.o*m}));
  } else {                                        // through-leg / butt style
    const isThrough = S.throughLeg===legName;
    const len = isThrough ? (Wb+k*R+model.riserT+nose) : (Wb+(k-1)*R);
    offs.forEach((b,i)=>boards.push({j:i+1, o:b.o, w:b.w, long:len, short:len}));
  }
  return {fit, boards, T, style, Wb, legName, k};
}

/* The tapered corner's own face, one level. Boards run PARALLEL to the 45°
   diagonal, so they are trapezoids: the face grows from c_(k-1)·√2 at its inner
   edge to c_k·√2 at its outer, and the two joint lines diverge linearly across
   the depth. Ring 1 is the special one — its inner edge is the platform's
   square corner, a point, so that face is a triangle and the innermost piece
   tapers to nothing. Mitered both ends. */
function treadDiagBoards(k, model){
  if(!model.taper.on) return null;
  const T=model.TbDiag, g=model.taper.g, dc=model.taper.dc;
  const offs=treadBoardOffsets(model, T);
  const cIn=model.clip(k-1), rate=g>0 ? dc/g : 0;
  const faceAt=o=>Math.SQRT2*(cIn + o*rate);
  const boards=[];
  offs.forEach((b,i)=>{
    const short=faceAt(b.o), long=faceAt(b.o+b.w);
    /* the apex piece on ring 1 is a triangle; anything under a saw-blade's
       worth of length is not a board, it is the point of the corner */
    if(long<0.25) return;
    boards.push({j:boards.length+1, o:b.o, w:b.w, short:Math.max(0,short), long,
                 triangle: short<0.0626});
  });
  return {boards, T, fit:treadBoardWidths(model,T).fit,
          faceInner:cIn*Math.SQRT2, faceOuter:model.clip(k)*Math.SQRT2, k};
}

/* Pure geometric leg trapezoid area (no board/gap rounding) — used by the
   plan drawing and the self-test that miter vs through cover equal area. */
function ringLegAreaMiter(Wb,k,R,Tb){
  const short = Wb+(k-1)*R;
  return Tb*short + Tb*Tb/2;
}
function ringLegAreaThrough(Wb,k,R,Tb,isThrough){
  const short = Wb+(k-1)*R;
  return isThrough ? Tb*(short+Tb) : Tb*short;
}

/* Risers. N risers total (riser 1 = platform's own face .. riser N = the
   outermost, at the deck). Outside corner mitered on the board THICKNESS
   (a 45 degree cut across thickness t shortens the back point by exactly t). */
function riserBoards(model){
  if(S.riserStyle==="open") return null;
  const t = sk(S.riserStock).t;
  const rh = S.riserFit==="captured" ? (model.r - sk(S.treadStock).t) : model.r;
  /* Riser 1 tucks under the PLATFORM decking, not under a tread board, so if
     those two are different thicknesses it is a different height to the rest. */
  const rh1 = S.riserFit==="captured"
    ? (model.r - (S.includePlatform ? sk(S.platSurface).t : sk(S.treadStock).t)) : model.r;
  const rows = [];
  const m=model.taper.m, ds=model.taper.diagSet;
  for(let k=1;k<=model.N;k++){
    /* Riser k stands on the INNER edge of ring k, which is ring k−1's outer
       edge — so it is clipped by c_(k-1), and riser 1 is the platform's own
       square corner (clip 0), which is why the platform stays 90°. */
    const c=model.clip(k-1);
    const frontLong = model.Wx+(k-1)*model.R - c, sideLong = model.Wy+(k-1)*model.R - c;
    const diagLong = c*Math.SQRT2;
    rows.push({
      k, height: k===1 ? rh1 : rh,
      /* setback long→short is t·m: t on a 45° miter, 0.414t on the taper's
         22.5° one — the joint is shallower so it eats less of the board */
      front:{long:frontLong, short:frontLong-t*m},
      side:{long:sideLong, short:sideLong-t*m},
      /* the corner face, mitered at BOTH ends. Zero on riser 1 by definition. */
      diag: model.taper.on && diagLong>0.0626
        ? {long:diagLong, short:Math.max(0, diagLong-2*t*ds)} : null
    });
  }
  return {rows, height:rh, height1:rh1, t, taper:model.taper};
}

/* Corner-style comparison: total board count / length / area per level,
   used by the "compare" corner-joint option in the Framing panel. */
function compareCornerStyles(model){
  const out = {miter:{count:0,total:0}, through:{count:0,total:0}};
  for(const lvl of model.levels){
    for(const legName of ["front","side"]){
      for(const style of ["miter","through"]){
        const tb = treadLegBoards(legName, lvl.k, model, style);
        out[style].count += tb.boards.length;
        out[style].total += tb.boards.reduce((s,b)=>s+b.long,0);
      }
    }
  }
  return out;
}
/* ---------- 12b. how the stringer meets the platform ---------------------
   The three connection types differ in ONE thing that matters structurally:
   whether the stringer merely HANGS on the face of the platform frame, or runs
   back UNDER it and BEARS on it.

   - top tread down : plumb cut butts the outside face. Nothing bears. All the
                      load goes through fasteners in shear -> a ledger, cleat
                      or stringer hangers is REQUIRED.
   - flush half     : the stringer runs back half a tread with a horizontal cut
                      at platform-frame level, so it sits ON the frame.
   - flush full     : same, a full tread of bearing.
   The sawtooth, riser count, run and footprint are identical in all three —
   only the top end of the board changes.

   THE TAB IS CUT LEVEL, NOT SLOPED. It has to slide under the platform decking
   and sit flat on the frame, so its top edge is horizontal — the nosing line
   stops at the platform face and the last riser face stays plumb. (Carrying the
   sloped nosing line back instead would draw the top riser as a diagonal, which
   cannot be built, and would overstate the board by tab*Ls/R instead of
   tab*R/Ls.) Two thicknesses decide the height of that level cut:
     - the material that exists there: the nosing line at the face, one tread
       thickness below the platform surface;
     - what it must pass under: the platform decking, st thick.
   So the cut is `lift` = max(0, st - tt) below the top notch corner, and when
   tt > st the tab lands `gap` = tt - st below the frame top and gets packed. */
function connectionInfo(model){
  const R=model.R, r=model.r, Ls=hyp(r,R);
  const kind=S.stairConnection||"topTreadDown";
  const tab = kind==="flushFull" ? R : kind==="flushHalf" ? R/2 : 0;
  const bears = tab>0.01;
  const tt = sk(S.treadStock).t;
  const st = S.includePlatform ? sk(S.platSurface).t : tt;
  const lift = bears ? Math.max(0, st-tt) : 0;   // trimmed off the top corner
  const gap  = bears ? Math.max(0, tt-st) : 0;   // shim between tab and frame top
  return {
    kind, tab, bears, lift, gap,
    /* How much longer the board is than the SAME stringer with no tab. Two
       parts: the level cut back `tab` dropped `lift`, projected on the slope,
       plus r²/Ls — because a tab gives the top notch a real riser face, where
       without one the board stops at the top seat. */
    extraLen: bears ? tab*R/Ls - lift*r/Ls + r*r/Ls : 0,
    bearing: tab,                           // horizontal bearing on the platform frame
    needsLedger: !bears,
    label: kind==="flushFull" ? t("Flush, full tread") : kind==="flushHalf" ? t("Flush, half tread") : t("Top tread down"),
    advice: bears
      ? t("The stringer runs {0} back under the platform and bears on its frame, so no ledger is needed for support — fasten it laterally (screws or angle brackets) to stop it sliding, and make sure the platform frame is continuous where it lands.", fmtIn(tab))
      : t("The stringer only butts the outside face of the platform frame, so nothing carries it — the load is entirely in the fasteners. You DO need a ledger or cleat under each stringer, or proper stringer hangers (e.g. Simpson LSC-type), rated for the load."),
    /* fit note, only when the tread and platform decking are not the same stock */
    fitNote: !bears ? "" :
      lift > 0.01 ? t("Your platform decking ({0}) is thicker than your treads ({1}), so the tab has to be cut {2} below the top notch corner to pass under it. That much throat is lost at the top of the board — check it against the {3} minimum.", fmtIn(st), fmtIn(tt), fmtIn(lift), fmtIn(S.throatMin))
    : gap > 0.01  ? t("Your treads ({0}) are thicker than the platform decking ({1}), so the top of the tab lands {2} BELOW the platform frame top. Pack that {2} out with a solid shim over the frame, or lower the bearing point by that much — do not just screw through the gap.", fmtIn(tt), fmtIn(st), fmtIn(gap))
    : ""
  };
}

/* ---------- 13. cut stringers -------------------------------------------- */
function stringerPositions(total, span){
  const count = Math.max(2, Math.ceil(total/span)+1);
  const step = total/(count-1);
  const pos = [];
  for(let i=0;i<count;i++) pos.push(i*step);
  return pos;
}
/* Minimum board length: build the sawtooth (nosing-line) profile for c
   notches and project every vertex onto the slope direction — the spread
   of those projections is the exact minimum length, no rule-of-thumb. */
function projectStringerLength(c, r, R, Ls, drop, topRun, topLift){
  if(c<=0) return 0;
  const verts = [[0,0]];
  /* Same rule as stringerBoardLayout: without a tab the top notch has no riser
     face, so (c·R, c·r) is not material and the top extreme is the top seat's
     back corner — r²/Ls less board. */
  for(let i=0;i<c;i++){
    verts.push([(i+1)*R, i*r]);
    if(i<c-1 || topRun>0) verts.push([(i+1)*R, (i+1)*r]);
  }
  /* A flush connection carries the board back under the platform by `topRun`
     horizontally, on a LEVEL cut `topLift` below the top notch corner — not
     along the sloped nosing line. The far corner of that cut is the top
     extreme, so the board grows topRun*R/Ls - topLift*r/Ls, not topRun*Ls/R. */
  if(topRun>0) verts.push([c*R+topRun, c*r-(topLift||0)]);
  /* The bottom of the stringer is NOT the bottom notch corner (0,0): material
     continues down the bottom plumb face to the level cut that bears on the
     deck, i.e. `drop` = r - tread thickness below it. That vertex projects
     NEGATIVE along the slope, so it lengthens the board by drop*r/Ls. Leaving
     it out understates the board — about 3" on a 7/11 stair, enough to buy a
     board one stock length too short. The top plumb cut needs no allowance:
     it leans back from the top notch corner, which stays the far extreme. */
  verts.push([0, -(drop||0)]);
  const ux = R/Ls, uy = r/Ls;
  let min=Infinity, max=-Infinity;
  for(const [x,y] of verts){ const p = x*ux+y*uy; if(p<min) min=p; if(p>max) max=p; }
  return max-min;
}
function stringersForLeg(legName, model){
  const Wb = legName==="front" ? model.Wx : model.Wy;
  const R=model.R, N=model.N, r=model.r;
  const stock = sk(S.stringerStock);
  const total = Wb+(N-1)*(R-cornerTaper(R).dc);
  /* Spacing is governed by what the TREADS can span between supports, not by
     the stringer's own span — 5/4x6 treads need 16" o.c. even though the 2x12
     carrying them is good for 24". */
  const spanLimit = sk(S.treadStock).span || 24;
  const positions = stringerPositions(total, spanLimit);
  /* A tapered corner eats into the legs, so a leg's outer end advances by
     R − dc per step, not R. Everything else about a leg stringer is unchanged. */
  const legGrow = R - model.taper.dc;
  const Ls = hyp(r,R);
  const notchDepth = r*R/Ls;
  const throat = stock.w - notchDepth;
  const minWidth = notchDepth + S.throatMin;          // narrowest board that can carry this pitch
  const drop = Math.max(0, r - sk(S.treadStock).t) + model.base;   // bottom plumb face, down to bearing
  const conn = connectionInfo(model);
  const stockLens = parseStockLens();
  /* Every stringer gets an ID — F1.. on the front leg, S1.. on the side leg,
     numbered outward from the house wall — and it is the SAME string in the
     plan view, the framing tables, the sheets and the cut list, so you can tell
     which board on the pile goes where. The hip is H. */
  const tag = legName==="front" ? "F" : "S";
  const list = positions.map((p,i)=>{
    let kmin = Math.max(1, Math.ceil((p-Wb)/legGrow)+1);
    if(kmin>N) kmin = N;
    const c = Math.max(0, N-kmin);
    /* only the stringers that actually reach the platform get the flush tab */
    const topRun = (kmin===1) ? conn.tab : 0;
    const topLift = topRun>0 ? conn.lift : 0;
    const reqLen = c>0 ? projectStringerLength(c,r,R,Ls,drop,topRun,topLift) : 0;
    const boardLen = c>0 ? pickStockLen(reqLen, stockLens) : null;
    return {pos:p, kmin, c, reqLen, boardLen, topRun, topLift};
  }).filter(s=>s.c>0);
  /* ids assigned after filtering, so they read 1..n with no gaps */
  list.forEach((s,i)=>{ s.id=tag+(i+1); });
  const groups = {};
  for(const s of list) (groups[s.c] = groups[s.c] || []).push(s);
  return {legName, Wb, R, N, r, Ls, notchDepth, throat, positions, list, groups, stock,
          minWidth, spanLimit, drop, fitsStock: stock.w >= minWidth - 1e-9,
          spacing: positions.length>1 ? positions[1]-positions[0] : 0};
}
/* Hip stringer at the outside corner: same rise r, run R*sqrt2, carries all
   N-1 notches, 45 degree plan bevels, and its own (usually tighter) throat. */
function hipStringer(model){
  const R=model.R, r=model.r, N=model.N;
  const Rh = R*Math.SQRT2;
  const c = N-1;
  const Ls = hyp(r,Rh);
  const notchDepth = r*Rh/Ls;
  const stock = sk(S.stringerStock);
  const throat = stock.w-notchDepth;
  const minWidth = notchDepth + S.throatMin;
  const drop = Math.max(0, r - sk(S.treadStock).t) + model.base;
  /* the hip meets the corner of the platform, so it gets the tab too — on the
     diagonal, where the horizontal run is R*sqrt(2) */
  const cn = connectionInfo(model);
  const topRun = cn.tab * Math.SQRT2, topLift = cn.lift;
  const reqLen = projectStringerLength(c,r,Rh,Ls,drop,topRun,topLift);
  const boardLen = pickStockLen(reqLen, parseStockLens());
  return {run:Rh, rise:r, c, Ls, notchDepth, throat, reqLen, boardLen, stock, drop,
          topRun, topLift, minWidth, fitsStock: stock.w >= minWidth - 1e-9};
}

/* ---------- 13b. corner stringers, tapered corner -------------------------
   A tapered corner has no 90° point to hip, so there is no hip stringer. The
   flat 45° face is carried by stringers running perpendicular to it — along the
   old hip direction — spaced ACROSS the face. Their run per step is the
   diagonal going g, so when g = R they are literally the same board as a common
   leg stringer: same notches, same throat, same length. That is the taper's
   biggest practical payoff, because the hip's run of R√2 bites so deep it often
   will not come out of a 2x12 at all.

   The face is only c_k·√2 wide at ring k, so a stringer offset p from the
   centreline cannot start until the face has grown past it — the same jack
   logic as the legs, in the other direction. */
function cornerStringers(model){
  if(!model.taper.on) return null;
  const {R,r,N}=model, dc=model.taper.dc, g=model.taper.g;
  const stock=sk(S.stringerStock);
  const Ls=hyp(r,g), notchDepth=r*g/Ls, throat=stock.w-notchDepth;
  const minWidth=notchDepth+S.throatMin;
  const drop=Math.max(0, r-sk(S.treadStock).t)+model.base;
  const cn=connectionInfo(model);
  const spanLimit=sk(S.treadStock).span||24;
  const faceMax=model.clip(N-1)*Math.SQRT2;            // the bottom step's face
  const stockLens=parseStockLens();
  const half=faceMax/2;
  /* INTERIOR ONLY. The face's two EDGES are the joint lines, and those now carry
     a hip stringer each, so these only have to break up the span between them.
     One at the centreline is the common case, and it is the only line that
     reaches the top step. */
  const segs=Math.max(1, Math.ceil(faceMax/spanLimit));
  const laterals=[]; for(let i=1;i<segs;i++) laterals.push(-half+i*(faceMax/segs));
  const step=faceMax/segs;
  const list=laterals.map((lat,i)=>{
    const p=Math.abs(lat);
    /* full depth at p needs ring k−1's face to reach p too */
    let kmin = dc>0 ? Math.max(1, Math.ceil(2*p/(dc*Math.SQRT2))+1) : 1;
    if(kmin>N) kmin=N;
    const c=Math.max(0,N-kmin);
    /* the centre one meets the platform's corner POINT, so its tab runs in
       diagonally — tab·√2 along its own axis, exactly as the old hip did */
    const topRun=(kmin===1) ? cn.tab*Math.SQRT2 : 0;
    const topLift=topRun>0 ? cn.lift : 0;
    const reqLen=c>0 ? projectStringerLength(c,r,g,Ls,drop,topRun,topLift) : 0;
    return {lateral:lat, pos:lat+half, kmin, c, reqLen,
            boardLen: c>0 ? pickStockLen(reqLen, stockLens) : null, topRun, topLift};
  }).filter(s=>s.c>0);
  /* Number them AFTER filtering, so the ids you read are 1..n with no gaps —
     the ones that drop out never existed as boards. */
  list.forEach((s,i)=>{ s.id="C"+(i+1); });
  /* Worst clear span across the WIDEST face, edge to edge: the edges are hips,
     so it is just the interior spacing. */
  const lats=[-half, ...list.map(s=>s.lateral), half].sort((a,b)=>a-b);
  let worst=0;
  for(let i=1;i<lats.length;i++) worst=Math.max(worst, lats[i]-lats[i-1]);
  return {run:g, rise:r, Ls, notchDepth, throat, minWidth, stock, drop, list,
          faceMax, spanLimit, sameAsLegs: Math.abs(g-R)<1e-9,
          spacing: step, worstSpan: worst, spansOK: worst <= spanLimit+1e-9,
          fitsStock: stock.w >= minWidth - 1e-9};
}

/* ---------- 14. box frames ------------------------------------------------
   One L-shaped box per level k, rim height = r - tread thickness. Load path:
   box k's outer rim bears on box k+1's tread boards directly over box k+1's
   inner rim; box k's inner rim needs blocking down to the deck except k=1
   (fastens to the platform frame) and k=N-1 (sits on the deck). */
function boxesForLevel(model,k){
  const R=model.R, r=model.r;
  /* Every box is r - tread thickness tall, EXCEPT the bottom one when the
     framing bears on the deck structure: it reaches a decking thickness lower,
     so it is that much deeper and may need wider stock. */
  const isBottom = k===model.N-1;
  const rimH = r - sk(S.treadStock).t + (isBottom ? model.base : 0);
  const rimStock = sk(S.frameStock);
  const spacing = sk(S.treadStock).span || 24;
  const legs = ["front","side"].map(legName=>{
    const Wb = legName==="front" ? model.Wx : model.Wy;
    /* a tapered corner shortens both leg rims — they now stop at the joint with
       the diagonal instead of running out to a 90° point */
    const outer = Wb+k*R - model.clip(k), inner = Wb+(k-1)*R - model.clip(k-1);
    const joistLen = Math.max(0, R-2*rimStock.t);
    /* ceil, not floor: floor(71/24)+1 = 3 joists leaves 35" clear on a 24"
       span. ceil(71/24)+1 = 5 gives 17-3/4" clear. */
    const joistCount = Math.max(2, Math.ceil(outer/spacing)+1);
    return {legName, outer, inner, joistLen, joistCount, joistSpacing: outer/Math.max(1,joistCount-1)};
  });
  /* Tapered corner: the diagonal face is a third band with its own rims and its
     own joists, perpendicular to the 45° face. Ring 1's inner rim has zero
     length (the platform corner is a point), so that band is a triangle and
     gets an outer rim and joists only. */
  const dg = model.taper.on ? (()=>{
    const outer=model.clip(k)*Math.SQRT2, inner=model.clip(k-1)*Math.SQRT2;
    const joistLen=Math.max(0, model.taper.g-2*rimStock.t);
    const joistCount=Math.max(2, Math.ceil(outer/spacing)+1);
    return {outer, inner, joistLen, joistCount,
            joistSpacing: outer/Math.max(1,joistCount-1),
            triangle: inner<0.0626};
  })() : null;
  return {k, rimH, isBottom, legs, diag:dg, rimFit: fitBoards(rimH, rimStock.w, 0),
          rimStockOK: rimStock.w >= rimH - 1e-9};
}
/* ---------- 14b. the two hips of a tapered corner -------------------------
   Ring k's joint line — where the leg tread boards meet the corner ones — runs
   from (Wx+(k-1)R-c_(k-1), Wy+(k-1)R) to (Wx+kR-c_k, Wy+kR). Its direction is
   (R-dc, R) for EVERY k, and ring 1's starts at the platform corner itself, so
   all of them are segments of ONE STRAIGHT LINE from that corner down to the
   deck. There are two, mirrored.

   That makes them hips, and they want a real notched stringer, not blocking: a
   member on the hip carries the mitered ends of the leg boards AND of the corner
   boards, which is exactly what those miters need. So a tapered corner has TWO
   hips at 22.5 degrees either side of where the square corner's single 45 degree
   hip was — and each has run hyp(R-dc, R), only a little more than R, where the
   square hip's R*sqrt2 is what refuses to come out of a 2x12. */
function cornerHipStringers(model){
  if(!model.taper.on) return null;
  const {R,r,N}=model, dc=model.taper.dc;
  const Rj=hyp(R-dc,R);                       // run per step along the joint line
  const Ls=hyp(r,Rj), notchDepth=r*Rj/Ls;
  const stock=sk(S.stringerStock), throat=stock.w-notchDepth;
  const minWidth=notchDepth+S.throatMin;
  const drop=Math.max(0, r-sk(S.treadStock).t)+model.base;
  const cn=connectionInfo(model);
  /* It starts AT the platform corner, so it gets the tab — travelling Rj/R along
     its own axis for every R of bearing measured square to the platform face. */
  const topRun=cn.tab*Rj/R, topLift=cn.lift;
  const c=N-1;
  const reqLen=projectStringerLength(c,r,Rj,Ls,drop,topRun,topLift);
  return {run:Rj, rise:r, c, Ls, notchDepth, throat, minWidth, stock, drop,
          reqLen, boardLen:pickStockLen(reqLen, parseStockLens()), topRun, topLift,
          angleDeg:model.taper.sawDeg, qty:2, ids:["H1","H2"],
          fitsStock: stock.w >= minWidth - 1e-9};
}
/* The inner rim runs the whole length of BOTH legs, so it needs a block at
   every joist position — not one per level. Level 1 fastens to the platform
   frame and the bottom level sits on the deck, so neither needs blocks. */
function boxSupportBlocks(model){
  const blocks = [];
  const spacing = sk(S.treadStock).span || 24;
  for(let k=2;k<=model.N-2;k++){
    const height = model.H-(k+1)*model.r + model.base;   // z_(k+1) down to the bearing plane
    for(const legName of ["front","side"]){
      const Wb = legName==="front" ? model.Wx : model.Wy;
      const inner = Wb+(k-1)*model.R;
      blocks.push({k, legName, inner, height,
        qty: Math.max(2, Math.ceil(inner/spacing)+1),
        note:"under level "+k+"'s "+legName+" inner rim, down to the deck"});
    }
  }
  return blocks;
}

/* ---------- 15. platform framing ----------------------------------------- */
function platformModel(model){
  const surf = sk(S.platSurface), frame = sk(S.platFrame);
  /* Frame height reaches from the underside of its decking down to bearing. */
  const height = model.H - surf.t + model.base;
  const dir = S.platJoistDir;                     // 'y' = out from wall, 'x' = along wall
  const alongJoist = dir==="y" ? model.Wy : model.Wx;
  const acrossJoist = dir==="y" ? model.Wx : model.Wy;
  const joistLen = Math.max(0, alongJoist-2*frame.t);
  const joistCount = Math.max(2, Math.ceil(acrossJoist/(surf.span||16))+1);   // ceil: see boxesForLevel
  const rimPieces = [
    {len:model.Wx, qty:2, role:"platform rim (X, full length)"},
    {len:Math.max(0,model.Wy-2*frame.t), qty:2, role:"platform rim (Y, fit between)"}
  ];
  /* The platform IS the top tread, so its decking overhangs the two faces that
     have steps below them by the nosing — same detail as every other tread.
     The frame stays Wx × Wy; only the decking is bigger. */
  /* Overhang past the frame = riser thickness (the platform's own riser board
     is captured under this decking) + the nosing. */
  const nose = model.nose, over = model.riserT + nose;
  const deckBoardLen = (dir==="y" ? model.Wx : model.Wy) + over;   // boards run across the overhung face
  const deckFillDim  = (dir==="y" ? model.Wy : model.Wx) + over;
  const deckFit = fitBoards(deckFillDim, surf.w, S.treadGap);
  /* FLOATING platform, built entirely from the platform frame stock: a box
     frame whose depth is that stock's width, standing on legs cut from the
     same stock. Nothing is attached to the house. */
  const frameDepth = frame.w;
  const legH = height - frameDepth;                       // what the legs have to make up
  /* Legs are their own stock — a 4x4 post carries the load in compression on
     its own, where frame stock on edge is a plank and wants doubling and
     bracing once it gets tall. Spacing still comes from the FRAME, since that
     is the member spanning between the legs. */
  const leg = sk(S.legStock || S.platFrame);
  const legSpan = frame.span || 24;
  const legCols = Math.max(2, Math.ceil(model.Wx/legSpan)+1);
  const legRows = Math.max(2, Math.ceil(model.Wy/legSpan)+1);
  const needsLegs = legH > 0.25;
  const legCount = needsLegs ? legCols*legRows : 0;
  /* A post is square-ish, so it is stable on its own; a plank on edge is not.
     Only warn about bracing when the leg is far taller than it is thick. */
  const legMin = Math.min(leg.t, leg.w);
  const isPost = Math.abs(leg.t-leg.w) < 0.51 && legMin >= 3;
  const ripFrame = height < frameDepth - 0.0626;          // stock deeper than the whole platform
  return {height, dir, joistLen, joistCount, rimPieces, deckFit, deckBoardLen, deckFillDim,
          surf, frame, leg, legName:S.legStock||S.platFrame, isPost,
          nose, finX:model.platFinX, finY:model.platFinY,
          frameDepth, legH, legSpan, legCols, legRows, legCount, needsLegs, ripFrame,
          braceNeeded: needsLegs && !isPost && legH > 6*legMin};
}
/* ---------- 15b. skirts on the open side face (X=0) ---------------------- */
/* The exposed end runs from the platform face (y=Wy, z=H) down to the deck
   (y=footY, z=0), so a single raking skirt board covers it. Minimum board
   width has to reach from the nosing line past the step corners. */
function skirtPieces(model){
  const runTotal = (model.N-1)*model.R + model.nose;
  const rake = hyp(runTotal, model.H);
  const minW = model.r*model.R/hyp(model.r,model.R) + 2;
  const out = [{role:t("Side skirt (open X=0 face)"), stock:S.skirtStock, len:rake, qty:1, angle:t("rake"),
    note:t("cut to the step profile; needs a board at least {0} wide ({1} is {2})", fmtIn(minW), S.skirtStock, fmtIn(sk(S.skirtStock).w))}];
  if(S.includePlatform)
    out.push({role:t("Platform side skirt (X=0)"), stock:S.skirtStock, len:model.Wy, qty:1,
      note:t("clads the platform rim on the open side")});
  return out;
}
function skirtInfo(model){
  const minW = model.r*model.R/hyp(model.r,model.R) + 2;
  return {rake: hyp((model.N-1)*model.R+model.nose, model.H), minW, wide: sk(S.skirtStock).w >= minW};
}

/* ---------- 16. piece collection ----------------------------------------- */
function collectPieces(model){
  const pieces = [];
  /* A tapered corner has no square butt to run through, so the joint is always
     the mitered one — at the taper's own angle, not 45°. */
  const style = (model.taper.on || S.cornerStyle!=="through") ? "miter" : "through";
  const cornerAng = dec(model.taper.sawDeg.toFixed(1))+"°";
  for(const lvl of model.levels){
    for(const legName of ["front","side"]){
      const tb = treadLegBoards(legName, lvl.k, model, style);
      for(const b of tb.boards){
        pieces.push({role:t("Tread L{0} {1} bd{2}", lvl.k, t(legName), b.j), stock:S.treadStock, len:b.long, qty:1,
          angle: style==="miter" ? cornerAng+"/90°" : "90°/90°", note:t("offset {0}", fmtIn(b.o))});
      }
    }
    const dg = treadDiagBoards(lvl.k, model);
    if(dg) for(const b of dg.boards){
      pieces.push({role:t("Tread L{0} corner bd{1}", lvl.k, b.j), stock:S.treadStock, len:b.long, qty:1,
        angle: b.triangle ? t("{0} both ends — triangle", cornerAng) : cornerAng+"/"+cornerAng,
        note:t("offset {0}, short point {1}", fmtIn(b.o), fmtIn(b.short))});
    }
  }
  if(S.riserStyle==="closed"){
    const rb = riserBoards(model);
    for(const row of rb.rows){
      pieces.push({role:t("Riser {0} {1}", row.k, t("front")), stock:S.riserStock, len:row.front.long, qty:1, angle:cornerAng+"/90°"});
      pieces.push({role:t("Riser {0} {1}", row.k, t("side")), stock:S.riserStock, len:row.side.long, qty:1, angle:cornerAng+"/90°"});
      if(row.diag) pieces.push({role:t("Riser {0} corner", row.k), stock:S.riserStock, len:row.diag.long, qty:1,
        angle:cornerAng+"/"+cornerAng, note:t("short point {0}", fmtIn(row.diag.short))});
    }
  }
  if(S.method==="stringers"){
    for(const legName of ["front","side"]){
      const st = stringersForLeg(legName, model);
      for(const s of st.list){
        /* The PIECE is the stringer's cut length, not the stock it comes from —
           feeding the stock length in here made the packer buy a whole board per
           stringer instead of nesting two or three on one. */
        pieces.push({role:t("{0} — {1} stringer, {2}", s.id, s.kmin===1?t("common"):t("jack"), notchCount(s.c)),
          stock:S.stringerStock, len:s.reqLen, qty:1,
          angle:t("layout marks"), note:t("at {0}", fmtIn(s.pos))+(s.boardLen?"":t(" — needs splice"))});
      }
    }
    const cs = cornerStringers(model), ch = cornerHipStringers(model);
    /* A flush tab rides OVER the rim, so an angled member needs no plan bevel at
       all; only a top-tread-down butt does. Saying "45° plan bevel" regardless
       was wrong for two of the three connection types. */
    const planAng = d => connectionInfo(model).bears
      ? t("layout marks — square in plan")
      : t("{0}° vee at the top end", dec(d.toFixed(1)))+" / "+dec((90-d).toFixed(1))+"°";
    if(ch){
      /* two hips instead of one, on the joint lines */
      pieces.push({role:t("H1, H2 — corner hips, {0}", notchCount(ch.c)), stock:S.stringerStock,
        len:ch.reqLen, qty:2, angle:planAng(ch.angleDeg),
        note:t("on the joint lines, from the platform corner down")+(ch.boardLen?"":t(" — needs splice"))});
      for(const s of cs.list)
        pieces.push({role:t("{0} — corner face stringer, {1}", s.id, notchCount(s.c)), stock:S.stringerStock,
          len:s.reqLen, qty:1, angle:planAng(45),
          note:t("{0} off the centreline", fmtIn(Math.abs(s.lateral)))+(s.boardLen?"":t(" — needs splice"))});
    } else {
      const hip = hipStringer(model);
      pieces.push({role:t("H — hip stringer, {0}", notchCount(hip.c)), stock:S.stringerStock, len:hip.reqLen, qty:1,
        angle:planAng(45), note: hip.boardLen?"":t("needs splice")});
    }
  } else {
    for(const lvl of model.levels){
      const bx = boxesForLevel(model, lvl.k);
      const rimNote = t("rim height {0}", fmtIn(bx.rimH))+(bx.isBottom&&model.base>0?t(" (deeper — bears on the deck structure)"):"");
      for(const leg of bx.legs){
        pieces.push({role:t("Box {0} {1} outer rim", lvl.k, t(leg.legName)), stock:S.frameStock, len:leg.outer, qty:1, angle:cornerAng, note:rimNote});
        pieces.push({role:t("Box {0} {1} inner rim", lvl.k, t(leg.legName)), stock:S.frameStock, len:leg.inner, qty:1, angle:cornerAng, note:rimNote});
        pieces.push({role:t("Box {0} {1} joist", lvl.k, t(leg.legName)), stock:S.frameStock, len:leg.joistLen, qty:leg.joistCount, angle:"90°"});
      }
      if(bx.diag){
        /* the tapered corner's own band: rims along the 45° face, joists across */
        pieces.push({role:t("Box {0} corner outer rim", lvl.k), stock:S.frameStock, len:bx.diag.outer, qty:1, angle:cornerAng+"/"+cornerAng, note:rimNote});
        if(!bx.diag.triangle)
          pieces.push({role:t("Box {0} corner inner rim", lvl.k), stock:S.frameStock, len:bx.diag.inner, qty:1, angle:cornerAng+"/"+cornerAng, note:rimNote});
        pieces.push({role:t("Box {0} corner joist", lvl.k), stock:S.frameStock, len:bx.diag.joistLen, qty:bx.diag.joistCount, angle:"90°"});
      } else {
        pieces.push({role:t("Box {0} corner block", lvl.k), stock:S.frameStock, len:hyp(sk(S.frameStock).w,sk(S.frameStock).w), qty:1, angle:"45°"});
      }
    }
    for(const blk of boxSupportBlocks(model)){
      pieces.push({role:t("Support block (box {0} {1})", blk.k, t(blk.legName)), stock:S.frameStock,
        len:Math.max(blk.height,0.25), qty:blk.qty,
        note:t("under level {0}'s {1} inner rim, down to the deck", blk.k, t(blk.legName))});
    }
  }
  /* Skirts. Only the X=0 side face is ever exposed — the wall closes Y=0, and
     the other two faces are the stairs themselves. */
  if(S.faceX0==="open"){
    const sk1 = skirtPieces(model);
    for(const p of sk1) pieces.push(p);
  }
  if(S.includePlatform){
    const pf = platformModel(model);
    for(const rp of pf.rimPieces) pieces.push({role:t(rp.role), stock:S.platFrame, len:rp.len, qty:rp.qty});
    pieces.push({role:t("Platform joist"), stock:S.platFrame, len:pf.joistLen, qty:pf.joistCount});
    if(pf.needsLegs)
      pieces.push({role:t("Platform leg (floating)"), stock:pf.legName, len:pf.legH, qty:pf.legCount,
        note:t("{0} × {1} grid at {2} o.c.", pf.legCols, pf.legRows, fmtIn(pf.legSpan))});
    pieces.push({role:t("Platform decking"), stock:S.platSurface, len:pf.deckBoardLen, qty:pf.deckFit.n + (pf.deckFit.recommend==="rip"?1:pf.deckFit.recommend==="overshoot"?1:0)});
  }
  return pieces.filter(p=>p.len>0 && p.qty>0);
}

/* ---------- 17. bin packing (first-fit-decreasing) ----------------------- */
/* When a new bin is needed, try every stock length long enough for the
   current (largest remaining) piece, simulate packing the rest into it,
   and keep whichever length gives the best fill. */
function binPack(pieces){
  const kerf = S.kerf, minOff = S.minOffcut;
  const stockLens = parseStockLens();
  const byStock = {};
  for(const p of pieces) (byStock[p.stock] = byStock[p.stock] || []).push(p);
  const out = {};
  for(const stockName in byStock){
    let items = [];
    for(const p of byStock[stockName]) for(let i=0;i<p.qty;i++) items.push({len:p.len, role:p.role});
    items.sort((a,b)=>b.len-a.len);
    const bins = [];
    while(items.length){
      const first = items[0];
      const candidates = stockLens.filter(L=>L>=first.len);
      const tryLens = candidates.length ? candidates : [Math.max(first.len, stockLens.length?Math.max(...stockLens):first.len)];
      let best = null;
      for(const L of tryLens){
        let remaining = L, taken = [], used = 0;
        for(let idx=0; idx<items.length; idx++){
          const it = items[idx];
          const need = it.len + (used>0 ? kerf : 0);
          if(need <= remaining){ remaining -= need; used++; taken.push(idx); }
        }
        const fill = (L-remaining)/L;
        if(!best || fill>best.fill || (fill===best.fill && L<best.L)) best = {L, taken, fill, remaining};
      }
      const cuts = best.taken.map(i=>items[i]);
      bins.push({stockLen:best.L, cuts, waste:best.remaining});
      best.taken.sort((a,b)=>b-a).forEach(i=>items.splice(i,1));
    }
    out[stockName] = bins.map(b=>({...b, wastePct: b.stockLen?(b.waste/b.stockLen*100):0, offcutUsable: b.waste>=minOff}));
  }
  return out;
}

/* ---------- 18. SVG drawing helpers -------------------------------------- */
function svgOpen(w,h){ return '<svg viewBox="0 0 '+w.toFixed(0)+' '+h.toFixed(0)+'" xmlns="http://www.w3.org/2000/svg">'; }
function svgLine(x1,y1,x2,y2,extra){ return '<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" '+(extra||'stroke="#334" stroke-width="1"')+'/>'; }
function svgText(x,y,s,extra){ return '<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" '+(extra||'font-size="10" fill="#334"')+'>'+s+'</text>'; }
function svgRect(x,y,w,h,extra){ return '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'" '+(extra||'fill="none" stroke="#334"')+'/>'; }
/* Rough advance width of an SVG label. Used to size gutters and canvases from
   the ACTUAL text, so a longer translation cannot run off the drawing. */
function estTextW(s,fs){ return String(s).length*(fs||10)*0.55; }
function svgPoly(pts,extra){ return '<polygon points="'+pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")+'" '+(extra||'fill="none" stroke="#334"')+'/>'; }
function dimLineH(x1,x2,y,label){
  const t=4;
  return svgLine(x1,y,x2,y,'stroke="#333" stroke-width=".75"')
    +svgLine(x1,y-t,x1,y+t,'stroke="#333" stroke-width=".75"')
    +svgLine(x2,y-t,x2,y+t,'stroke="#333" stroke-width=".75"')
    +'<text x="'+((x1+x2)/2).toFixed(1)+'" y="'+(y-5).toFixed(1)+'" font-size="10" fill="#333" text-anchor="middle">'+label+'</text>';
}
function dimLineV(x,y1,y2,label,side){
  const t=4, left = side==="left";
  return svgLine(x,y1,x,y2,'stroke="#333" stroke-width=".75"')
    +svgLine(x-t,y1,x+t,y1,'stroke="#333" stroke-width=".75"')
    +svgLine(x-t,y2,x+t,y2,'stroke="#333" stroke-width=".75"')
    +'<text x="'+(left?x-6:x+6).toFixed(1)+'" y="'+((y1+y2)/2).toFixed(1)+'" font-size="10" fill="#333" text-anchor="'+(left?"end":"start")+'">'+label+'</text>';
}
function scaleBarSVG(x,y,scale){ const oneFoot=12*scale; return svgLine(x,y,x+oneFoot,y,'stroke="#000" stroke-width="2"')+svgText(x,y-4,t("scale: 1 ft"),'font-size="9" fill="#000"'); }
/* leader line from a point on the drawing out to a label in the gutter */
function svgLead(px,py,tx,ty,txt,anchor){
  return svgLine(px,py,tx+(anchor==="end"?6:-6),ty-3,'stroke="#7a8794" stroke-width=".7"')
    +'<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="1.7" fill="#7a8794"/>'
    +'<text x="'+tx.toFixed(1)+'" y="'+ty.toFixed(1)+'" font-size="10" fill="#223" text-anchor="'+(anchor||"start")+'">'+txt+'</text>';
}
/* ---------- 17b. label declutter -----------------------------------------
   Final pass over a finished SVG: nudge any two overlapping <text> labels
   apart vertically, and drag the endpoint of a leader line that pointed at a
   moved label along with it. Hand-placing every label cannot survive a longer
   translation, 7 risers or a 24" platform, so this catches what placement
   misses. */
function declutterSVG(svg){
  let doc;
  try{ doc=new DOMParser().parseFromString(svg,"image/svg+xml"); }catch(e){ return svg; }
  if(!doc || doc.querySelector("parsererror")) return svg;
  const vb=(doc.documentElement.getAttribute("viewBox")||"").split(/\s+/).map(Number);
  const H=vb[3]||0; if(!H) return svg;
  const texts=[...doc.querySelectorAll("text")].filter(n=>!n.getAttribute("transform"));
  if(texts.length<2) return svg;
  const lines=[...doc.querySelectorAll("line")];
  const box=n=>{
    const x=+n.getAttribute("x"), y=+n.getAttribute("y");
    const fs=parseFloat(n.getAttribute("font-size")||"10");
    const w=n.textContent.length*fs*0.55, a=n.getAttribute("text-anchor")||"start";
    const l=a==="end"?x-w:a==="middle"?x-w/2:x;
    return {l,r:l+w,t:y-fs*0.8,b:y+fs*0.25,fs};
  };
  /* Only drag LEADER lines (sloped and reasonably long). Dimension lines are
     horizontal and their ticks are short — moving those would distort the
     measurement they represent. */
  const dragLeader=(ox,oy,dy)=>{
    for(const ln of lines){
      const x1=+ln.getAttribute("x1"), y1=+ln.getAttribute("y1");
      const x2=+ln.getAttribute("x2"), y2=+ln.getAttribute("y2");
      if(Math.abs(y1-y2)<0.5) continue;                       // horizontal = dimension line
      if(Math.hypot(x2-x1,y2-y1)<10) continue;                // stub = tick mark
      if(Math.abs(x2-ox)<10 && Math.abs(y2-oy)<10) ln.setAttribute("y2",(y2+dy).toFixed(1));
    }
  };
  const move=(n,dy)=>{
    const y=+n.getAttribute("y"), fs=parseFloat(n.getAttribute("font-size")||"10");
    const ny=Math.max(fs, Math.min(H-2, y+dy));
    if(Math.abs(ny-y)<0.05) return false;                 // clamped at an edge
    dragLeader(+n.getAttribute("x"), y, ny-y);
    n.setAttribute("y", ny.toFixed(1));
    return true;
  };
  /* Single ordered placement pass: each label is cleared against the ones
     already placed. Pairwise relaxation oscillated — a label pushed off one
     neighbour landed on another and got pushed back — so this never revisits
     a settled label and therefore always terminates. */
  const hitsWith=(b,placed)=>placed.find(p=>
    Math.min(p.r,b.r)-Math.max(p.l,b.l)>1.5 && Math.min(p.b,b.b)-Math.max(p.t,b.t)>1.5);
  const placed=[];
  for(const n of texts){
    let b=box(n), guard=0;
    while(guard++<24){
      const hit=hitsWith(b,placed);
      if(!hit) break;
      if(!move(n, hit.b-b.t+2.5)){                 // push clear below the blocker
        const bb=box(n);
        if(!move(n, hit.t-bb.b-2.5)) break;        // no room below: go above
      }
      b=box(n);
    }
    placed.push(box(n));
  }
  return new XMLSerializer().serializeToString(doc);
}
