  s+=svgLead(X(Xi/2),Y(Yi+tk/2),gx,Y(Yo*0.68),LBL.inner);
  s+=svgLead(X(Xi+tk*1.4),Y(Yi+tk*1.4),gx,Y(Yo*0.84),LBL.block);
  s+=svgLead(X(Xo/2),Y(Yo-tk/2),gx,Y(Yo*0.98),LBL.outer);
  s+=dimLineH(X(0),X(Xo),Y(Yo)+18,L(Xo));           // width along the wall, below
  s+=dimLineV(X(0)-16,Y(0),Y(Yo),L(Yo),"left");     // depth out from the wall
  s+=svgText(mL,H-24,foot,'font-size="9" fill="#78838f"');
  s+=scaleBarSVG(mL,H-8,sc);
  s+="</svg>";
  return declutterSVG(s);
}
function renderBoxSheets(model){
  let h=legendHTML([["#b79a6f","#6b5335",t("rim boards ({0})", S.frameStock)],
                    ["#d7c4a4","#8a6a45",t("joists ({0})", S.frameStock)],
                    ["#b39875","#8a6a45",t("corner block")],
                    ["#f2f5f8","#c3ced8",t("the step above")]]);
  for(const lvl of model.levels)
    h+='<div class="sheet"><div class="svgwrap">'+boxFramePlanSVG(model,lvl.k)+"</div></div>";
  return h;
}

/* One sheet per DISTINCT stringer in the job, plus the hip — they are not all
   the same board: the ones nearer the corner carry fewer notches. */
function renderStringerSheets(model){
  const bw=sk(S.stringerStock).w, Ls=hyp(model.r,model.R);
  let h="";
  for(const legName of ["front","side"]){
    const st=stringersForLeg(legName,model);
    const seen=new Set();
    for(const g of st.list){
      if(seen.has(g.c)) continue;
      seen.add(g.c);
      const same=st.list.filter(x=>x.c===g.c);
      const qty=same.length;
      const ids=idRange(same.map(x=>x.id));
      const title=t("{0} · {1} (levels {2}–{3}) · run {4} rise {5} · marks every {6} · board ≥ {7}",
          ids, notchCount(g.c), g.kmin, model.N, L(model.R), L(model.r), L(Ls), L(g.reqLen))
        +(g.boardLen ? t(" — cut from {0}", L(g.boardLen)) : t(" — NEEDS A SPLICE"));
      const perBoard=g.boardLen ? Math.max(1, Math.floor((g.boardLen+S.kerf)/(g.reqLen+S.kerf))) : 1;
      const boardsNeeded=Math.ceil(qty/perBoard);
      h+='<div class="sheet"><h4>'+t("{0} — on the board: {1} needed, {2} per board, {3} board(s)", ids, qty, Math.min(perBoard,qty), boardsNeeded)+"</h4>"
        +'<div class="svgwrap">'+stringerStockSVG(g.c,model.r,model.R,st.drop,bw,g.boardLen,title,Math.min(perBoard,qty),g.topRun,g.topLift)+"</div>"
        +'<h4>'+t("Finished profile")+"</h4>"
        +'<div class="svgwrap">'+stringerProfileSVG(g.c,model.r,model.R,st.drop,bw,title,g.topRun,g.topLift)+"</div>"
        +cutScheduleHTML(model, {c:g.c, r:model.r, R:model.R, Ls, drop:st.drop, bw,
            topRun:g.topRun, topLift:g.topLift, reqLen:g.reqLen, boardLen:g.boardLen,
            notchDepth:st.notchDepth, throat:st.throat, minWidth:st.minWidth, qty,
            kmin:g.kmin, name:ids+" · "+stringerRole(legName, g.kmin)})
        +"</div>";
    }
  }
  const cs=cornerStringers(model), chS=cornerHipStringers(model);
  if(chS){
    /* the two hips first — they are the corner's main members */
    const hTitle=t("H1, H2 · corner hips · run {0} = hyp(R−dc, R) · {1} · marks every {2} · board ≥ {3} · throat {4}",
      L(chS.run), notchCount(chS.c), L(chS.Ls), L(chS.reqLen), fmtIn(chS.throat));
    const perB=chS.boardLen ? Math.max(1, Math.floor((chS.boardLen+S.kerf)/(chS.reqLen+S.kerf))) : 1;
    h+='<div class="sheet"><h4>'+t("H1, H2 — on the board: 2 needed, {0} per board, {1} board(s)", Math.min(perB,2), Math.ceil(2/perB))+"</h4>"
      +'<div class="svgwrap">'+stringerStockSVG(chS.c,model.r,chS.run,chS.drop,bw,chS.boardLen,hTitle,Math.min(perB,2),chS.topRun,chS.topLift)+"</div>"
      +'<h4>'+t("Finished profile")+"</h4>"
      +'<div class="svgwrap">'+stringerProfileSVG(chS.c,model.r,chS.run,chS.drop,bw,hTitle,chS.topRun,chS.topLift)+"</div>"
      +cutScheduleHTML(model, {c:chS.c, r:model.r, R:chS.run, Ls:chS.Ls, drop:chS.drop, bw,
          topRun:chS.topRun, topLift:chS.topLift, reqLen:chS.reqLen, boardLen:chS.boardLen,
          notchDepth:chS.notchDepth, throat:chS.throat, minWidth:chS.minWidth, qty:2,
          kmin:1, name:t("H1, H2 · corner hips"), hip:true})
      +planCutsHTML(model, {c:chS.c, r:model.r, R:chS.run, drop:chS.drop, bw,
          topRun:chS.topRun, topLift:chS.topLift, planDeg:model.taper.sawDeg,
          name:t("H1, H2 · corner hips")})
      +"</div>";
  }
  if(cs && cs.list.length){
    /* one sheet per distinct face stringer, exactly like the legs */
    const seen=new Set();
    for(const g of cs.list){
      if(seen.has(g.c)) continue;
      seen.add(g.c);
      const same=cs.list.filter(x=>x.c===g.c), ids=idRange(same.map(x=>x.id)), qty=same.length;
      const title=t("{0} · {1} (levels {2}–{3}) · run {4} across the corner · rise {5} · marks every {6} · board ≥ {7}",
          ids, notchCount(g.c), g.kmin, model.N, L(cs.run), L(model.r), L(cs.Ls), L(g.reqLen))
        +(g.boardLen ? t(" — cut from {0}", L(g.boardLen)) : t(" — NEEDS A SPLICE"));
      const perBoard=g.boardLen ? Math.max(1, Math.floor((g.boardLen+S.kerf)/(g.reqLen+S.kerf))) : 1;
      h+='<div class="sheet"><h4>'+t("{0} — on the board: {1} needed, {2} per board, {3} board(s)", ids, qty, Math.min(perBoard,qty), Math.ceil(qty/perBoard))+"</h4>"
        +'<div class="svgwrap">'+stringerStockSVG(g.c,model.r,cs.run,cs.drop,bw,g.boardLen,title,Math.min(perBoard,qty),g.topRun,g.topLift)+"</div>"
        +'<h4>'+t("Finished profile")+"</h4>"
        +'<div class="svgwrap">'+stringerProfileSVG(g.c,model.r,cs.run,cs.drop,bw,title,g.topRun,g.topLift)+"</div>"
        +cutScheduleHTML(model, {c:g.c, r:model.r, R:cs.run, Ls:cs.Ls, drop:cs.drop, bw,
            topRun:g.topRun, topLift:g.topLift, reqLen:g.reqLen, boardLen:g.boardLen,
            notchDepth:cs.notchDepth, throat:cs.throat, minWidth:cs.minWidth, qty,
            kmin:g.kmin, name:ids+" · "+t("corner face stringer")})
        +planCutsHTML(model, {c:g.c, r:model.r, R:cs.run, drop:cs.drop, bw,
            topRun:g.topRun, topLift:g.topLift, planDeg:45, name:ids})
        +"</div>";
    }
    return h;
  }
  const hip=hipStringer(model);
  const hipTitle=t("H · HIP stringer · run {0} (R×√2) · {1} · marks every {2} · board ≥ {3} · throat {4}",
    L(hip.run), notchCount(hip.c), L(hip.Ls), L(hip.reqLen), fmtIn(hip.throat));
  h+='<div class="sheet"><h4>'+t("H — hip on the board: 1 × {0}", S.stringerStock)+"</h4>"
    +'<div class="svgwrap">'+stringerStockSVG(hip.c,model.r,hip.run,hip.drop,bw,hip.boardLen,hipTitle,1,hip.topRun,hip.topLift)+"</div>"
    +'<h4>'+t("Finished profile")+"</h4>"
    +'<div class="svgwrap">'+stringerProfileSVG(hip.c,model.r,hip.run,hip.drop,bw,hipTitle,hip.topRun,hip.topLift)+"</div>"
    +cutScheduleHTML(model, {c:hip.c, r:model.r, R:hip.run, Ls:hip.Ls, drop:hip.drop, bw,
        topRun:hip.topRun, topLift:hip.topLift, reqLen:hip.reqLen, boardLen:hip.boardLen,
        notchDepth:hip.notchDepth, throat:hip.throat, minWidth:hip.minWidth, qty:1,
        kmin:1, name:t("H · hip stringer"), hip:true})
    +planCutsHTML(model, {c:hip.c, r:model.r, R:hip.run, drop:hip.drop, bw,
        topRun:hip.topRun, topLift:hip.topLift, planDeg:45, name:t("H · hip stringer")})
    +"</div>";
  return h;
}
/* ---------- 19. panel renderers ------------------------------------------ */
function fitLabel(fit){
  return fit.recommend==="exact" ? t("exact fit") : fit.recommend==="altgap" ? t("gap adjusted")
       : fit.recommend==="rip" ? t("1 rip") : t("overshoot");
}
function fitSummaryHTML(label, fit){
  let s = '<div class="msg '+(fit.exact?"i":"w")+'"><b>'+label+':</b> ';
  if(fit.exact) s += t("{0} board(s), exact fit — no cutting needed.", fit.n);
  else if(fit.recommend==="altgap") s += t("{0} boards, gap adjusted to {1} (no rip).", fit.n, fmtIn(fit.altGap));
  else if(fit.recommend==="rip") s += t("{0} full board(s) + 1 rip at {1}.", fit.n, fmtIn(Math.max(fit.rip,0)));
  else {
    s += t("{0} full boards, overshoots by {1} — absorb into the nosing/tread depth.", fit.overshootN, fmtIn(fit.overshoot));
    if(fit.altGapTight!=null) s += " "+t("Or {0} boards with the gap tightened to {1}{2} for an exact fit with no rip.",
      fit.overshootN, fmtIn(fit.altGapTight), fit.altGapTight<0.01 ? t(" (butted tight — no drainage gap)") : "");
  }
  s += ' <span class="pill">'+t("alt: gap={0}, tight gap={1}, rip={2}, overshoot={3}",
      fit.altGap!=null?fmtIn(fit.altGap):t("n/a"),
      fit.altGapTight!=null?fmtIn(fit.altGapTight):t("n/a"),
      fmtIn(Math.max(fit.rip,0)), fmtIn(fit.overshoot))+'</span></div>';
  return s;
}
/* Describes the ACTUAL tread layout (nosing-anchored), then the alternatives. */
function treadLayoutHTML(model, fit){
  const lay = treadBoardWidths(model);
  let msg;
  if(lay.exact)
    msg = t("{0} full boards — the first flush with the nosing, the last flush with the back. No cutting.", lay.nFull);
  else if(lay.backRip)
    msg = t("{0} full boards starting at the nosing, plus one ripped to {1} at the BACK, where the riser board covers it.", lay.nFull, fmtIn(lay.backRip));
  else
    msg = t("{0} full boards starting at the nosing; the extra {1} falls in the gap at the back, out of sight.", lay.nFull, fmtIn(lay.slack));
  return '<div class="msg '+(lay.exact?"i":"w")+'"><b>'+t("Tread board depth ({0})", LD(model.Tb))+':</b> '+msg
    +' <span class="pill">'+t("board 1 = the nosing board")+'</span>'
    +' <span class="pill">'+t("alt: tight gap={0}, one-piece rip={1}", (fit.altGapTight!=null?fmtIn(fit.altGapTight):t("n/a")), fmtIn(Math.max(fit.rip,0)))+'</span></div>';

function renderSummaryPanel(model){

function renderCompareTable(model){
  const totals = compareCornerStyles(model);
  const packed = {};
  for(const style of ["miter","through"]){
    const pieces = [];
    for(const lvl of model.levels) for(const legName of ["front","side"]){
      const tb = treadLegBoards(legName, lvl.k, model, style);
      for(const b of tb.boards) pieces.push({role:"t", stock:S.treadStock, len:b.long, qty:1});
    }
    const bins = binPack(pieces);
    let waste=0, bought=0;
    for(const stockName in bins) for(const bin of bins[stockName]){ waste+=bin.waste; bought+=bin.stockLen; }
    packed[style] = bought ? (waste/bought*100) : 0;
  }
  let h = '<table><thead><tr><th>'+t("Style")+'</th><th>'+t("Boards")+'</th><th>'+t("Total length")+'</th><th>'+t("Waste %")+'</th></tr></thead><tbody>';
  for(const style of ["miter","through"]) h += "<tr><td>"+t(style==="miter"?"45° mitered":"One leg runs through")+"</td><td>"+totals[style].count+"</td><td>"+L(totals[style].total)+"</td><td>"+dec(packed[style].toFixed(1))+"%</td></tr>";
  h += "</tbody></table>";
  return h;
}

function renderCutlistPanel(model){
  const pieces = collectPieces(model);
  const bins = binPack(pieces);
  const prices = parsePrices();
  /* Priced per (stock, LENGTH) — a 16' board is not four 4' boards, and the
     long lengths carry a premium per foot. The basis of each row is shown so an
     estimated price never passes for a quoted one. */
  const BASIS = {
    exact:  ()=>'<span class="pill ok">'+t("your price")+"</span>",
    perFt:  p=>'<span class="pill">'+t("{0}/ft", "$"+p.rate.toFixed(2))+"</span>",
    flat:   ()=>'<span class="pill">'+t("flat, any length")+"</span>",
    scaled: p=>'<span class="pill rip">'+t("estimated from your {0} price", L(p.from))+"</span>",
    none:   ()=>'<span class="pill rip">'+t("no price given")+"</span>"
  };
  let h = "<h3>"+t("Boards to buy")+"</h3><table><thead><tr><th>"+t("Stock")+"</th><th>"+t("Length")+"</th><th>"+t("Qty")
    +"</th><th>"+t("Each")+"</th><th>"+t("Cost")+"</th><th>"+t("Price basis")+"</th></tr></thead><tbody>";
  let grandCost = 0, haveCost = false, anyMissing = false, anyScaled = false;
  for(const stockName in bins){
    const byLen = {};
    for(const bin of bins[stockName]) byLen[bin.stockLen] = (byLen[bin.stockLen]||0)+1;
    for(const len in byLen){
      const qty = byLen[len], boardLen = parseFloat(len);
      const p = priceBoard(prices, stockName, boardLen), cost = p.cost*qty;
      if(p.basis!=="none") haveCost = true;
      if(p.basis==="none") anyMissing = true;
      if(p.basis==="scaled") anyScaled = true;
      grandCost += cost;
      h += "<tr><td>"+stockName+"</td><td>"+L(boardLen)+"</td><td>"+qty+"</td>"
        +"<td>"+(p.basis==="none"?"—":"$"+dec(p.cost.toFixed(2)))+"</td>"
        +"<td>"+(p.basis==="none"?"—":"$"+dec(cost.toFixed(2)))+"</td>"
        +'<td class="tl">'+BASIS[p.basis](p)+"</td></tr>";
    }
  }
  h += "</tbody></table>";
  if(haveCost){
    h += '<div class="kv"><dt>'+t("Estimated material cost")+'</dt><dd>'+dec(grandCost.toFixed(2))+' $'
      +(anyMissing?' <span class="pill rip">'+t("some lengths unpriced")+"</span>":"")+'</dd></div>';
    if(anyScaled) h += '<div class="msg w">'+t("Some rows are scaled from a price you gave for a different length. Lumber is rarely linear — the long lengths cost more per foot — so add the real length with {0} for the ones that matter.", '<code>2x6@144:18.75</code>')+'</div>';
  }
  if(anyMissing) h += '<div class="note">'+t('Price the lengths you actually buy: {0} for one length, {1} by the foot, or a bare {2} for one flat price whatever the length.',
      '<code>2x6@96:12.50</code>', '<code>2x12:2.10/ft</code>', '<code>5/4x6 PT:11.25</code>')+'</div>';
  h += "<h3>"+t("Cut list per board")+"</h3>";
  for(const stockName in bins){
    h += "<h4>"+stockName+"</h4><table><thead><tr><th>"+t("Board #")+"</th><th>"+t("Stock length")+"</th><th>"+t("Cuts")+"</th><th>"+t("Waste")+"</th></tr></thead><tbody>";
    bins[stockName].forEach((bin,i)=>{
      h += "<tr><td>"+(i+1)+"</td><td>"+L(bin.stockLen)+"</td><td>"+bin.cuts.map(c=>LD(c.len)+" — "+c.role).join("<br>")+"</td><td>"+fmtIn(bin.waste)+" ("+bin.wastePct.toFixed(0)+"%)"+(bin.offcutUsable?' <span class="pill ok">'+t("offcut usable")+'</span>':'')+"</td></tr>";
    });
    h += "</tbody></table>";
  }
  document.getElementById("panel-cutlist").innerHTML = h || "<p>"+t("Nothing to cut yet.")+"</p>";
}

const SB_MIN=240, SB_MAX=900, SB_DEF=340;
function clampSB(w){ return Math.max(SB_MIN, Math.min(SB_MAX, Math.round(w))); }
function applySidebar(){
  document.documentElement.style.setProperty("--sbw", clampSB(S.sidebarW||SB_DEF)+"px");
}
function initSplitter(){
  const bar=document.getElementById("split"), main=document.querySelector("main");
  if(!bar) return;
  let dragging=false;
  const widthFrom = clientX => clampSB(clientX - main.getBoundingClientRect().left - parseFloat(getComputedStyle(main).paddingLeft));
  bar.addEventListener("pointerdown", e=>{
    dragging=true; bar.classList.add("drag"); document.body.classList.add("resizing");
    bar.setPointerCapture(e.pointerId); e.preventDefault();
  });
  bar.addEventListener("pointermove", e=>{ if(!dragging) return; S.sidebarW=widthFrom(e.clientX); applySidebar(); });
  const end = e => {
    if(!dragging) return;
    dragging=false; bar.classList.remove("drag"); document.body.classList.remove("resizing");
    try{ bar.releasePointerCapture(e.pointerId); }catch(_){}
    save();                                        // only persist once the drag ends
  };
  bar.addEventListener("pointerup", end);
  bar.addEventListener("pointercancel", end);
  bar.addEventListener("dblclick", ()=>{ S.sidebarW=SB_DEF; applySidebar(); save(); });
  /* keyboard: focusable and arrow-adjustable */
  bar.tabIndex=0;
  bar.addEventListener("keydown", e=>{
    const step = e.shiftKey?40:10;
    if(e.key==="ArrowLeft"){ S.sidebarW=clampSB((S.sidebarW||SB_DEF)-step); applySidebar(); save(); e.preventDefault(); }
    if(e.key==="ArrowRight"){ S.sidebarW=clampSB((S.sidebarW||SB_DEF)+step); applySidebar(); save(); e.preventDefault(); }
  });
}

/* Switching tabs from deep inside a long sheet should land at the top of the
   new panel, not wherever the old scroll position happens to fall in it. Only
   scrolls UP — if the bar is already in view, nothing moves. */
function scrollToPanelTop(){
  const tabs=document.getElementById("tabs"), panels=document.getElementById("panels");
  if(!tabs||!panels) return;
  const hh=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--hh"))||57;
  /* Measure from #panels, not from the bar: the bar is sticky, so its own
     rect is pinned at the header and would always report "already there". */
  const y=window.scrollY+panels.getBoundingClientRect().top-tabs.offsetHeight-hh;
  if(window.scrollY>y+1) window.scrollTo({top:Math.max(0,y)});
}

/* ---------- 21. self-test (?test=1) --------------------------------------- */
function runTests(){
  const results = [];
  const backup = JSON.parse(JSON.stringify(S));
  const backupCode = JSON.parse(JSON.stringify(CODE)), backupStock = JSON.parse(JSON.stringify(STOCK));
  function assert(name, cond, extra){ results.push({name, pass:!!cond, extra: extra!=null?String(extra):""}); }
  try{
    /* Hermetic: pin EVERY input the assertions depend on, and reset the stock
       and code tables. Inheriting the user's saved project made these results
       depend on their tread stock, which is how a wrong 5.5 read as 6. */
    Object.keys(S).forEach(k=>delete S[k]);
    Object.assign(S, DEFAULTS, {
      totalRise:28, risers:4, run:11, nosing:0, platX:60, platY:48,
      treadStock:"2x6", treadGap:0.25, riserStock:"5/4x6 PT", riserFit:"captured",
      riserStyle:"closed", platSurface:"5/4x6 PT", platFrame:"2x6", platJoistDir:"y",
      includePlatform:true, method:"boxes", cornerStyle:"miter", throughLeg:"front",
      frameStock:"2x6", stringerStock:"2x12", skirtStock:"2x10", faceX0:"open",
      stockLen:"96,120,144,192", kerf:0.125, minOffcut:12, riseMode:"fixed",
      bottomBearing:"surface", deckBoardT:1.0, throatMin:5, stairConnection:"topTreadDown"
    });
    Object.assign(CODE, CODE_DEFAULT);
    STOCK = JSON.parse(JSON.stringify(STOCK_DEFAULT));
    const m1 = computeModel();
    assert("H=28,N=4 -> r=7", Math.abs(m1.r-7)<1e-9, m1.r);
    /* 60 + 3×11 + 1" captured riser + 0 nosing = 94; 48 + 33 + 1 = 82 */
    assert("footprint 94 x 82 (includes the captured riser thickness)",
      Math.abs(m1.footX-94)<1e-9 && Math.abs(m1.footY-82)<1e-9, m1.footX+" x "+m1.footY);
    /* These call the real functions. Recomputing the expected value from the
       same formula inside the test would pass even if the code were wrong. */
    const rb1 = riserBoards(m1);
    const frontLP = rb1.rows.map(x=>x.front.long), sideLP = rb1.rows.map(x=>x.side.long);
    assert("riserBoards front long points 60,71,82,93", [60,71,82,93].every((v,i)=>Math.abs(v-frontLP[i])<1e-9), frontLP.join(","));
    assert("riserBoards side long points 48,59,70,81", [48,59,70,81].every((v,i)=>Math.abs(v-sideLP[i])<1e-9), sideLP.join(","));
    assert("riser height = r - tread thickness = 5.5", Math.abs(rb1.height-5.5)<1e-9, rb1.height);
    assert("riser 1 = r - platform decking = 6 (tucks under the platform)", Math.abs(rb1.height1-6)<1e-9, rb1.height1);
    assert("riser 1 row uses the platform height, the rest use the tread height",
      Math.abs(rb1.rows[0].height-6)<1e-9 && rb1.rows.slice(1).every(x=>Math.abs(x.height-5.5)<1e-9),
      rb1.rows.map(x=>x.height).join(","));
    assert("riser short point = long - board thickness", Math.abs(rb1.rows[0].front.short-(60-sk(S.riserStock).t))<1e-9, rb1.rows[0].front.short);
    assert("N risers listed", rb1.rows.length===m1.N, rb1.rows.length);

    /* Hand-checked tread layout. Board depth is 11 run + 1 captured riser = 12.
       With 2x6 (5.5 + 1/4 gap) that is 2 full boards + a 1/2" filler, laid from
       the NOSING: board 1 at offset 6.5 (front edge on the tip), board 2 at
       0.75, and the 1/2" rip last at the back. */
    const tb1 = treadLegBoards("front", 1, m1, "miter");
    assert("level 1 front mitered long points 72 / 66.25 / 60.5, nosing first",
      tb1.boards.length===3 && Math.abs(tb1.boards[0].long-72)<1e-9
        && Math.abs(tb1.boards[1].long-66.25)<1e-9 && Math.abs(tb1.boards[2].long-60.5)<1e-9,
      tb1.boards.map(b=>b.long).join(", "));
    assert("board 1 ends at the nosing tip, Wx + board depth",
      Math.abs(tb1.boards[0].long-(m1.Wx+m1.Tb))<1e-9,
      tb1.boards[0].long+" vs "+(m1.Wx+m1.Tb));
    const tb1s = treadLegBoards("side", 1, m1, "miter");
    assert("level 1 side mitered long points 60 / 54.25 / 48.5, nosing first",
      Math.abs(tb1s.boards[0].long-60)<1e-9 && Math.abs(tb1s.boards[1].long-54.25)<1e-9
        && Math.abs(tb1s.boards[2].long-48.5)<1e-9,
      tb1s.boards.map(b=>b.long).join(", "));
    const savedThrough = S.throughLeg; S.throughLeg = "front";
    const thF = treadLegBoards("front", 1, m1, "through"), thS = treadLegBoards("side", 1, m1, "through");
    assert("through leg runs full (72), butting leg stops short (48)",
      thF.boards.every(b=>Math.abs(b.long-72)<1e-9) && thS.boards.every(b=>Math.abs(b.long-48)<1e-9),
      thF.boards[0].long+" / "+thS.boards[0].long);
    S.throughLeg = savedThrough;

    assert("sum of risers === H", Math.abs(m1.N*m1.r-m1.H)<1e-9);
    const bottomK=m1.N-1;
    assert("bottom ring outer extents", Math.abs((m1.Wx+bottomK*m1.R+m1.riserT+m1.nose)-m1.footX)<1e-9 && Math.abs((m1.Wy+bottomK*m1.R+m1.riserT+m1.nose)-m1.footY)<1e-9);

    let mArea=0, tArea=0;
    for(const lvl of m1.levels) for(const legName of ["front","side"]){
      const Wb = legName==="front"?m1.Wx:m1.Wy;
      const isThrough = S.throughLeg===legName;
      mArea += ringLegAreaMiter(Wb, lvl.k, m1.R, m1.Tb);
      tArea += ringLegAreaThrough(Wb, lvl.k, m1.R, m1.Tb, isThrough);
    }
    assert("mitered vs through-leg cover equal total area", Math.abs(mArea-tArea)<0.01, mArea.toFixed(4)+" vs "+tArea.toFixed(4));

    const fb = fitBoards(3*5.5+2*0.25, 5.5, 0.25);
    assert("fitBoards round-trips on an exact case", fb.exact && fb.n===3 && Math.abs(fb.spanN-(3*5.5+2*0.25))<1e-9);

    const pieces = collectPieces(m1);
    const bins = binPack(pieces);
    let binOk = true;
    for(const stockName in bins) for(const bin of bins[stockName]){
      const used = bin.cuts.reduce((s,c)=>s+c.len,0) + Math.max(0,bin.cuts.length-1)*S.kerf;
      if(used > bin.stockLen+1e-6) binOk=false;
    }
    assert("every bin-packed board's cuts + kerf fit within its length", binOk);

    const w=sk(S.treadStock).w, gap=S.treadGap;
    const savedR=S.run, savedNose=S.nosing, savedRS=S.riserStyle;
    /* open risers so board depth == run exactly and divides into 3 boards */
    S.riserStyle="open"; S.run = 3*w+2*gap; S.nosing = 0;
    const mPitch = computeModel();
    const bds = treadLegBoards("front", 1, mPitch, "miter").boards;
    /* Boards run nosing-first, so long points DESCEND by one pitch. */
    let pitchOk = bds.length>=2;
    for(let i=1;i<bds.length;i++) if(Math.abs((bds[i-1].long-bds[i].long)-(w+gap))>1e-6) pitchOk=false;
    assert("consecutive mitered board long-points differ by one pitch (w+gap)", pitchOk,
      bds.map(b=>b.long.toFixed(2)).join(" → "));
    S.run=savedR; S.nosing=savedNose; S.riserStyle=savedRS;

    const hip = hipStringer(computeModel());
    assert("hip run = R*sqrt(2)", Math.abs(hip.run - m1.R*Math.SQRT2)<1e-9, hip.run);

    /* Two regressions in one formula, for a stringer with no tab:
         + drop*r/Ls  — the bottom plumb face below the last notch corner, left
                        out once and the board came up ~2.95" short;
         − r²/Ls      — the top notch has no riser face, so the apex (c·R, c·r)
                        is not material and the board ends at the top SEAT.
       Including it drew a zero-width spike and bought ~3.76" too much. */
    const Ls1 = hyp(m1.r, m1.R), drop1 = m1.r - sk(S.treadStock).t;
    const st1 = stringersForLeg("front", m1);
    const s3 = st1.list.find(x=>x.c===3);
    const want3 = 3*Ls1 - m1.r*m1.r/Ls1 + drop1*m1.r/Ls1;
    assert("stringer length = c*Ls − r²/Ls + drop*r/Ls",
      !!s3 && Math.abs(s3.reqLen-want3)<1e-9,
      s3 ? s3.reqLen.toFixed(4)+" vs "+want3.toFixed(4) : "no 3-notch stringer");
    assert("it includes the bottom drop and excludes the phantom top apex",
      !!s3 && s3.reqLen > 3*Ls1 - m1.r*m1.r/Ls1 + 1e-6 && s3.reqLen < 3*Ls1 - 1e-6,
      s3 ? s3.reqLen.toFixed(4)+" vs c*Ls="+(3*Ls1).toFixed(4) : "");
    assert("hip length follows the same rule",
      Math.abs(hip.reqLen-(hip.c*hip.Ls - m1.r*m1.r/hip.Ls + hip.drop*m1.r/hip.Ls))<1e-9,
      hip.reqLen.toFixed(4)+" vs "+(hip.c*hip.Ls).toFixed(4));
    assert("stringers nearer the corner carry fewer notches",
      st1.list.length>1 && st1.list[st1.list.length-1].c < st1.list[0].c,
      st1.list.map(x=>x.c).join(","));

    /* Framing density: joists must never end up spaced wider than the tread
       material's span (a floor()+1 count silently violates this). */
    const spanLim = sk(S.treadStock).span;
    let spacingOk = true, worst = 0;
    for(const lvl of m1.levels) for(const leg of boxesForLevel(m1, lvl.k).legs){
      worst = Math.max(worst, leg.joistSpacing);
      if(leg.joistSpacing > spanLim + 1e-9) spacingOk = false;
    }
    assert("box joist spacing never exceeds the tread span", spacingOk, "worst "+worst.toFixed(2)+" / limit "+spanLim);
    const pf1 = platformModel(m1);
    const pfSpacing = (S.platJoistDir==="y"?m1.Wx:m1.Wy)/(pf1.joistCount-1);
    assert("platform joist spacing never exceeds the decking span",
      pfSpacing <= (sk(S.platSurface).span||16)+1e-9, pfSpacing.toFixed(2));

    const blks = boxSupportBlocks(m1);
    assert("support blocks only for levels 2..N-2, both legs", blks.length===2 && blks.every(b=>b.k===2),
      blks.map(b=>"k"+b.k+" "+b.legName+" ×"+b.qty).join(", "));
    assert("support block height = z_(k+1)", blks.every(b=>Math.abs(b.height-(m1.H-(b.k+1)*m1.r))<1e-9), blks[0] && blks[0].height);
    assert("skirt rake = hyp(total run, H)",
      Math.abs(skirtInfo(m1).rake - hyp(3*m1.R+m1.nose, m1.H))<1e-9, skirtInfo(m1).rake.toFixed(3));

    /* ---- bearing on the deck STRUCTURE ---------------------------------
       The whole point: the rise must not move, only the framing gets deeper. */
    const mSurf = computeModel();
    const stSurf = stringersForLeg("front", mSurf).list.find(x=>x.c===3);
    const boxSurf = boxesForLevel(mSurf, mSurf.N-1).rimH;
    const platSurf = platformModel(mSurf).height;
    S.bottomBearing="structure"; S.deckBoardT=1.0;
    const mStruct = computeModel();
    assert("structure bearing does NOT change riser height or tread heights",
      mStruct.r===mSurf.r && mStruct.H===mSurf.H &&
      mStruct.levels.every((l,i)=>l.z===mSurf.levels[i].z),
      "r "+mStruct.r+" vs "+mSurf.r);
    assert("structure bearing reports base = one decking thickness", Math.abs(mStruct.base-1)<1e-9, mStruct.base);
    const stStruct = stringersForLeg("front", mStruct).list.find(x=>x.c===3);
    assert("stringer gets longer by exactly deckT*r/Ls",
      Math.abs((stStruct.reqLen-stSurf.reqLen) - 1*mSurf.r/hyp(mSurf.r,mSurf.R))<1e-9,
      (stStruct.reqLen-stSurf.reqLen).toFixed(4));
    assert("bottom box rim deepens by the decking, others do not",
      Math.abs(boxesForLevel(mStruct,mStruct.N-1).rimH-(boxSurf+1))<1e-9 &&
      Math.abs(boxesForLevel(mStruct,1).rimH-boxSurf)<1e-9,
      boxesForLevel(mStruct,mStruct.N-1).rimH+" / "+boxesForLevel(mStruct,1).rimH);
    assert("platform frame deepens by the decking", Math.abs(platformModel(mStruct).height-(platSurf+1))<1e-9, platformModel(mStruct).height);
    assert("support blocks reach the bearing plane",
      boxSupportBlocks(mStruct).every((b,i)=>Math.abs(b.height-(boxSupportBlocks(mSurf)[i].height+1))<1e-9));
    assert("bottom frame in the section stops at -base",
      Math.abs(sectionPieces(mStruct).frames.slice(-1)[0].zBot+1)<1e-9, sectionPieces(mStruct).frames.slice(-1)[0].zBot);
    S.bottomBearing="surface";

    /* ---- platform nosing ------------------------------------------------ */
    S.nosing=1;
    const mN=computeModel(), pfN=platformModel(mN);
    assert("platform decking overhangs the riser face by the nosing on both step faces",
      Math.abs(mN.platFinX-62)<1e-9 && Math.abs(mN.platFinY-50)<1e-9, mN.platFinX+" x "+mN.platFinY);
    assert("platform decking boards get longer and fill further by riser + nosing",
      Math.abs(pfN.deckBoardLen-62)<1e-9 && Math.abs(pfN.deckFillDim-50)<1e-9,
      pfN.deckBoardLen+" / "+pfN.deckFillDim);
    assert("platform frame itself is NOT enlarged by the nosing",
      pfN.rimPieces[0].len===60, pfN.rimPieces[0].len);
    S.nosing=0;

    /* ---- stringers must come out of a real 2x12 ------------------------- */
    const st12=stringersForLeg("front", computeModel()), hip12=hipStringer(computeModel());
    assert("2x12 is 11-1/4 wide and carries the leg pitch",
      Math.abs(sk("2x12").w-11.25)<1e-9 && st12.fitsStock && st12.throat>=S.throatMin,
      "throat "+st12.throat.toFixed(3)+" min width "+st12.minWidth.toFixed(3));
    assert("hip needs a wider board than a 2x12 at 7/11 — and is flagged",
      hip12.minWidth>sk("2x12").w && !hip12.fitsStock,
      "needs "+hip12.minWidth.toFixed(3)+" vs 11.25");
    assert("stringer spacing comes from the TREAD span, not the stringer's own",
      st12.spanLimit===sk(S.treadStock).span && st12.spacing<=st12.spanLimit+1e-9,
      "limit "+st12.spanLimit+" spacing "+st12.spacing.toFixed(2));
    const sTread=S.treadStock; S.treadStock="5/4x6 PT";
    const st16=stringersForLeg("front", computeModel());
    assert("switching to 5/4x6 treads tightens stringer spacing to 16",
      st16.spanLimit===16 && st16.spacing<=16+1e-9 && st16.list.length>st12.list.length,
      "spacing "+st16.spacing.toFixed(2)+" count "+st16.list.length+" vs "+st12.list.length);
    S.treadStock=sTread;

    /* ---- nosing is measured from the riser FACE -------------------------- */
    /* With a captured riser the tread must lap the riser board, otherwise the
       riser's top edge is left exposed when the nosing is 0. */
    S.riserStyle="closed"; S.riserFit="captured"; S.riserStock="5/4x6 PT"; S.nosing=0;
    const mR0=computeModel();
    assert("captured riser: tread board laps the riser even with 0 nosing",
      Math.abs(mR0.riserT-1)<1e-9 && Math.abs(mR0.Tb-12)<1e-9 && Math.abs(mR0.Twalk-11)<1e-9,
      "riserT "+mR0.riserT+" Tb "+mR0.Tb+" Twalk "+mR0.Twalk);
    S.nosing=1;
    const mR1=computeModel();
    assert("1\" nosing sits BEYOND the riser face, not inside it",
      Math.abs(mR1.Tb-13)<1e-9 && Math.abs(mR1.Twalk-12)<1e-9, "Tb "+mR1.Tb+" Twalk "+mR1.Twalk);
    assert("the tread's front edge clears the riser face by exactly the nosing",
      Math.abs((mR1.Tb-(mR1.R+mR1.riserT))-mR1.nose)<1e-9);
    assert("footprint and platform grow by the riser thickness too",
      Math.abs(mR1.footY-(mR1.Wy+3*mR1.R+mR1.riserT+mR1.nose))<1e-9 &&
      Math.abs(mR1.platFinY-(mR1.Wy+mR1.riserT+mR1.nose))<1e-9,
      mR1.footY+" / "+mR1.platFinY);
    const bdsR=treadLegBoards("front",1,mR1,"miter").boards;
    const coveredR=bdsR.reduce((s,b)=>s+b.w,0)+(bdsR.length-1)*S.treadGap;
    assert("the tread boards actually cover the full board depth",
      coveredR >= mR1.Tb-0.0626, coveredR.toFixed(3)+" covering "+mR1.Tb);
    S.riserStyle="open";
    const mOpen=computeModel();
    assert("open risers: no riser thickness added, depth is back to R + nosing",
      mOpen.riserT===0 && Math.abs(mOpen.Tb-(mOpen.R+mOpen.nose))<1e-9, mOpen.Tb);
    S.riserStyle="closed"; S.riserFit="captured"; S.nosing=0;

    /* ---- run is nosing to nosing ---------------------------------------- */
    S.nosing=1;
    const mNN=computeModel();
    const tipOf = k => (mNN.Wy+(k-1)*mNN.R) + mNN.Tb;      // nosing tip of level k
    assert("nosing tip to nosing tip equals the run, on every step",
      mNN.levels.slice(1).every(l=>Math.abs((tipOf(l.k)-tipOf(l.k-1))-mNN.R)<1e-9),
      mNN.levels.map(l=>tipOf(l.k).toFixed(2)).join(" → "));
    assert("platform nosing tip to the first tread's nosing tip is also one run",
      Math.abs((tipOf(1)-mNN.platFinY)-mNN.R)<1e-9, tipOf(1)+" vs "+mNN.platFinY);

    /* ---- tread boards start at the nosing -------------------------------- */
    const offs=treadBoardOffsets(mNN), w0=sk(S.treadStock).w;
    assert("board 1's front edge IS the nosing tip",
      Math.abs((offs[0].o+offs[0].w)-mNN.Tb)<1e-9, (offs[0].o+offs[0].w)+" vs "+mNN.Tb);
    assert("board 1 is a full board, never the ripped one",
      Math.abs(offs[0].w-w0)<1e-9, offs[0].w);
    assert("any ripped piece is the LAST one, at the back",
      offs.length<2 || offs.slice(0,-1).every(b=>Math.abs(b.w-w0)<1e-9), offs.map(b=>b.w).join(", "));
    assert("offsets march backwards from the nosing",
      offs.every((b,i)=>i===0 || b.o < offs[i-1].o), offs.map(b=>b.o.toFixed(2)).join(", "));
    assert("boards never run past the tread's back edge",
      offs[offs.length-1].o > -1e-9, offs[offs.length-1].o);
    const bdsNN=treadLegBoards("front",1,mNN,"miter").boards;
    assert("the section view and the cut list use the same nosing-anchored layout",
      Math.abs(sectionPieces(mNN).treads[0].bds[0].u-(mNN.Wy+bdsNN[0].o))<1e-9);

    /* ---- floating platform out of the frame stock ------------------------ */
    S.includePlatform=true; S.platFrame="2x8";
    const pfF=platformModel(computeModel());
    assert("floating platform frame depth is the frame stock on edge",
      Math.abs(pfF.frameDepth-sk("2x8").w)<1e-9, pfF.frameDepth);
    assert("legs make up exactly the rest of the height",
      Math.abs(pfF.frameDepth+pfF.legH-pfF.height)<1e-9, pfF.legH);
    assert("legs are counted on a grid no wider than the frame stock's span",
      pfF.legCount===pfF.legCols*pfF.legRows &&
      computeModel().Wx/(pfF.legCols-1)<=pfF.legSpan+1e-9 &&
      computeModel().Wy/(pfF.legRows-1)<=pfF.legSpan+1e-9,
      pfF.legCols+"×"+pfF.legRows+" @"+pfF.legSpan);
    assert("legs appear in the cut list, cut from the LEG stock",
      collectPieces(computeModel()).some(p=>p.stock===pfF.legName && Math.abs(p.len-pfF.legH)<1e-9 && p.qty===pfF.legCount),
      pfF.legName+" × "+pfF.legCount);
    S.platFrame="2x6"; S.nosing=0;

    /* ---- stair connection type: ledger or bearing ------------------------ */
    {
      const savedM=S.method, savedC=S.stairConnection;
      S.method="stringers";
      const cm=computeModel(), Ls=hyp(cm.r,cm.R);
      S.stairConnection="topTreadDown";
      const a=connectionInfo(cm), lenA=stringersForLeg("front",cm).list[0].reqLen;
      S.stairConnection="flushHalf";
      const b=connectionInfo(cm), lenB=stringersForLeg("front",cm).list[0].reqLen;
      S.stairConnection="flushFull";
      const c2=connectionInfo(cm), lenC=stringersForLeg("front",cm).list[0].reqLen;
      assert("top-tread-down hangs on the face and needs a ledger",
        a.tab===0 && a.needsLedger && !a.bears);
      assert("flush connections bear on the frame and need no ledger",
        b.bears && !b.needsLedger && c2.bears && !c2.needsLedger,
        "half "+fmtIn(b.bearing)+", full "+fmtIn(c2.bearing));
      assert("half tread bears half a run, full tread bears a full run",
        Math.abs(b.bearing-cm.R/2)<1e-9 && Math.abs(c2.bearing-cm.R)<1e-9,
        b.bearing+" / "+c2.bearing);
      /* The tab is a LEVEL cut, so it projects tab*R/Ls on the slope — NOT
         tab*Ls/R, which is what carrying the sloped nosing line back would
         give, and which is longer, so the old formula bought too much board.
         A tab also gives the top notch a real riser face, worth another r²/Ls
         over the tabless board, whose top corner is the top seat. */
      const grow = tab => tab*cm.R/Ls + cm.r*cm.r/Ls;
      assert("a flush tab adds tab*R/Ls (the level cut) + r²/Ls (the top riser)",
        Math.abs((lenB-lenA)-grow(cm.R/2))<1e-6 && Math.abs((lenC-lenA)-grow(cm.R))<1e-6,
        (lenB-lenA).toFixed(3)+" / "+(lenC-lenA).toFixed(3));
      assert("connectionInfo reports that same growth",
        Math.abs(b.extraLen-grow(cm.R/2))<1e-6 && Math.abs(c2.extraLen-grow(cm.R))<1e-6 && a.extraLen===0,
        b.extraLen.toFixed(3)+" / "+c2.extraLen.toFixed(3));
      assert("the level cut is shorter than the sloped one it replaced",
        (lenC-lenA) < cm.R*Ls/cm.R + cm.r*cm.r/Ls - 1e-6);
      assert("connection type does NOT change the stair geometry",
        (()=>{ S.stairConnection="topTreadDown"; const m1=computeModel();
               S.stairConnection="flushFull";    const m2=computeModel();
               return m1.r===m2.r && m1.footX===m2.footX && m1.footY===m2.footY
                 && m1.levels.every((l,i)=>l.z===m2.levels[i].z); })());
      assert("only the stringers reaching the platform get the tab",
        stringersForLeg("front",computeModel()).list.every(x=>(x.kmin===1)===(x.topRun>0)),
        stringersForLeg("front",computeModel()).list.map(x=>"k"+x.kmin+":"+x.topRun.toFixed(1)).join(" "));

      /* THE TOP RISER MUST BE PLUMB. Carrying the sloped nosing line back into
         the tab tilted it, which cannot be built — walk the actual outline. */
      for(const kind of ["flushHalf","flushFull"]){
        S.stairConnection=kind;
        const m3=computeModel(), cn=connectionInfo(m3), bw3=sk(S.stringerStock).w;
        const st3=stringersForLeg("front",m3), g3=st3.list.find(x=>x.topRun>0);
        const lay=stringerBoardLayout(g3.c,m3.r,m3.R,st3.drop,bw3,g3.topRun,g3.topLift);
        const o=lay.outline, xTop=g3.c*m3.R;
        const iTop=o.findIndex(p=>Math.abs(p[0]-xTop)<1e-9 && Math.abs(p[1]-g3.c*m3.r)<1e-9);
        assert(kind+": the last riser face is plumb — same x, one full rise",
          iTop>0 && Math.abs(o[iTop-1][0]-xTop)<1e-9 && Math.abs(o[iTop][1]-o[iTop-1][1]-m3.r)<1e-9,
          iTop>0 ? JSON.stringify(o[iTop-1])+" → "+JSON.stringify(o[iTop]) : "top corner not on the outline");
        /* the far end of the tab — first vertex past the platform face */
        const iEnd=o.findIndex((p,i)=>i>iTop && p[0]>xTop+1e-9);
        assert(kind+": the tab leaves that corner LEVEL, not up the slope",
          iEnd>iTop && Math.abs(o[iEnd][1]-o[iEnd-1][1])<1e-9 &&
          Math.abs(o[iEnd][1]-(o[iTop][1]-cn.lift))<1e-9,
          iEnd>iTop ? JSON.stringify(o[iEnd-1])+" → "+JSON.stringify(o[iEnd]) : "no tab on the outline");
        assert(kind+": no part of the board sits above the nosing line",
          o.every(p=>p[1] <= p[0]*m3.r/m3.R + 1e-9),
          o.filter(p=>p[1] > p[0]*m3.r/m3.R + 1e-9).map(p=>JSON.stringify(p)).join(" "));
        assert(kind+": the tab is exactly the advertised bearing, measured off the outline",
          Math.abs((o[iEnd][0]-xTop)-cn.bearing)<1e-9, (o[iEnd][0]-xTop)+" vs "+cn.bearing);
        /* and the elevation has to agree with the sheet */
        const eSvg=renderElevationSVG(m3);
        assert(kind+": the elevation renders with the level tab", /<svg/.test(eSvg) && !/NaN/.test(eSvg));
      }
      /* NO TAB -> NO TOP RISER FACE. The topmost triangle's vertical leg is the
         plumb cut, so the apex is a zero-width spike, not material. Leaving it
         on the outline is what drew the stray thin vertical line. */
      S.stairConnection="topTreadDown";
      {
        const m4=computeModel(), st4=stringersForLeg("front",m4), c4=st4.list[0].c;
        const bw4=sk(S.stringerStock).w;
        const lay4=stringerBoardLayout(c4,m4.r,m4.R,st4.drop,bw4,0,0);
        const o4=lay4.outline, xTop=c4*m4.R;
        assert("top tread down: nothing extends past the platform face",
          o4.every(p=>p[0] <= xTop + 1e-9),
          Math.max(...o4.map(p=>p[0]))+" vs "+xTop);
        assert("top tread down: the phantom apex is NOT on the outline",
          !o4.some(p=>Math.abs(p[0]-xTop)<1e-9 && Math.abs(p[1]-c4*m4.r)<1e-9),
          JSON.stringify(o4));
        assert("the board's top corner is the top seat's back corner",
          Math.abs(Math.max(...o4.map(p=>p[1])) - (c4-1)*m4.r)<1e-9,
          Math.max(...o4.map(p=>p[1]))+" vs "+((c4-1)*m4.r));
        /* no two consecutive edges may double back along the same line */
        let spike=null;
        for(let i=0;i<o4.length;i++){
          const a=o4[i], b=o4[(i+1)%o4.length], c5=o4[(i+2)%o4.length];
          const d1=[b[0]-a[0],b[1]-a[1]], d2=[c5[0]-b[0],c5[1]-b[1]];
          const cross=d1[0]*d2[1]-d1[1]*d2[0], dot=d1[0]*d2[0]+d1[1]*d2[1];
          if(Math.abs(cross)<1e-9 && dot<-1e-9) spike=JSON.stringify([a,b,c5]);
        }
        assert("the outline never doubles back on itself (no zero-width spike)", !spike, spike||"");
        assert("the top plumb cut is one rise shorter than the board is deep on the plumb",
          Math.abs(lay4.topPlumb-(bw4*hyp(m4.r,m4.R)/m4.R - m4.r))<1e-9, lay4.topPlumb);
      }
      S.method=savedM; S.stairConnection=savedC;
    }

    /* ---- no stringer outline may cross itself ---------------------------- */
    {
      const savedM=S.method, savedC=S.stairConnection, savedN=S.risers, savedSt=S.stringerStock;
      S.method="stringers";
      const seg=(p,q,a,b)=>{                       // proper segment intersection
        const d=(u,v,w)=>Math.sign((v[0]-u[0])*(w[1]-u[1])-(v[1]-u[1])*(w[0]-u[0]));
        const d1=d(p,q,a), d2=d(p,q,b), d3=d(a,b,p), d4=d(a,b,q);
        return d1*d2<0 && d3*d4<0;
      };
      let bad=null, checked=0, through=0;
      for(const conn of ["topTreadDown","flushHalf","flushFull"])
      for(const N of [2,3,4,6,9]) for(const stock of ["2x10","2x12"]){
        S.stairConnection=conn; S.risers=N; S.stringerStock=stock;
        const m6=computeModel(), bw6=sk(stock).w;
        const all=[["front",stringersForLeg("front",m6)],["side",stringersForLeg("side",m6)]];
        const cases=[];
        for(const [ln,st6] of all) for(const g of st6.list)
          cases.push([g.c,m6.r,m6.R,st6.drop,bw6,g.topRun,g.topLift,ln+g.id]);
        const hp=hipStringer(m6);
        cases.push([hp.c,m6.r,hp.run,hp.drop,bw6,hp.topRun,hp.topLift,"hip"]);
        for(const cse of cases){
          const la=stringerBoardLayout(...cse.slice(0,7));
          if(la.cutsThrough){ through++; continue; }   // refused, not drawn
          const o=la.outline;
          checked++;
          for(let i=0;i<o.length && !bad;i++) for(let j=i+2;j<o.length;j++){
            if(i===0 && j===o.length-1) continue;      // adjacent through the close
            if(seg(o[i],o[(i+1)%o.length],o[j],o[(j+1)%o.length]))
              bad=conn+"/N"+N+"/"+stock+"/"+cse[7]+" "+JSON.stringify([o[i],o[j]]);
          }
        }
      }
      assert("no stringer outline crosses itself, at any depth of board", !bad,
        bad || checked+" outlines checked, "+through+" refused as un-cuttable");
      /* the refused ones must SAY so, not silently draw nothing */
      S.stairConnection="topTreadDown"; S.risers=2; S.stringerStock="2x10";
      {
        const m7=computeModel(), hp7=hipStringer(m7);
        const prof=stringerProfileSVG(hp7.c,m7.r,hp7.run,hp7.drop,sk("2x10").w,"t",hp7.topRun,hp7.topLift);
        assert("a notch deeper than the board is refused with a reason, not drawn",
          through>0 && !/<svg/.test(prof) && /msg e/.test(prof), prof.slice(0,90));
      }
      S.method=savedM; S.stairConnection=savedC; S.risers=savedN; S.stringerStock=savedSt;
    }

    /* ---- every stringer is identifiable ---------------------------------- */
    {
      const savedM=S.method; S.method="stringers";
      const mi=computeModel();
      const fl=stringersForLeg("front",mi).list, sl=stringersForLeg("side",mi).list;
      assert("front stringers are F1..Fn, side stringers S1..Sn, numbered outward",
        fl.every((x,i)=>x.id==="F"+(i+1)) && sl.every((x,i)=>x.id==="S"+(i+1)),
        fl.map(x=>x.id).join(",")+" / "+sl.map(x=>x.id).join(","));
      assert("ids are unique across the job",
        new Set([...fl,...sl].map(x=>x.id)).size === fl.length+sl.length);
      const planSVG=renderPlanSVG(mi,"miter");
      assert("every id is tagged on the plan view, plus H for the hip",
        [...fl,...sl].every(x=>planSVG.includes(">"+x.id+"</text>")) && planSVG.includes(">H</text>"),
        [...fl,...sl].map(x=>x.id).filter(id=>!planSVG.includes(">"+id+"</text>")).join(",")||"all present");
      const cuts=collectPieces(mi).filter(p=>p.stock===S.stringerStock).map(p=>p.role);
      assert("the cut list names every stringer by the same id",
        [...fl,...sl].every(x=>cuts.some(rr=>rr.indexOf(x.id+" —")===0)) && cuts.some(rr=>rr.indexOf("H —")===0),
        cuts.join(" | "));
      /* Sheets collapse a run of identical boards to "F1–F5", so expand any
         range before checking that no stringer is missing a sheet. */
      const sheets=renderStringerSheets(mi);
      const covered=new Set(sheets.match(/\b[FS]\d+\b/g)||[]);
      for(const m8 of sheets.matchAll(/\b([FS])(\d+)–[FS](\d+)\b/g))
        for(let v=+m8[2]; v<=+m8[3]; v++) covered.add(m8[1]+v);
      assert("every id appears on a sheet, directly or inside a range",
        [...fl,...sl].every(x=>covered.has(x.id)),
        [...fl,...sl].map(x=>x.id).filter(id=>!covered.has(id)).join(",")||"all covered");
      assert("idRange collapses a clean run and leaves anything else alone",
        idRange(["F1","F2","F3","F4"])==="F1–F4" && idRange(["S1","S2"])==="S1, S2" &&
        idRange(["F1","F2","F4"])==="F1, F2, F4" && idRange(["F1","S2","S3"])==="F1, S2, S3",
        idRange(["F1","F2","F3","F4"])+" / "+idRange(["F1","F2","F4"]));
      S.method=savedM;
    }

    /* ---- the cut schedule has to match the board layout, not restate it --- */
    {
      const savedM=S.method, savedC=S.stairConnection;
      S.method="stringers"; S.stairConnection="flushHalf";
      const m5=computeModel(), st5=stringersForLeg("front",m5), bw5=sk(S.stringerStock).w;
      const g5=st5.list[0];
      const lay5=stringerBoardLayout(g5.c,m5.r,m5.R,st5.drop,bw5,g5.topRun,g5.topLift);
      assert("the board layout reproduces the required length exactly",
        Math.abs(lay5.req-g5.reqLen)<1e-9, lay5.req+" vs "+g5.reqLen);
      assert("the notch triangle's legs are the rise and the run",
        Math.abs(hyp(lay5.notchDepth, lay5.setback)-m5.r)<1e-9 &&
        Math.abs(hyp(lay5.notchDepth, lay5.Ls-lay5.setback)-m5.R)<1e-9,
        lay5.notchDepth+" / "+lay5.setback);
      assert("marks on the top edge are exactly one diagonal apart",
        Math.abs(lay5.Ls-hyp(m5.r,m5.R))<1e-9);
      assert("the first mark clears the bottom level cut",
        lay5.startOff > 0 && lay5.board.every(p=>p[0] >= -1e-9),
        lay5.startOff);
      assert("the cut schedule renders for every stringer including the hip",
        (()=>{ const html=renderStringerSheets(m5);
               return /Cut schedule|Tableau de coupe/.test(html) && !/NaN|undefined/.test(html); })());
      S.method=savedM; S.stairConnection=savedC;
    }

    /* ---- inputs must survive a reload ------------------------------------ */
    {
      const key="stairs-calc-selftest";
      let storageWorks=false;
      try{ localStorage.setItem(key,"1"); storageWorks=localStorage.getItem(key)==="1"; localStorage.removeItem(key); }catch(e){}
      assert("localStorage is available for autosave", storageWorks);
      /* round-trip the real save/load path without disturbing the saved project */
      const keep=localStorage.getItem("stairs-calc-v1");
      const before={run:S.run, method:S.method, platX:S.platX, lang:S.lang};
      S.run=13.375; S.method="stringers"; S.platX=71.5;
      const wrote=save();
      const raw=JSON.parse(localStorage.getItem("stairs-calc-v1")||"{}");
      assert("save() writes every edited field and reports success",
        wrote===true && raw.S && raw.S.run===13.375 && raw.S.method==="stringers" && raw.S.platX===71.5,
        raw.S ? raw.S.run+"/"+raw.S.method+"/"+raw.S.platX : "nothing written");
      /* wipe state, then load() must bring it all back */
      S.run=1; S.method="boxes"; S.platX=1;
      load();
      assert("load() restores the saved values on reopen",
        S.run===13.375 && S.method==="stringers" && S.platX===71.5,
        S.run+"/"+S.method+"/"+S.platX);
      assert("save() also persists the stock and code tables",
        raw.STOCK && raw.CODE && raw.STOCK["2x12"] && raw.CODE.riserMax>0);
      assert("the payload is versioned, so a future rename can migrate it",
        raw.v===SAVE_VER, raw.v);

      /* THE BUG: a visit that did not restore anything used to write its
         DEFAULTS over a good design on the way out — one bad load and the
         design was gone. flushSave must refuse that. */
      const keepBak=localStorage.getItem(SAVE_BAK);
      const good=JSON.stringify({v:SAVE_VER, S:Object.assign({},DEFAULTS,{run:12.75,risers:7,project:"KEEPME"}), CODE, STOCK});
      localStorage.setItem(SAVE_KEY, good);
      const wasRestored=SAVE_STATE.restored, wasDirty=SAVE_STATE.dirty;
      SAVE_STATE.restored=false; SAVE_STATE.dirty=false;
      Object.assign(S, DEFAULTS);                       // a page sitting on the defaults
      flushSave();
      assert("an unloaded, untouched page never overwrites a saved design",
        localStorage.getItem(SAVE_KEY)===good,
        JSON.parse(localStorage.getItem(SAVE_KEY)).S.project);
      /* but a page the user actually edited must still write */
      SAVE_STATE.dirty=true; S.project="EDITED";
      flushSave();
      assert("a page the user edited does write on the way out",
        JSON.parse(localStorage.getItem(SAVE_KEY)).S.project==="EDITED",
        JSON.parse(localStorage.getItem(SAVE_KEY)).S.project);
      /* and the design it replaced is one click away */
      assert("the replaced design is kept as an undo step",
        hasBackup() && JSON.parse(localStorage.getItem(SAVE_BAK)).S.project==="KEEPME",
        localStorage.getItem(SAVE_BAK)? JSON.parse(localStorage.getItem(SAVE_BAK)).S.project : "no backup");
      assert("Restore previous puts it back, and becomes its own undo",
        restorePrevious() && S.project==="KEEPME" && S.risers===7 &&
        JSON.parse(localStorage.getItem(SAVE_BAK)).S.project==="EDITED",
        S.project+"/"+S.risers);
      /* a stock library saved before an item existed must not lose that item */
      const thin=JSON.parse(JSON.stringify(STOCK_DEFAULT)); delete thin["4x4"];
      localStorage.setItem(SAVE_KEY, JSON.stringify({v:SAVE_VER, S, CODE, STOCK:thin}));
      load();
      assert("an older saved stock library is merged over the defaults, not swapped in",
        !!STOCK["4x4"] && stockNames().length===Object.keys(STOCK_DEFAULT).length,
        stockNames().join(","));

      SAVE_STATE.restored=wasRestored; SAVE_STATE.dirty=wasDirty;
      Object.assign(S, before);
      STOCK = JSON.parse(JSON.stringify(STOCK_DEFAULT));
      if(keep!==null) localStorage.setItem(SAVE_KEY, keep); else localStorage.removeItem(SAVE_KEY);
      if(keepBak!==null) localStorage.setItem(SAVE_BAK, keepBak); else localStorage.removeItem(SAVE_BAK);
    }

    /* ---- level tags must not be painted over -----------------------------
       They used to be drawn inside the level loop, so the NEXT ring's tread
       boards covered them — the nosing overhangs into the next ring. */
    {
      const savedM=S.method;
      let hidden=0, seen=0;
      for(const meth of ["boxes","stringers"]){
        S.method=meth;
        const lm=computeModel();
        for(const svg of [renderPlanSVG(lm), renderElevationSVG(lm)]){
          const dd=new DOMParser().parseFromString(svg,"image/svg+xml");
          const kids=[...dd.documentElement.children];
          kids.forEach((node,idx)=>{
            /* level tags (L1/N1…) and stringer ids (F1, S2, H) — both live on
               the deferred top layer and both must survive it */
            if(node.tagName!=="text" || !/^(L|N)\d|^[FS]\d+$|^H$/.test(node.textContent)) return;
            seen++;
            const x=+node.getAttribute("x"), y=+node.getAttribute("y");
            const an=node.getAttribute("text-anchor")||"start";
            const fs=parseFloat(node.getAttribute("font-size"));
            const w=node.textContent.length*fs*0.55;
            const cx=an==="end"?x-w/2:x+w/2, cy=y-fs*0.3;
            for(let j=idx+1;j<kids.length;j++){
              const e=kids[j];
              if(e.tagName==="rect"){
                const rx=+e.getAttribute("x"),ry=+e.getAttribute("y"),rw=+e.getAttribute("width"),rh=+e.getAttribute("height");
                if(cx>=rx&&cx<=rx+rw&&cy>=ry&&cy<=ry+rh){ hidden++; break; }
              } else if(e.tagName==="polygon"){
                const pts=(e.getAttribute("points")||"").split(" ").filter(Boolean).map(z=>z.split(",").map(Number));
                let inside=false;
                for(let a1=0,b1=pts.length-1;a1<pts.length;b1=a1++){
                  const [xi,yi]=pts[a1],[xj,yj]=pts[b1];
                  if(((yi>cy)!==(yj>cy)) && (cx<(xj-xi)*(cy-yi)/(yj-yi)+xi)) inside=!inside;
                }
                if(inside){ hidden++; break; }
              }
            }
          });
        }
      }
      assert("every level tag and stringer id is drawn on top, none painted over",
        hidden===0 && seen>0, hidden+" hidden of "+seen);
      S.method=savedM;
    }

    /* ---- tapered corner -------------------------------------------------
       The whole thing is one parameter, dc. Square is dc = 0, and every
       formula is written once, so the first thing to prove is that turning the
       taper OFF reproduces the square corner exactly. */
    {
      const savedSh=S.cornerShape, savedTm=S.taperMode, savedTg=S.taperGrow, savedM=S.method, savedCs=S.cornerStyle;
      S.cornerShape="square"; S.cornerStyle="miter";
      const mSq=computeModel();
      assert("square corner: no clip, 45° joint, no diagonal face",
        !mSq.taper.on && mSq.clip(3)===0 && mSq.taper.m===1 && Math.abs(mSq.taper.sawDeg-45)<1e-9,
        JSON.stringify({m:mSq.taper.m, saw:mSq.taper.sawDeg}));
      const sqF=treadLegBoards("front",2,mSq,"miter").boards;
      assert("square corner tread boards are the old x = Wx + (y − Wy) miter",
        sqF.every(b=>Math.abs(b.long-(mSq.Wx+mSq.R+b.o+b.w))<1e-9 && Math.abs(b.short-(mSq.Wx+mSq.R+b.o))<1e-9),
        sqF.map(b=>b.long.toFixed(2)).join(","));
      assert("square corner has no diagonal boards and keeps its hip",
        treadDiagBoards(2,mSq)===null && cornerStringers(mSq)===null && boxesForLevel(mSq,2).diag===null);

      S.cornerShape="taper"; S.taperMode="match";
      const m1=computeModel(), tp=m1.taper;
      /* the defining property the user asked for */
      assert("matching the legs' going makes the corner exactly as deep as the legs",
        Math.abs(tp.g-m1.R)<1e-9, tp.g+" vs "+m1.R);
      assert("that fixes the clip growth at R(2−√2)",
        Math.abs(tp.dc-m1.R*(2-Math.SQRT2))<1e-9, tp.dc);
      assert("and puts the joint on the bisector of the 135° corner — a 22.5° cut",
        Math.abs(tp.sawDeg-22.5)<1e-6, tp.sawDeg);
      assert("the going formula holds for any clip growth: g = (2R − dc)/√2",
        Math.abs(tp.g-(2*m1.R-tp.dc)/Math.SQRT2)<1e-9);
      /* platform stays square — the clip is zero at k=0, which IS the platform */
      assert("the platform keeps its 90° corner whatever the taper",
        m1.clip(0)===0 && riserBoards(m1).rows[0].diag===null &&
        Math.abs(riserBoards(m1).rows[0].front.long-m1.Wx)<1e-9,
        m1.clip(0)+" / "+riserBoards(m1).rows[0].front.long);
      /* the corner face grows by exactly one clip step each level */
      const faces=m1.levels.map(l=>m1.clip(l.k)*Math.SQRT2);
      assert("the corner face widens by the same amount every step",
        faces.every((f,i)=>i===0 || Math.abs((f-faces[i-1])-tp.dc*Math.SQRT2)<1e-9),
        faces.map(f=>f.toFixed(2)).join(" → "));
      assert("the top step's face is one clip wide, so the taper starts from a point",
        Math.abs(faces[0]-tp.dc*Math.SQRT2)<1e-9, faces[0]);
      /* the diagonal band's boards must span the face at both its edges */
      const dg=treadDiagBoards(2,m1);
      assert("corner boards run face-inner to face-outer, mitered both ends",
        Math.abs(Math.min(...dg.boards.map(b=>b.short))-dg.faceInner)<0.02 &&
        Math.max(...dg.boards.map(b=>b.long))>dg.faceOuter-0.02,
        dg.faceInner.toFixed(2)+" → "+dg.faceOuter.toFixed(2));
      assert("with the going matched, the corner face uses the SAME board layout as the legs",
        Math.abs(m1.TbDiag-m1.Tb)<1e-9 && dg.boards.length===treadLegBoards("front",2,m1,"miter").boards.length,
        m1.TbDiag+" vs "+m1.Tb);
      /* ring 1's corner is a triangle: its inner edge is the platform's point */
      const dg1=treadDiagBoards(1,m1);
      assert("the top step's corner is a triangle — its inner edge is the platform point",
        dg1.faceInner===0 && dg1.boards.some(b=>b.triangle),
        dg1.boards.map(b=>b.short.toFixed(1)+"/"+b.long.toFixed(1)).join(" "));
      /* legs get shorter, and by exactly the clip */
      /* leg boards: the joint starts one clip back and leans at m, not 45° */
      const tapF=treadLegBoards("front",2,m1,"miter").boards;
      assert("leg boards start one clip back and lean at the taper's angle, not 45°",
        tapF.every(b=>Math.abs(b.long-((m1.Wx+m1.R-m1.clip(1))+(b.o+b.w)*tp.m))<1e-9) &&
        Math.max(...tapF.map(b=>b.long)) < Math.max(...sqF.map(b=>b.long)),
        tapF.map(b=>b.long.toFixed(2)).join(","));
      /* framing */
      const cs=cornerStringers(m1);
      assert("the hip is gone, replaced by corner stringers across the face",
        !!cs && cs.list.length>0 && cs.sameAsLegs, cs?cs.list.length+" of them":"none");
      assert("and they are the same board as a common leg stringer",
        Math.abs(cs.notchDepth-stringersForLeg("front",m1).notchDepth)<1e-9 &&
        Math.abs(cs.throat-stringersForLeg("front",m1).throat)<1e-9,
        cs.notchDepth+" / "+cs.throat);
      /* ---- the joint ANGLE is what puts two numbers on every mitered board --- */
      {
        const w=sk(S.treadStock).w, rt=sk(S.riserStock).t;
        const lb=treadLegBoards("front",2,m1,"miter").boards[0];
        assert("a leg board's long point beats its short point by width × the joint slope",
          Math.abs((lb.long-lb.short)-w*tp.m)<1e-9, (lb.long-lb.short)+" vs "+w*tp.m);
        const dg2=treadDiagBoards(2,m1).boards[0];
        assert("a corner-face board is mitered BOTH ends, so it loses twice the setback",
          Math.abs((dg2.long-dg2.short)-2*dg2.w*tp.diagSet)<1e-9,
          (dg2.long-dg2.short)+" vs "+2*dg2.w*tp.diagSet);
        const rr=riserBoards(m1).rows[2];
        assert("a riser loses its THICKNESS × the slope, not its width",
          Math.abs((rr.front.long-rr.front.short)-rt*tp.m)<1e-9 &&
          Math.abs((rr.diag.long-rr.diag.short)-2*rt*tp.diagSet)<1e-9,
          (rr.front.long-rr.front.short)+" / "+(rr.diag.long-rr.diag.short));
        assert("the cut list buys the LONG point, never the short one",
          collectPieces(m1).some(p=>/Tread L2 front bd1/.test(p.role) && Math.abs(p.len-lb.long)<1e-9));
        /* and the 45° case must still be the classic full-board-width rule */
        const keepSh=S.cornerShape; S.cornerShape="square";
        const mq=computeModel(), lq=treadLegBoards("front",2,mq,"miter").boards[0];
        assert("on a 45° miter the two points differ by the full board width",
          Math.abs((lq.long-lq.short)-w)<1e-9 && mq.taper.m===1, lq.long-lq.short);
        S.cornerShape=keepSh;
      }

      /* ---- plan cuts: what is NOT square on an angled stringer ---- */
      {
        const th=sk(S.stringerStock).t, keepC=S.stairConnection;
        const mkLay=(gg)=>stringerBoardLayout(gg.c,gg.r,gg.R,gg.drop,gg.bw,gg.topRun,gg.topLift);
        /* TOP TREAD DOWN: the end butts the platform's 90° corner, so it is a vee
           whose two saw settings are phi and 90-phi. */
        S.stairConnection="topTreadDown";
        const mt=computeModel(), cht=cornerHipStringers(mt), cst=cornerStringers(mt);
        const gh={c:cht.c,r:mt.r,R:cht.run,drop:cht.drop,bw:sk(S.stringerStock).w,
                  topRun:cht.topRun,topLift:cht.topLift,planDeg:mt.taper.sawDeg};
        const pcH=stringerPlanCuts(mt, gh.planDeg, mkLay(gh), gh.topRun);
        assert("top tread down: the angled end needs a bevel, and the two settings are φ and 90−φ",
          pcH.bevels && Math.abs(pcH.sawFront-mt.taper.sawDeg)<1e-9 &&
          Math.abs(pcH.sawSide-(90-mt.taper.sawDeg))<1e-9,
          pcH.sawFront.toFixed(2)+"° / "+pcH.sawSide.toFixed(2)+"°");
        assert("the horns are (t/2)·tanφ and (t/2)/tanφ, so they are equal only at 45°",
          Math.abs(pcH.hornFront-th/2*Math.tan(gh.planDeg*Math.PI/180))<1e-9 &&
          Math.abs(pcH.hornSide-th/2/Math.tan(gh.planDeg*Math.PI/180))<1e-9 &&
          Math.abs(pcH.hornFront-pcH.hornSide)>0.5,
          fmtIn(pcH.hornFront)+" / "+fmtIn(pcH.hornSide));
        /* the 45° members must come out symmetric — the classic vee */
        const g45={c:cst.list[0].c,r:mt.r,R:cst.run,drop:cst.drop,bw:sk(S.stringerStock).w,
                   topRun:cst.list[0].topRun,topLift:cst.list[0].topLift,planDeg:45};
        const pc45=stringerPlanCuts(mt,45,mkLay(g45),g45.topRun);
        assert("a 45° member gives the symmetric 45/45 vee with equal horns",
          Math.abs(pc45.sawFront-45)<1e-9 && Math.abs(pc45.sawSide-45)<1e-9 &&
          Math.abs(pc45.hornFront-pc45.hornSide)<1e-9 && Math.abs(pc45.hornFront-th/2)<1e-9,
          fmtIn(pc45.hornFront));
        assert("22.5° is reachable on a mitre saw but its 67.5° partner is not",
          !pcH.sawReach && pc45.sawReach, pcH.sawReach+"/"+pc45.sawReach);
        /* FLUSH: the board rides over the rim, so nothing is beveled at all */
        for(const cn of ["flushHalf","flushFull"]){
          S.stairConnection=cn;
          const mf=computeModel(), cf=cornerHipStringers(mf);
          const gf={c:cf.c,r:mf.r,R:cf.run,drop:cf.drop,bw:sk(S.stringerStock).w,
                    topRun:cf.topRun,topLift:cf.topLift,planDeg:mf.taper.sawDeg,name:"H1, H2"};

        const ch=cornerHipStringers(mj);

      const deep=window.scrollY;
      ACTIVE_TAB="cutlist"; renderTabs(); showPanel(); scrollToPanelTop();
      const gap=document.getElementById("panels").getBoundingClientRect().top - hh - bar.offsetHeight;
      assert("switching tabs scrolls back to the top of the new panel",
        deep>200 && window.scrollY<deep && Math.abs(gap)<4, "from "+Math.round(deep)+" to "+Math.round(window.scrollY)+", gap "+Math.round(gap));
      /* and never pushes you further down when you are already up there */
      window.scrollTo(0,0); scrollToPanelTop();
      assert("clicking a tab from the top does not jump", window.scrollY===0, window.scrollY);
      ACTIVE_TAB=savedTab; renderTabs(); showPanel(); window.scrollTo(0, savedY);
    }

    /* ---- no drawing may render two labels on top of each other ----------- */
    {
      const savedM=S.method, savedP=S.platY, savedB=S.bottomBearing;
      const tbox=n=>{
        const x=+n.getAttribute("x"), y=+n.getAttribute("y");
        const fs=parseFloat(n.getAttribute("font-size")||"10");
        const w=n.textContent.length*fs*0.55, a=n.getAttribute("text-anchor")||"start";
        const l=a==="end"?x-w:a==="middle"?x-w/2:x;
        return {l,r:l+w,t:y-fs*0.8,b:y+fs*0.25};
      };
      let clashes=0, checked=0;
      /* platY 24 + structure bearing is the tightest layout, and the one that
         used to collide. */
      for(const cfg of [{method:"stringers",platY:24,bottomBearing:"structure"},
                        {method:"stringers",platY:24,bottomBearing:"surface"},
                        {method:"boxes",platY:24,bottomBearing:"structure"}]){
        Object.assign(S,cfg);
        const dm=computeModel();
        let html=renderPlanSVG(dm)+renderElevationSVG(dm)+renderTerminologySVG(dm);
        if(S.method==="stringers") html+=renderStringerSheets(dm);
        for(const one of (html.match(/<svg[\s\S]*?<\/svg>/g)||[])){
          const dd=new DOMParser().parseFromString(one,"image/svg+xml");
          if(dd.querySelector("parsererror")){ clashes++; continue; }
          const ts=[...dd.querySelectorAll("text")].filter(n=>!n.getAttribute("transform")).map(tbox);
          checked+=ts.length;
          for(let i=0;i<ts.length;i++) for(let j=i+1;j<ts.length;j++){
            const A=ts[i],B=ts[j];
            if(Math.min(A.r,B.r)-Math.max(A.l,B.l)>1.5 && Math.min(A.b,B.b)-Math.max(A.t,B.t)>1.5) clashes++;
          }
        }
      }
      assert("no two labels overlap in any drawing (declutter pass)", clashes===0, clashes+" clashes over "+checked+" labels");
      S.method=savedM; S.platY=savedP; S.bottomBearing=savedB;
    }

    /* ---- the elevation must draw the stringer at its real width ---------- */
    {
      const savedM=S.method; S.method="stringers"; S.stringerStock="2x12";
      const em=computeModel(), eP=sectionPieces(em);
      const bw=sk("2x12").w, Ls=hyp(em.r,em.R), cos=em.R/Ls;
      /* Top edge is the nosing line through the seat FRONT corners; measure the
         drawn board perpendicular to it. */
      const edgeAtFace=em.H-eP.tt, lowAtFace=edgeAtFace-bw*Ls/em.R;
      const drawnWidth=(edgeAtFace-lowAtFace)*cos;
      assert("elevation draws the stringer at its true board width, not the throat",
        Math.abs(drawnWidth-bw)<1e-6, drawnWidth.toFixed(4)+" vs "+bw);
      /* Every notch apex must sit exactly `throat` above the lower edge. */
      const throat=bw-em.r*em.R/Ls;
      let worst=0;
      for(let k=1;k<=em.N-1;k++){
        const apex=[em.Wy+(k-1)*em.R, em.H-k*em.r-eP.tt];
        const lowZ=lowAtFace-(apex[0]-em.Wy)*(em.r/em.R);   // lower edge under the apex
        worst=Math.max(worst, Math.abs((apex[1]-lowZ)*cos-throat));
      }
      assert("every notch apex clears the lower edge by exactly the throat", worst<1e-6, worst.toExponential(2));
      const face=(em.H-em.r-eP.tt)-lowAtFace;
      assert("top plumb face height = throat / cos θ", Math.abs(face-throat*Ls/em.R)<1e-6,
        face.toFixed(4)+" vs "+(throat*Ls/em.R).toFixed(4));
      // and it must actually be in the rendered polygon
      const poly=/<polygon points="([^"]+)"/.exec(renderElevationSVG(em))[1].split(" ").map(p=>p.split(",").map(Number));
      assert("elevation stringer polygon closes vertically at the platform face",
        Math.abs(poly[0][0]-poly[poly.length-1][0])<0.2, poly[0][0]+" vs "+poly[poly.length-1][0]);
      S.method=savedM;
    }

    /* ---- the cut list must nest stringers, not buy a board each ---------- */
    {
      const savedM=S.method; S.method="stringers";     // collectPieces only emits stringers in this mode
      const sm=computeModel(), sf=stringersForLeg("front",sm), ss=stringersForLeg("side",sm);
      const nStr=sf.list.length+ss.list.length+1;
      const strPieces=collectPieces(sm).filter(p=>p.stock===S.stringerStock);
      assert("cut list records each stringer's CUT length, not the stock length",
        strPieces.length===nStr && strPieces.every(p=>p.len<Math.max(...parseStockLens())-1),
        strPieces.map(p=>p.len.toFixed(1)).join(", "));
      const boards=(binPack(strPieces)[S.stringerStock]||[]).length;
      const perBoard=Math.floor((96+S.kerf)/(sf.list[0].reqLen+S.kerf));
      assert("stringers get nested — fewer boards than stringers",
        boards<nStr && boards<=Math.ceil(nStr/Math.max(perBoard,1))+1,
        boards+" boards for "+nStr+" stringers ("+perBoard+" fit per 96\")");
      S.method=savedM;
    }

    /* ---- stringer stock layout ------------------------------------------ */
    const stL=stringersForLeg("front", computeModel()), gL=stL.list[0];
    const svgStock=stringerStockSVG(gL.c, computeModel().r, computeModel().R, stL.drop, sk("2x12").w, gL.boardLen, "x");
    const polyS=/<polygon points="([^"]+)"/.exec(svgStock)[1].split(" ").map(p=>p.split(",").map(Number));
    const vb=/viewBox="0 0 (\d+) (\d+)"/.exec(svgStock);
    assert("stock layout: the cut nests inside the board it is drawn on",
      polyS.every(p=>p[0]>=-1 && p[0]<=+vb[1]+1 && p[1]>=-1 && p[1]<=+vb[2]+1));
    assert("stock layout shows the board you buy, not just the cut",
      svgStock.indexOf('fill="#f2ede4"')>0 && (gL.boardLen>gL.reqLen ? svgStock.indexOf("offcut")>0 : true));

    /* ---- sidebar width -------------------------------------------------- */
    assert("sidebar width is clamped to a usable range",
      clampSB(10)===SB_MIN && clampSB(99999)===SB_MAX && clampSB(420)===420,
      clampSB(10)+"/"+clampSB(99999));

    /* ---- language ------------------------------------------------------- */
    /* A translation that loses a {n} placeholder silently swallows a number,
       which is worse than being untranslated. */
    let badPh=[], emptyV=[];
    for(const k in FR){
      const want=(k.match(/\{\d\}/g)||[]).sort().join(","), got=(FR[k].match(/\{\d\}/g)||[]).sort().join(",");
      if(want!==got) badPh.push(k+" ["+want+" vs "+got+"]");
      if(!String(FR[k]).trim()) emptyV.push(k);
    }
    assert("every French translation keeps all of its {n} placeholders", badPh.length===0, badPh.slice(0,3).join(" | "));
    assert("no French translation is blank", emptyV.length===0, emptyV.slice(0,3).join(" | "));
    assert("t() falls back to English for an unknown string",
      (()=>{ S.lang="fr"; const r=t("__nope__ zzz"); S.lang="en"; return r==="__nope__ zzz"; })());
    assert("t() substitutes placeholders in both languages",
      t("Riser {0} {1}", 2, "front")==="Riser 2 front" &&
      (()=>{ S.lang="fr"; const r=t("Riser {0} {1}", 2, "avant"); S.lang="en"; return r==="Contremarche 2 avant"; })());
    const numsEN = JSON.stringify([computeModel(), stringersForLeg("front",computeModel()).list,
      boxesForLevel(computeModel(),1), platformModel(computeModel()), collectPieces(computeModel()).map(p=>p.len)]);
    S.lang="fr";
    const numsFR = JSON.stringify([computeModel(), stringersForLeg("front",computeModel()).list,
      boxesForLevel(computeModel(),1), platformModel(computeModel()), collectPieces(computeModel()).map(p=>p.len)]);
    const frWarnCount = validate(computeModel()).length;
    S.lang="en";
    assert("switching language changes no computed dimension", numsEN===numsFR);
    assert("switching language changes no validation outcome", frWarnCount===validate(computeModel()).length);
    assert("French decimals use a comma, English a period",
      (()=>{ S.lang="fr"; const f=dec("9.333"); S.lang="en"; return f==="9,333" && dec("9.333")==="9.333"; })());
    assert("a comma-decimal entry parses like a period", Math.abs(parseLen("9,5")-9.5)<1e-9, parseLen("9,5"));

    const fb2 = fitBoards(11, 5.5, 0.25);
    assert("T=11 with 2x6 @ 1/4 gap -> 2 boards, 1/4 overshoot, tight gap 0",
      fb2.recommend==="overshoot" && fb2.overshootN===2 && Math.abs(fb2.overshoot-0.25)<1e-9 && Math.abs(fb2.altGapTight)<1e-9,
      fb2.recommend+" n+1="+fb2.overshootN+" over="+fb2.overshoot+" tight="+fb2.altGapTight);
  } finally {
    Object.keys(S).forEach(k=>delete S[k]);
    Object.assign(S, backup);
    Object.assign(CODE, backupCode);
    STOCK = backupStock;
  }
  return results;
}
function renderTestsPanel(){
  const results = runTests();
  const pass = results.filter(r=>r.pass).length;
  let h = "<h3>Self-tests</h3><table><thead><tr><th>Test</th><th>Result</th><th>Detail</th></tr></thead><tbody>";
  for(const r of results) h += "<tr><td>"+r.name+"</td><td>"+(r.pass?'<span class="pill ok">PASS</span>':'<span class="pill rip">FAIL</span>')+"</td><td class=\"mono\">"+r.extra+"</td></tr>";
  h += "</tbody></table><div class='tests-summary msg "+(pass===results.length?"i":"e")+"'>"+pass+" / "+results.length+" passed</div>";
  document.getElementById("panel-tests").innerHTML = h;
}

/* ---------- 22. top-level orchestrator ------------------------------------ */
function run(){
  ensurePanels();
  let model;
  try{ model = computeModel(); }
  catch(e){ console.error("computeModel failed:", e); return; }
  renderSummaryPanel(model);
  renderPlanPanel(model);
  renderSchedulePanel(model);
  renderFramingPanel(model);
  renderStepsPanel(model);
  renderCutlistPanel(model);
  renderWarningsPanel(model);
  if(isTestMode()) renderTestsPanel();
  renderTabs();
  showPanel();
  renderPrintHead(model);
}

/* ---------- 23. reset / export / import ----------------------------------- */
function resetAll(){
  const keepLang = S.lang, keepUnits = S.units, keepSB = S.sidebarW;   // UI prefs, not stair inputs
  Object.assign(S, DEFAULTS, {lang:keepLang, units:keepUnits, sidebarW:keepSB});
  Object.assign(CODE, CODE_DEFAULT);
  STOCK = JSON.parse(JSON.stringify(STOCK_DEFAULT));
  SAVE_STATE.dirty = true; SAVE_STATE.badPayload = false;
  save(); renderForm(); run();
}
function exportJSON(){
  const blob = new Blob([JSON.stringify({v:SAVE_VER,S,CODE,STOCK}, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = (S.project||"stair").replace(/[^a-z0-9]+/gi,"_")+".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}
function importJSON(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(data.S) Object.assign(S, DEFAULTS, data.S);
      if(data.CODE) Object.assign(CODE, CODE_DEFAULT, data.CODE);
      if(data.STOCK) STOCK = Object.assign(JSON.parse(JSON.stringify(STOCK_DEFAULT)), data.STOCK);
      SAVE_STATE.dirty = true; SAVE_STATE.badPayload = false;
      save(); renderForm(); run();
    }catch(e){ alert(t("Could not read that file: {0}", e.message)); }
  };
  reader.readAsText(file);
}

/* ---------- 24. wiring & init ---------------------------------------------- */
load();
document.getElementById("lang").value = S.lang;
document.getElementById("lang").addEventListener("change", e=>{ S.lang=e.target.value; SAVE_STATE.dirty=true; save(); applyChrome(); renderForm(); run(); });
document.getElementById("units").value = S.units;
document.getElementById("units").addEventListener("change", e=>{ S.units=e.target.value; SAVE_STATE.dirty=true; save(); renderForm(); run(); });
document.getElementById("btn-undo").addEventListener("click", ()=>{
  if(!confirm(t("Put back the previous saved design? The current one becomes the undo step."))) return;
  if(restorePrevious()){ SAVE_STATE.badPayload=false; applyChrome(); renderForm(); run(); showSaveState(); }
});
document.getElementById("btn-save").addEventListener("click", exportJSON);
document.getElementById("btn-load").addEventListener("click", ()=>document.getElementById("file").click());
document.getElementById("file").addEventListener("change", e=>{ if(e.target.files[0]) importJSON(e.target.files[0]); e.target.value=""; });
document.getElementById("btn-reset").addEventListener("click", ()=>{ if(confirm(t("Reset all inputs to defaults?"))) resetAll(); });
document.getElementById("btn-print").addEventListener("click", ()=>window.print());
document.getElementById("inputs").addEventListener("input", onFormInput);
document.getElementById("inputs").addEventListener("change", onFormInput);

/* The input column and the tab bar both park directly under the header, so they
   need its real height — it wraps to two rows on a narrow window, and a stale
   57px would let content slide under it. */
function syncHeaderHeight(){
  const h = document.querySelector("header");
  if(h) document.documentElement.style.setProperty("--hh", Math.round(h.getBoundingClientRect().height)+"px");
}
syncHeaderHeight();
if(window.ResizeObserver) new ResizeObserver(syncHeaderHeight).observe(document.querySelector("header"));
else window.addEventListener("resize", syncHeaderHeight);

applySidebar();
initSplitter();
applyChrome();
renderForm();
run();
showSaveState();
/* showSaveState can add the Restore-previous button, which changes the header's
   height — re-measure once the chrome is final, rather than waiting a frame for
   the observer and letting the first paint sit at the wrong offset. */
syncHeaderHeight();
/* Last-ditch write, in case a change slipped through without an input event.
   flushSave, not save: a page that never restored and never changed anything
   must not write its defaults over a saved design on the way out. */
window.addEventListener("beforeunload", flushSave);
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="hidden") flushSave(); });
</script>
