/* ---------- 18a. step naming --------------------------------------------
   Steps are numbered from the PLATFORM DOWN: L1 is the first step below the
   platform, L(N-1) is the last one before the deck. Everything — drawings,
   tables, cut list — uses these two helpers so the numbering never disagrees
   between views. */
/* Level tags are drawn LAST, in a top layer, with a white halo behind the
   glyphs (paint-order:stroke) — they sit over wood-coloured fills and, in plan,
   inside the zone the next ring's nosing overhangs, so they were being painted
   over entirely. */
const TAGSTYLE='font-size="10.5" font-weight="700" fill="#3b2a17" stroke="#ffffff" stroke-width="3.2" paint-order="stroke" stroke-linejoin="round"';
/* stringer ids in the plan — same halo trick, in the framing colour so they do
   not read as level tags */
const STRTAG='font-size="10" font-weight="700" fill="#2d4257" stroke="#ffffff" stroke-width="3" paint-order="stroke" stroke-linejoin="round"';
function levelTag(model,k){
  if(model.N-1<=1) return t("L{0} (only step)", k);
  if(k===1) return t("L{0} (top)", k);
  if(k===model.N-1) return t("L{0} (bottom)", k);
  return t("L{0}", k);
}
function levelPos(model,k){
  if(model.N-1<=1) return t("only step");
  if(k===1) return t("top step — first one down from the platform");
  if(k===model.N-1) return t("bottom step — last one before the deck");
  return t("step {0} of {1}", k, model.N-1);
}
function levelLegend(model){
  return '<div class="note">'+t("Steps are numbered from the platform down: L1 is the first step below the platform, L{0} is the last step before the deck. The platform is the top landing and the deck is the bottom landing — neither is numbered.", Math.max(1,model.N-1))+"</div>";
}

/* ---------- 18b. materials palette & section geometry -------------------- */
const MAT = {
  tread:'fill="#e6bd8c" stroke="#a97b45" stroke-width=".8"',
  riser:'fill="#d3a06a" stroke="#a97b45" stroke-width=".8"',
  frame:'fill="#c2a884" stroke="#8a6a45" stroke-width=".8"',
  string:'fill="#cdb693" stroke="#8a6a45" stroke-width="1"',
  block:'fill="#b39875" stroke="#8a6a45" stroke-width=".8"',
  plat:'fill="#cfe0ef" stroke="#5b87ad" stroke-width=".9"',
  post:'fill="#a9c4da" stroke="#41708f" stroke-width="1"',
  rim: 'fill="#b79a6f" stroke="#6b5335" stroke-width="1.1"',
  joist:'fill="#d7c4a4" stroke="#8a6a45" stroke-width=".8"',
  platDeck:'fill="#e6bd8c" stroke="#5b87ad" stroke-width=".8"',
  exist:'fill="#d3d9df" stroke="#9aa6b2" stroke-width=".8"',
  wall:'fill="#e7e9ec" stroke="#9aa6b2" stroke-width=".8"'
};
function legendHTML(items){
  return '<div class="legend">'+items.map(i=>'<span><i style="background:'+i[0]+';border-color:'+i[1]+'"></i>'+i[2]+"</span>").join("")+"</div>";
}
function materialsLegend(){
  return legendHTML([["#e6bd8c","#a97b45",t("tread boards ({0})", S.treadStock)],
    ["#d3a06a","#a97b45",t("riser boards ({0})", S.riserStyle==="closed"?S.riserStock:t("none — open"))],
    [S.method==="boxes"?"#c2a884":"#cdb693", "#8a6a45",
      S.method==="boxes"?t("box frame / joists ({0})", S.frameStock):t("stringers ({0})", S.stringerStock)],
    ["#cfe0ef","#5b87ad",t("platform frame")],
    ["#d3d9df","#9aa6b2",t("existing deck / house wall")]]);
}
/* The front-leg section: every piece of material, in stair coordinates
   (u = distance out from the house wall, z = height above the deck surface). */
/* Laid out from the NOSING inwards: board 1 is a full board with its front
   edge ON the nosing tip, and any odd piece is ripped at the BACK, where the
   riser board covers it. Overshooting backwards is not an option — behind the
   tread's back edge sits the frame of the level above. */
/* depth defaults to the leg tread depth; the tapered corner face has its own
   (shallower or deeper) depth and reuses the identical fit logic */
function treadBoardWidths(model, depth){
  const stock=sk(S.treadStock), gap=S.treadGap, T=(depth!=null?depth:model.Tb), w=stock.w;
  const fit=fitBoards(T, w, gap);                    // kept for the alternatives readout
  const nFull=Math.max(1, Math.floor((T+gap)/(w+gap)));
  const covered=nFull*w+(nFull-1)*gap, rem=T-covered;
  let widths=Array(nFull).fill(w), backRip=0, exact=false, slack=0;
  if(rem<0.0626) exact=true;                         // back edge lands on the frame
  else if(rem<=gap+0.0626) slack=rem;                // absorbed by a wider gap at the back
  else { backRip=rem-gap; widths.push(backRip); }    // filler strip at the back
  return {widths, effGap:gap, fit, nFull, backRip, exact, slack, T};
}
/* Front-anchored offsets, measured from the tread's back edge datum.
   Index 0 is the nosing board. */
function treadBoardOffsets(model, depth){
  const T=(depth!=null?depth:model.Tb);
  const {widths, effGap}=treadBoardWidths(model, T);
  const out=[]; let front=T;
  for(const w of widths){ const back=front-w; out.push({o:back, w}); front=back-effGap; }
  return out;
}
function sectionPieces(model){
  const tt=sk(S.treadStock).t, rt=sk(S.riserStock).t;
  const st=S.includePlatform ? sk(S.platSurface).t : tt;
  const {widths, effGap} = treadBoardWidths(model);
  const {Wy,R,nose,r,N,H} = model;
  const treads=[], risers=[], frames=[];
  const offs = treadBoardOffsets(model);
  for(let k=1;k<=N-1;k++){
    const z=H-k*r, u0=Wy+(k-1)*R;
    const bds = offs.map(b=>({u:u0+b.o, w:b.w}));      // front-anchored on the nosing
    treads.push({k, z, u0, u1:u0+R, bds, depth:model.Tb});
    // zBot = z_(k+1); the bottom step reaches the bearing plane, which is -base
    frames.push({k, u0, u1:u0+R, zTop:z-tt, zBot:(k===N-1 ? -model.base : H-(k+1)*r)});
  }
  for(let k=1;k<=N;k++){                                        // riser 1 = platform face
    risers.push({k, u:Wy+(k-1)*R, zTop:(k===1? H-st : H-(k-1)*r-tt), zBot:H-k*r});
  }
  return {treads, risers, frames, tt, rt, st, widths, effGap};
}
/* ---------- 18c. terminology diagram ------------------------------------- */
function renderTerminologySVG(model){
  const r=model.r, R=model.R, n=model.nose;
  const tt=sk(S.treadStock).t, rt=sk(S.riserStock).t, st=S.includePlatform?sk(S.platSurface).t:tt;
  const sc=Math.min(12, 190/Math.max(R,1), 150/Math.max(r,1));
  const pd=Math.min(model.Wy,15);                                // platform shown, truncated
  const base=model.base, dT=model.deckT, jD=5.5;
  const closed0 = S.riserStyle==="closed";
  /* Gutters are sized from the real label text so a longer translation cannot
     push a leader line off the canvas. */
  const LBL_L=[t("platform decking = the top tread"),
    base>0?t("platform frame — down to the joists"):t("platform frame — sits on the decking"),
    t("existing deck joists"),
    base>0?t("existing decking — cut away under the stair"):t("existing decking, z = 0 on top"),
    closed0?t("riser 1 = the platform's own face"):"", t("total rise H"),
    base>0?t("framing {0} deeper — rise unchanged", fmtIn(base)):""];
  const LBL_R=[t("tread board ({0} × {1})", S.treadStock, treadBoardWidths(model).widths.length),
    S.riserStyle==="open"?t("riser board (omitted — open riser)"):t("riser board ({0})", S.riserStock),
    S.method==="boxes"?t("box rim / frame"):t("cut stringer behind"),
    t("bearing: rim above lands over the rim below"), t("unit rise r"),
    t("tread surface — level {0} height z", model.N-1), n>0.01?t("nosing {0}", fmtIn(n)):""];
  const FOOT=t("schematic — 2 steps of your actual rise/run shown");
  const gl=Math.max(...LBL_L.map(s=>estTextW(s,10)))+24;
  const gr=Math.max(...LBL_R.map(s=>estTextW(s,10)))+26;
  const mT=18, mB=38;          // room for the footer AND the scale bar under it
  const rt0=model.riserT;
  const uMin=-5, uMax=pd+2*R+rt0+n+6, zMax=3*r+2.5, zMin=-(dT+jD)-1;
  const W=Math.max(gl+(uMax-uMin)*sc+gr, gl+estTextW(FOOT,9)+24), H=(zMax-zMin)*sc+mT+mB;
  const X=u=>gl+(u-uMin)*sc, Y=z=>mT+(zMax-z)*sc;
  const box=(u0,u1,z0,z1,style)=>svgRect(X(u0),Y(z1),(u1-u0)*sc,(z1-z0)*sc,style);
  let s=svgOpen(W,H);
  s+=box(-5,0,zMin,3*r,MAT.wall)+svgText(X(-4.6),Y(3*r)-5,t("house"),'font-size="9" fill="#78838f"');
  s+=box(uMin,uMax,-dT-jD,-dT,MAT.exist);                        // existing joists
  if(base>0) s+=box(pd+2*R+n,uMax,-dT,0,MAT.exist);              // decking, cut away under the stair
  else s+=box(uMin,uMax,-dT,0,MAT.exist);
  s+=box(0,pd,-base,3*r-st,MAT.plat);
  s+=svgLine(X(pd*0.5),Y(0),X(pd*0.5),Y(3*r),'stroke="#5b87ad" stroke-width=".7" stroke-dasharray="3 3"');
  s+=svgText(X(1),Y(3*r-st)+13,t("platform continues to the wall"),'font-size="8.5" fill="#5b87ad"');
  // two steps, exactly as the calculator builds them
  const lv=[{z:2*r,u0:pd},{z:r,u0:pd+R}];
  const structStyle = S.method==="boxes" ? MAT.frame : MAT.string;
  const closed = S.riserStyle==="closed";
  for(const l of lv){
    const bot = (l.z===r) ? -base : l.z-r;                       // bottom step reaches bearing
    s+=box(l.u0,l.u0+R,bot,l.z-tt,structStyle);                  // box rim / stringer
    s+=box(l.u0,l.u0+R+rt0+n,l.z-tt,l.z,MAT.tread);              // tread — laps the riser, then the nosing
    s+=svgLine(X(l.u0+R/2),Y(l.z),X(l.u0+R/2),Y(l.z-tt),'stroke="#a97b45" stroke-width=".6"');
    if(closed) s+=box(l.u0+R,l.u0+R+rt,bot,l.z-tt,MAT.riser);    // riser below/in front
  }
  s+=box(0,pd+rt0+n,3*r-st,3*r,MAT.platDeck);                    // platform decking, overhanging the riser face
  if(closed) s+=box(pd,pd+rt,2*r,3*r-st,MAT.riser);              // riser 1 clads the platform face, on its outside
  // ---- labels, left gutter
  const Lx=gl-14;
  s+=svgLead(X(pd*0.6),Y(3*r-st/2),Lx,Y(3*r)-4,LBL_L[0],"end");
  s+=svgLead(X(pd*0.75),Y(1.9*r),Lx,Y(3*r)+12,LBL_L[1],"end");
  s+=svgLead(X(-2.5),Y(-dT-jD/2),Lx,Y(0)+18,LBL_L[2],"end");
  s+=svgLead(X(uMax-3),Y(-dT/2),Lx,Y(0)+30,LBL_L[3],"end");
  if(closed) s+=svgLead(X(pd+rt/2),Y(2.5*r),Lx,Y(2.6*r),LBL_L[4],"end");
  s+=dimLineV(X(-3.2),Y(3*r),Y(0),LBL_L[5],"left");
  if(base>0) s+=dimLineV(X(-3.2),Y(0),Y(-base),LBL_L[6],"left");
  // ---- labels, right gutter
  const Rx=X(uMax)+16;
  const t1=lv[0], t2=lv[1];
  s+=svgLead(X(t1.u0+R*0.55),Y(t1.z-tt/2),Rx,Y(3*r)-2,LBL_R[0]);
  s+=svgLead(X(t1.u0+R+rt/2),Y(t1.z-r/2),Rx,Y(3*r)+14,LBL_R[1]);
  s+=svgLead(X(t1.u0+R*0.3),Y(t1.z-tt-(r-tt)/2),Rx,Y(3*r)+30,LBL_R[2]);
  s+=svgLead(X(t2.u0+2),Y(t2.z+0.4),Rx,Y(3*r)+46,LBL_R[3]);
  s+=dimLineV(X(uMax-2.5),Y(2*r),Y(r),LBL_R[4]);
  /* run = nosing tip to nosing tip */
  const tip1=t1.u0+R+rt0+n, tip2=t2.u0+R+rt0+n;
  s+=svgLine(X(tip1),Y(t1.z),X(tip1),Y(0)+20,'stroke="#999" stroke-width=".6" stroke-dasharray="2 2"');
  s+=svgLine(X(tip2),Y(t2.z),X(tip2),Y(0)+20,'stroke="#999" stroke-width=".6" stroke-dasharray="2 2"');
  s+=dimLineH(X(tip1),X(tip2),Y(0)+16,t("unit run R — nosing to nosing"));
  // walking depth: riser face behind, to the nosing tip in front
  s+=dimLineH(X(t2.u0+rt0),X(t2.u0+R+rt0+n),Y(0)+32,t("tread depth T = R + nosing"));
  if(n>0.01) s+=svgLead(X(t2.u0+R+rt0+n/2),Y(t2.z-tt/2),Rx,Y(0)+8,LBL_R[6]);
  s+=svgLead(X(t2.u0+R*0.5),Y(t2.z),Rx,Y(r)+2,LBL_R[5]);
  s+=scaleBarSVG(gl,H-10,sc);
  s+=svgText(gl,H-26,FOOT,'font-size="9" fill="#78838f"');
  s+="</svg>";
  return declutterSVG(s);
}

/* Realistic plan: every board drawn at its true width with its real gap and
   mitered end, framing below shown as hidden (dashed) lines. */
function renderPlanSVG(model){
  const {Wx,Wy,R,nose,N,footX,footY}=model;
  const tp=model.taper;
  const style = (tp.on || S.cornerStyle!=="through") ? "miter" : "through";
  const capBottom=t("front leg — steps descend this way (+Y)");
  const jointLbl = tp.on ? t("{0}° joint line", dec(tp.sawDeg.toFixed(1))) : t("45° miter line");
  /* the corner caption is the widest label on the right — size the gutter from
     the string actually drawn, not a shorter stand-in */
  const cornerCap = tp.on ? t("corner hips H1 H2 + face stringers C…") : t("hip stringer (H)");
  const rightLabels=[t("side leg (+X)"), jointLbl, cornerCap];
  const mL=52, mT=40, mB=52;
  const mR=Math.max(76, Math.max(...rightLabels.map(s=>estTextW(s,9)))+24);
  const scale=Math.min(7.5, 690/Math.max(footX+5,1));
  const W=Math.max(mL+(footX+5)*scale+mR, mL+estTextW(capBottom,9)+24), H=mT+(footY+5)*scale+mB;
  const X=x=>mL+x*scale, Y=y=>mT+y*scale;
  let s=svgOpen(W,H), topLayer="";        // topLayer is appended after everything
  // house wall along y=0, and the open/walled far side face at x=0
  s+=svgRect(X(0)-4,Y(-4),(footX+4)*scale+4,4*scale,MAT.wall);
  s+=svgText(X(1),Y(-4)+12,t("house wall"),'font-size="10" fill="#78838f"');
  if(S.faceX0==="wall") s+=svgRect(X(-4),Y(-4),4*scale,(footY+4)*scale,MAT.wall);
  else s+=svgText(X(0)-8,Y(footY/2),t("open side (skirt)"),'font-size="9" fill="#a06a2c" transform="rotate(-90 '+(X(0)-8).toFixed(1)+' '+Y(footY/2).toFixed(1)+')" text-anchor="middle"');
  // platform frame (its decking is drawn later, so the nosing overhangs the treads)
  s+=svgRect(X(0),Y(0),Wx*scale,Wy*scale,MAT.plat);
  // tread boards, level by level
  for(const lvl of model.levels){
    const k=lvl.k;
    for(const legName of ["front","side"]){
      const tb=treadLegBoards(legName,k,model,style);
      const base=(legName==="front"?Wy:Wx)+(k-1)*R;      // depth coordinate of the tread's inner edge
      for(const b of tb.boards){
        const a=base+b.o, c2=a+b.w;                       // this board's near/far edge in the depth direction
        if(legName==="front"){
          s+=(style==="miter")
            ? svgPoly([[X(0),Y(a)],[X(b.short),Y(a)],[X(b.long),Y(c2)],[X(0),Y(c2)]],MAT.tread)
            : svgRect(X(0),Y(a),b.long*scale,b.w*scale,MAT.tread);
        } else {
          s+=(style==="miter")
            ? svgPoly([[X(a),Y(0)],[X(a),Y(b.short)],[X(c2),Y(b.long)],[X(c2),Y(0)]],MAT.tread)
            : svgRect(X(a),Y(0),b.w*scale,b.long*scale,MAT.tread);
        }
      }
    }
    /* The tapered corner's own face: boards parallel to the 45° diagonal, so
       each is a trapezoid between the two diverging joint lines. Centred on the
       old hip line, which is still the axis of symmetry. */
    const dg=treadDiagBoards(k,model);
    if(dg){
      const Sin=Wx+Wy+2*(k-1)*R-model.clip(k-1);
      const edge=(o,len)=>{                     // the two ends of the board edge at offset o
        const u=(Sin+o*Math.SQRT2-Wx-Wy)/2, h=len/(2*Math.SQRT2);
        return [[Wx+u+h, Wy+u-h],[Wx+u-h, Wy+u+h]];
      };
      for(const b of dg.boards){
        const [a1,a2]=edge(b.o,b.short), [c1,c2]=edge(b.o+b.w,b.long);
        s+=svgPoly([[X(a1[0]),Y(a1[1])],[X(c1[0]),Y(c1[1])],[X(c2[0]),Y(c2[1])],[X(a2[0]),Y(a2[1])]],MAT.tread);
      }
    }
    /* Joint lines and the level tag go to a top layer — the next ring's tread
       boards are drawn after this one and would cover them. */
    const iy=Wy+(k-1)*R, ix=Wx+(k-1)*R, cPrev=model.clip(k-1), Tb=model.Tb, m=tp.m;
    if(style==="miter"){
      const J='stroke="#8c3b3b" stroke-width="1.1" stroke-dasharray="5 3"';
      /* front↔corner, then side↔corner. Square corner: cPrev 0 and m 1, so both
         collapse onto the one 45° miter the tool always drew. */
      topLayer+=svgLine(X(ix-cPrev),Y(iy),X(ix-cPrev+Tb*m),Y(iy+Tb),J);
      if(tp.on) topLayer+=svgLine(X(ix),Y(iy-cPrev),X(ix+Tb),Y(iy-cPrev+Tb*m),J);
    }
    /* Tag placement. Square corner: just inside the ring's outer point. Tapered:
       on the corner face itself, which is the distinctive part of the ring and
       is well clear of the leg ends where the stringer ids live — at N=9 the
       bottom level tag and the last leg id land on the same line otherwise. */
    if(tp.on){
      /* mid-way along the front leg: clear of the leg ends where the F ids sit
         and clear of the hip line where the C ids sit, and the rings are one
         full run apart in y so the tags never crowd each other */
      /* 17px up, same as the square branch: on the bottom ring iy+Tb IS the
         footprint edge, where the stringer-id row sits. */
      topLayer+=svgText(X((ix-cPrev+Tb*m)*0.5),Y(iy+Tb)-17,levelTag(model,k),TAGSTYLE+' text-anchor="middle"');
    } else {
      /* Clear of the stringer-id row, which sits 4px above the footprint edge —
         on a single-step stair the ring's outer edge IS that edge, and the long
         "L1 (only step)" tag used to land right on the last id. */
      topLayer+=svgText(X(ix+Tb)-6,Y(iy+Tb)-17,levelTag(model,k),TAGSTYLE+' text-anchor="end"');
    }
  }
  /* Platform decking last, so its nosing overhangs level 1's tread the same way
     every tread overhangs the one below it. Frame is Wx × Wy; decking is +nosing
     on the two faces that have steps. */
  const fX=model.platFinX, fY=model.platFinY;
  if(S.includePlatform){
    const ps=sk(S.platSurface), pg=S.treadGap;
    if(S.platJoistDir==="y"){ for(let o=0;o<fY-0.01;o+=ps.w+pg) s+=svgRect(X(0),Y(o),fX*scale,Math.min(ps.w,fY-o)*scale,MAT.platDeck); }
    else { for(let o=0;o<fX-0.01;o+=ps.w+pg) s+=svgRect(X(o),Y(0),Math.min(ps.w,fX-o)*scale,fY*scale,MAT.platDeck); }
  } else s+=svgRect(X(0),Y(0),fX*scale,fY*scale,MAT.platDeck);
  if(model.nose>0.01){
    s+=svgLine(X(0),Y(Wy),X(Wx),Y(Wy),'stroke="#5b87ad" stroke-width=".8" stroke-dasharray="3 2"');
    s+=svgLine(X(Wx),Y(0),X(Wx),Y(Wy),'stroke="#5b87ad" stroke-width=".8" stroke-dasharray="3 2"');
    /* At the LEFT end of the dashed frame line, not the right: on a shallow
       platform in mm the label reached the side-leg stringer ids. */
    s+=svgText(X(1),Y(Wy)+11,t("platform frame {0} × {1}", L(Wx), L(Wy)),'font-size="8.5" fill="#5b87ad"');
  }
  s+=svgText(X(Math.min(Wx,fX)/2),Y(Wy/2),
    model.nose>0.01 ? t("platform {0} × {1} finished", L(fX), L(fY)) : t("platform {0} × {1}", L(fX), L(fY)),
    'font-size="10" fill="#33556e" text-anchor="middle"');
  if(style==="miter") s+=svgText(X(footX)+6,Y(footY)-2,jointLbl,'font-size="9" fill="#8c3b3b"');
  // framing below, hidden-line dashed
  const dash='stroke="#4c6076" stroke-width=".8" stroke-dasharray="3 2.5"';
  if(S.method==="boxes"){
    for(const lvl of model.levels){
      const bx=boxesForLevel(model,lvl.k);
      for(const leg of bx.legs){
        const inner=(leg.legName==="front"?Wy:Wx)+(lvl.k-1)*R, outer=inner+R;
        if(leg.legName==="front"){
          s+=svgLine(X(0),Y(inner),X(Wx+(lvl.k-1)*R),Y(inner),dash);
          s+=svgLine(X(0),Y(outer),X(leg.outer),Y(outer),dash);
          for(let i=0;i<leg.joistCount;i++){ const x=Math.min(i*leg.joistSpacing,leg.outer); s+=svgLine(X(x),Y(inner),X(x),Y(outer),dash); }
        } else {
          s+=svgLine(X(inner),Y(0),X(inner),Y(Wy+(lvl.k-1)*R),dash);
          s+=svgLine(X(outer),Y(0),X(outer),Y(leg.outer),dash);
          for(let i=0;i<leg.joistCount;i++){ const y=Math.min(i*leg.joistSpacing,leg.outer); s+=svgLine(X(inner),Y(y),X(outer),Y(y),dash); }
        }
      }
    }
  } else {
    /* Each stringer is tagged with the SAME id used in the framing tables, the
       sheets and the cut list, so a board on the pile can be traced to a line
       on this drawing. Tags go on the top layer with a halo — they sit over the
       tread boards, which are drawn after the framing. */
    for(const legName of ["front","side"]){
      const st=stringersForLeg(legName,model);
      for(const g of st.list){
        const start=(legName==="front"?Wy:Wx)+(g.kmin-1)*R;
        if(legName==="front"){
          s+=svgLine(X(g.pos),Y(start),X(g.pos),Y(footY),dash);
          topLayer+=svgText(X(g.pos)+3,Y(footY)-4,g.id,STRTAG);
        } else {
          s+=svgLine(X(start),Y(g.pos),X(footX),Y(g.pos),dash);
          topLayer+=svgText(X(footX)-4,Y(g.pos)-3,g.id,STRTAG+' text-anchor="end"');
        }
      }
    }
    const cs=cornerStringers(model), chp=cornerHipStringers(model);
    if(chp){
      /* Two hips on the joint lines, plus whatever face stringers break up the
         span between them. */
      const cN=model.clip(N-1), reach=(N-1)*R+model.riserT+nose;
      const HIP='stroke="#4c6076" stroke-width="1.8" stroke-dasharray="7 3"';
      s+=svgLine(X(Wx),Y(Wy),X(Wx+reach-cN),Y(Wy+reach),HIP);
      s+=svgLine(X(Wx),Y(Wy),X(Wx+reach),Y(Wy+reach-cN),HIP);
      topLayer+=svgText(X(Wx+(reach-cN)*0.62)+4,Y(Wy+reach*0.62)-4,"H1",STRTAG);
      topLayer+=svgText(X(Wx+reach*0.62)+4,Y(Wy+(reach-cN)*0.62)-4,"H2",STRTAG);
      for(const g of cs.list){
        const h=g.lateral/Math.SQRT2;                       // sideways offset in x,y
        const u0=(g.kmin-1)*R;
        s+=svgLine(X(Wx+u0+h),Y(Wy+u0-h),X(Wx+reach+h),Y(Wy+reach-h),
          'stroke="#4c6076" stroke-width="1.4" stroke-dasharray="6 3"');
        topLayer+=svgText(X(Wx+(u0+reach)/2+h)+4,Y(Wy+(u0+reach)/2-h)-4,g.id,STRTAG);
      }
      s+=svgText(X(footX)+6,Y(footY)+12,cornerCap,'font-size="9" fill="#4c6076"');
    } else {
      s+=svgLine(X(Wx),Y(Wy),X(footX),Y(footY),'stroke="#4c6076" stroke-width="1.6" stroke-dasharray="6 3"');
      topLayer+=svgText(X((Wx+footX)/2)+4,Y((Wy+footY)/2)-4,"H",STRTAG);
      s+=svgText(X(footX)+6,Y(footY)+12,t("hip stringer (H)"),'font-size="9" fill="#4c6076"');
    }
  }
  s+=svgText(mL,Y(footY)+34,capBottom,'font-size="9" fill="#667"');
  // kept high on the right so it clears the overall depth dimension at mid-height
  s+=svgText(X(footX)+16,Y(footY*0.22),t("side leg (+X)"),'font-size="9" fill="#667"');
  s+=dimLineH(X(0),X(footX),Y(footY)+18,L(footX));
  s+=dimLineV(X(footX)+46,Y(0),Y(footY),L(footY));
  s+=topLayer;                             // level tags + miter lines, on top of every board
  s+=scaleBarSVG(mL,H-12,scale);
  s+="</svg>";
  return declutterSVG(s);
}

/* ---------- 18b2. framing-only plan ---------------------------------------
   The plan view above shows the finished stair, so the framing is dashed
   hidden lines under the boards. This is the same view, same scale, same
   orientation, with every tread board and the platform decking taken away and
   the framing drawn as the real stock it is. What you build from. */
function renderFramingPlanSVG(model){
  const {Wx,Wy,R,nose,N,footX,footY}=model, tp=model.taper;
  const tk=sk(S.frameStock).t, sT=sk(S.stringerStock).t;
  const cap=t("framing only — no treads, no decking");
  const rightLabels=[t("side leg (+X)"), t("blocking / nailers"),
    S.method==="boxes"?t("joists"):(tp.on?t("corner stringers"):t("hip stringer"))];
  const mL=52, mT=40, mB=52;
  const mR=Math.max(76, Math.max(...rightLabels.map(s=>estTextW(s,9)))+24);
  const scale=Math.min(7.5, 690/Math.max(footX+5,1));
  const W=Math.max(mL+(footX+5)*scale+mR, mL+estTextW(cap,9)+24), H=mT+(footY+5)*scale+mB;
  const X=x=>mL+x*scale, Y=y=>mT+y*scale;
  const poly=(pts,st)=>svgPoly(pts.map(p=>[X(p[0]),Y(p[1])]),st);
  const rect=(x0,y0,x1,y1,st)=>svgRect(X(x0),Y(y0),(x1-x0)*scale,(y1-y0)*scale,st);
  let s=svgOpen(W,H), topLayer="";
  // house wall, so the orientation matches the plan above at a glance
  s+=svgRect(X(0)-4,Y(-4),(footX+4)*scale+4,4*scale,MAT.wall);
  s+=svgText(X(1),Y(-4)+12,t("house wall"),'font-size="10" fill="#78838f"');
  if(S.faceX0==="wall") s+=svgRect(X(-4),Y(-4),4*scale,(footY+4)*scale,MAT.wall);

  /* ---- platform frame: rims, joists, and the legs under it ---- */
  if(S.includePlatform){
    const pf=platformModel(model);
    const pt=pf.frame.t;
    if(pf.needsLegs){
      const lw=pf.leg.w, lt=pf.leg.t;
      for(let i=0;i<pf.legCols;i++) for(let j=0;j<pf.legRows;j++){
        const x=Math.min(i*(Wx/(pf.legCols-1)), Wx-lw), y=Math.min(j*(Wy/(pf.legRows-1)), Wy-lt);
        s+=rect(x,y,x+lw,y+lt,MAT.post);
      }
    }
    if(pf.dir==="y"){                                  // joists run out from the wall
      for(let i=0;i<pf.joistCount;i++){
        const x=Math.min(i*(Wx/Math.max(1,pf.joistCount-1)), Wx-pt);
        s+=rect(x,pt,x+pt,Wy-pt,MAT.joist);
      }
    } else {
      for(let i=0;i<pf.joistCount;i++){
        const y=Math.min(i*(Wy/Math.max(1,pf.joistCount-1)), Wy-pt);
        s+=rect(pt,y,Wx-pt,y+pt,MAT.joist);
      }
    }
    s+=rect(0,0,Wx,pt,MAT.rim); s+=rect(0,Wy-pt,Wx,Wy,MAT.rim);      // rims along X
    s+=rect(0,pt,pt,Wy-pt,MAT.rim); s+=rect(Wx-pt,pt,Wx,Wy-pt,MAT.rim);
  } else s+=rect(0,0,Wx,Wy,MAT.plat);
  /* Left-anchored, not centred: in mm and French this label is 214px wide, and
     centred on a shallow platform it reached the side-leg stringer ids. */
  s+=svgText(X(2),Y(Wy/2)+3,t("platform frame {0} × {1}", L(Wx), L(Wy)),
    'font-size="10" fill="#33556e"');

  /* ---- the steps ---- */
  if(S.method==="boxes"){
    for(const lvl of model.levels){
      const k=lvl.k, bx=boxesForLevel(model,k);
      const cI=model.clip(k-1), cO=model.clip(k), m=tp.m;
      const yi=Wy+(k-1)*R, yo=Wy+k*R, xi=Wx+(k-1)*R, xo=Wx+k*R;
      // front leg band: joists first, then the rims over them
      const fOut=bx.legs[0].outer, fIn=bx.legs[0].inner;
      for(let i=0;i<bx.legs[0].joistCount;i++){
        const x=Math.min(i*bx.legs[0].joistSpacing, fOut-tk);
        if(x+tk > fIn+ (yo-yi-2*tk)*m) continue;       // past the joint: corner's ground
        s+=rect(x,yi+tk,x+tk,yo-tk,MAT.joist);
      }
      const sOut=bx.legs[1].outer, sIn=bx.legs[1].inner;
      for(let i=0;i<bx.legs[1].joistCount;i++){
        const y=Math.min(i*bx.legs[1].joistSpacing, sOut-tk);
        if(y+tk > sIn+(xo-xi-2*tk)*m) continue;
        s+=rect(xi+tk,y,xo-tk,y+tk,MAT.joist);
      }
      if(bx.diag){
        /* corner band: joists perpendicular to the 45° face, i.e. along the old
           hip direction, spaced across it */
        const half=cO*Math.SQRT2/2, u=k*R-cO/2;
        const n=Math.max(2,bx.diag.joistCount);
        for(let i=0;i<n;i++){
          const lat=-half+(i*(2*half)/Math.max(1,n-1));
          const hx=lat/Math.SQRT2, uIn=(k-1)*R-cI/2;
          const a=[Wx+uIn+hx+tk/2, Wy+uIn-hx+tk/2], b=[Wx+u+hx, Wy+u-hx];
          s+=poly([[a[0]-tk/2,a[1]+tk/2],[a[0]+tk/2,a[1]-tk/2],
                   [b[0]+tk/2,b[1]-tk/2],[b[0]-tk/2,b[1]+tk/2]],MAT.joist);
        }
      }
      // rims, mitered where they meet the corner
      s+=poly([[0,yo-tk],[fOut-tk*m,yo-tk],[fOut,yo],[0,yo]],MAT.rim);
      s+=poly([[0,yi],[fIn,yi],[fIn+tk*m,yi+tk],[0,yi+tk]],MAT.rim);
      s+=poly([[xo-tk,0],[xo,0],[xo,sOut],[xo-tk,sOut-tk*m]],MAT.rim);
      s+=poly([[xi,0],[xi+tk,0],[xi+tk,sIn+tk*m],[xi,sIn]],MAT.rim);
      if(bx.diag){
        const nn=tk/Math.SQRT2;
        s+=poly([[fOut,yo],[xo,sOut],[xo-nn,sOut-nn],[fOut-nn,yo-nn]],MAT.rim);
        if(!bx.diag.triangle)
          s+=poly([[fIn,yi],[xi,sIn],[xi+nn,sIn+nn],[fIn+nn,yi+nn]],MAT.rim);
      } else {
        s+=poly([[xi+tk,yi+tk],[xi+tk*3,yi+tk],[xi+tk,yi+tk*3]],MAT.block);
      }
      topLayer+=svgText(X(fOut*0.5),Y(yo)-4,levelTag(model,k),TAGSTYLE+' text-anchor="middle"');
    }
    for(const b of boxSupportBlocks(model)){
      const off=(b.legName==="front"?Wy:Wx)+(b.k-1)*R;
      for(let i=0;i<b.qty;i++){
        const p=Math.min(i*(b.inner/Math.max(1,b.qty-1)), b.inner-tk*2);
        if(b.legName==="front") s+=rect(p,off+tk,p+tk*2,off+tk*3,MAT.block);
        else s+=rect(off+tk,p,off+tk*3,p+tk*2,MAT.block);
      }
    }
  } else {
    for(const legName of ["front","side"]){
      const st=stringersForLeg(legName,model);
      for(const g of st.list){
        const start=(legName==="front"?Wy:Wx)+(g.kmin-1)*R;
        /* Same id placement as the plan view above — inside the footprint, not
           below it, where the overall width dimension label lives. */
        if(legName==="front"){
          s+=rect(g.pos-sT/2,start,g.pos+sT/2,footY-nose-model.riserT,MAT.rim);
          topLayer+=svgText(X(g.pos)+3,Y(footY)-4,g.id,STRTAG);
        } else {
          s+=rect(start,g.pos-sT/2,footX-nose-model.riserT,g.pos+sT/2,MAT.rim);
          topLayer+=svgText(X(footX)-4,Y(g.pos)-3,g.id,STRTAG+' text-anchor="end"');
        }
      }
    }
    const cs=cornerStringers(model);
    const reach=(N-1)*R;
    if(cs){
      for(const g of cs.list){
        const h=g.lateral/Math.SQRT2, u0=(g.kmin-1)*R, d=sT/2;
        s+=poly([[Wx+u0+h-d,Wy+u0-h-d],[Wx+u0+h+d,Wy+u0-h+d],
                 [Wx+reach+h+d,Wy+reach-h+d],[Wx+reach+h-d,Wy+reach-h-d]],MAT.rim);
        topLayer+=svgText(X(Wx+(u0+reach)/2+h)+5,Y(Wy+(u0+reach)/2-h)-5,g.id,STRTAG);
      }
    } else {
      const d=sT/2;
      s+=poly([[Wx-d,Wy-d],[Wx+d,Wy+d],[Wx+reach+d,Wy+reach+d],[Wx+reach-d,Wy+reach-d]],MAT.rim);
      topLayer+=svgText(X(Wx+reach/2)+5,Y(Wy+reach/2)-5,"H",STRTAG);
    }
    /* Level tags at the LEFT edge of each band, like a row header. Mid-leg they
       could land on any stringer — the stringers are vertical lines and the tag
       is horizontal, so some geometry always collides. Here the only neighbours
       are the other tags, and the rings are a full run apart in y. */
    for(const lvl of model.levels)
      topLayer+=svgText(X(1),Y(Wy+(lvl.k-0.45)*R),levelTag(model,lvl.k),TAGSTYLE);
  }

  /* ---- the two hips, on the joint lines, in BOTH framing methods ----
     One straight run each from the platform corner to the deck. */
  const ch=cornerHipStringers(model);
  if(ch){
    const d=(S.method==="boxes"?tk:sT)/2, cN=model.clip(N-1);
    for(const [a,b] of [[[Wx,Wy],[Wx+(N-1)*R-cN, Wy+(N-1)*R]],
                        [[Wx,Wy],[Wx+(N-1)*R, Wy+(N-1)*R-cN]]]){
      const vx=b[0]-a[0], vy=b[1]-a[1], ln=hyp(vx,vy)||1;
      const nx=-vy/ln*d, ny=vx/ln*d;
      s+=poly([[a[0]+nx,a[1]+ny],[b[0]+nx,b[1]+ny],[b[0]-nx,b[1]-ny],[a[0]-nx,a[1]-ny]],MAT.rim);
    }
    topLayer+=svgText(X(Wx+((N-1)*R-cN)*0.62)+4,Y(Wy+(N-1)*R*0.62)-4,"H1",STRTAG);
    topLayer+=svgText(X(Wx+(N-1)*R*0.62)+4,Y(Wy+((N-1)*R-cN)*0.62)-4,"H2",STRTAG);
  }
  s+=svgText(mL,Y(footY)+34,cap,'font-size="9" fill="#667"');
  s+=svgText(X(footX)+16,Y(footY*0.22),t("side leg (+X)"),'font-size="9" fill="#667"');
  s+=dimLineH(X(0),X(footX),Y(footY)+18,L(footX));
  s+=dimLineV(X(footX)+46,Y(0),Y(footY),L(footY));
  s+=topLayer;
  s+=scaleBarSVG(mL,H-12,scale);
  s+="</svg>";
  return declutterSVG(s);
}

function renderElevationSVG(model){
  /* Realistic section through the FRONT leg: u = distance out from the house
     wall, z = height above the existing deck surface. The platform is drawn
     cut short (break line) so the steps stay large and legible. */
  const P=sectionPieces(model);
  const {r,R,N,H,nose,Wy,base,deckT}=model;
  const joistD=7.25;                                    // existing deck joist, drawn only
  const pd=Math.min(Wy,18), shift=Wy-pd;
  const uMin=-5, uMax=pd+(N-1)*R+model.riserT+nose+P.rt+8;
  /* A stringer's plumb cut at the platform reaches bw·Ls/R below the first
     seat, which on a steep pitch dips below the deck framing. */
  const plumbLow = S.method==="stringers" ? (H-P.tt)-sk(S.stringerStock).w*hyp(r,R)/R : 0;
  const zMin=Math.min(-(deckT+joistD)-1, plumbLow-1), zMax=H+3;
  const scale=Math.min(7.5, 620/(uMax-uMin));
  /* Left margin has to hold the rise dimension and the bearing note, which are
     anchored to its right edge — size it from the actual text. */
  const dimLbl=t("H = {0}", L(H)), note1=t("framing only —"), note2=t("rise is unchanged");
  const footer=t("section through the front leg — the side leg is identical, using the platform's other dimension");
  const mL=Math.max(96, estTextW(dimLbl,10)+22, estTextW(note1,8.5)+18, estTextW(note2,8.5)+18);
  const mR=44, mT=22, mB=64;
  /* The connection note is anchored to the right of the platform face, so the
     canvas has to be wide enough for it too — it is the longest label in FR. */
  const cInf = S.method==="stringers" ? connectionInfo(model) : null;
  const connLbl = !cInf ? ""
    : cInf.bears ? t("bears {0} on the platform frame — no ledger needed", fmtIn(cInf.tab))
                 : t("plumb cut on the face — needs a ledger or hangers");
  const W=Math.max(mL+(uMax-uMin)*scale+mR, mL+estTextW(footer,9)+24,
                   mL+(pd-uMin)*scale+26+estTextW(connLbl,10)+12);
  const Ht=mT+(zMax-zMin)*scale+mB;
  const D=u=>u-shift, X=d=>mL+(d-uMin)*scale, Y=z=>mT+(zMax-z)*scale;
  const box=(u0,u1,z0,z1,st)=>svgRect(X(D(u0)),Y(z1),(u1-u0)*scale,(z1-z0)*scale,st);
  const boxD=(d0,d1,z0,z1,st)=>svgRect(X(d0),Y(z1),(d1-d0)*scale,(z1-z0)*scale,st);
  let s=svgOpen(W,Ht), tagLayer="";        // tags drawn last so nothing covers them
  s+=svgRect(X(uMin),Y(H+1),(0-uMin)*scale,(H+1-zMin)*scale,MAT.wall);
  s+=svgText(X(uMin)+3,Y(H+1)+12,t("house"),'font-size="9" fill="#78838f"');
  /* Existing deck: joists always, decking either full width or cut away where
     the new framing bears on the structure. */
  s+=boxD(uMin,uMax,-deckT-joistD,-deckT,MAT.exist);
  s+=svgText(X(uMax)-4,Y(-deckT-joistD)+12,t("existing deck joists"),'font-size="9" fill="#78838f" text-anchor="end"');
  const outerEdge=D(Wy+(N-1)*R+nose);
  if(base>0){
    s+=boxD(outerEdge,uMax,-deckT,0,MAT.exist);
    s+=svgLine(X(uMin),Y(0),X(outerEdge),Y(0),'stroke="#9aa6b2" stroke-width=".8" stroke-dasharray="4 3"');
    s+=svgText(X(uMin)+4,Y(0)-4,t("decking cut away — framing bears on the joists"),'font-size="8.5" fill="#8a6a45"');
    s+=svgText(X(uMax)-4,Y(-deckT)+11,t("existing decking {0}", fmtIn(deckT)),'font-size="8.5" fill="#78838f" text-anchor="end"');
  } else {
    s+=boxD(uMin,uMax,-deckT,0,MAT.exist);
    // above the deck line at the far right — clear of the run dimension below it
    s+=svgText(X(uMax)-4,Y(0)-6,t("existing deck surface"),'font-size="9" fill="#78838f" text-anchor="end"');
  }
  /* Floating platform: frame stock on edge at the top, legs of the same stock
     below — drawn as it is actually built, not as a solid block. */
  if(S.includePlatform){
    const pf=platformModel(model);
    const frameTop=H-P.st, frameBot=Math.max(-base, frameTop-pf.frameDepth);
    s+=box(Wy-pd,Wy,frameBot,frameTop,MAT.plat);
    if(pf.needsLegs){
      /* legs at their own stock's real width — a 4x4 post reads differently
         from frame stock on edge, which is the point of choosing it */
      const legT=Math.max(pf.leg.w,1);
      for(const lu of [Wy-pd+0.5, Wy-legT-0.5]) s+=box(lu,lu+legT,-base,frameBot,MAT.post);
      const midU=Wy-pd/2;
      if(pd>legT*6) s+=box(midU,midU+legT,-base,frameBot,MAT.post);
      s+=svgLead(X(D(Wy-legT-0.5))-2,Y((frameBot-base)/2),X(D(Wy-pd))+4,Y(-base)-6,
        t("{0} {1} legs @ {2}", pf.legCount, pf.legName, fmtIn(pf.legH)));
    }
  } else s+=box(Wy-pd,Wy,-base,H-P.st,MAT.plat);
  s+=svgLine(X(2),Y(-base),X(2),Y(H),'stroke="#5b87ad" stroke-width=".9" stroke-dasharray="5 3"');
  s+=svgText(X(3.5),Y(H)-5,(shift>0.5?t("platform {0} deep, shown cut", L(Wy)):t("platform")),'font-size="8.5" fill="#33556e"');
  if(S.method==="stringers"){
    const Ls=hyp(r,R), bw=sk(S.stringerStock).w;
    /* PROPORTIONS. The board's top edge is the nosing line — the line through
       the FRONT corner of every seat, i.e. (Wy+kR, H−kr−tt). Extrapolated back
       to the platform face that is H − tt, one riser ABOVE the first seat's
       back corner. Offsetting the lower edge from that back corner (the notch
       apex) instead is what drew a 2x12 as a plank: the apex line sits
       r·cosθ below the true edge, so the board came out bw + notch deep.
       Lower edge = bw perpendicular below the nosing line, which on a vertical
       cut is bw·Ls/R down. */
    const conn = connectionInfo(model);
    const tab = conn.tab;                                  // horizontal run back under the platform
    const edgeAtFace = H - P.tt;                           // nosing line at u = Wy
    const lowAtFace  = edgeAtFace - bw*Ls/R;               // lower edge at u = Wy
    const seatTop    = H - r - P.tt;                       // first seat = top of the plumb face
    /* The tab is cut LEVEL, at the material that is actually there (the nosing
       line at the face) or lower if the platform decking is thicker than the
       treads and it has to pass under. It is NOT the sloped nosing line carried
       on — that would tilt the top riser. */
    const tabTop = edgeAtFace - conn.lift;
    const pts=[];
    if(tab>0.01){
      pts.push([Wy-tab, tabTop]);
      pts.push([Wy,     tabTop]);
    }
    for(let k=1;k<=N-1;k++){ pts.push([Wy+(k-1)*R, H-k*r-P.tt]); pts.push([Wy+k*R, H-k*r-P.tt]); }
    pts.push([Wy+(N-1)*R, -base]);                         // bottom plumb face, down to bearing
    /* Level cut runs along the bearing plane to wherever the lower edge meets
       it; on a short flight the lower edge can reach bearing before the face. */
    const cutU = Wy + Math.max(0, lowAtFace+base)*R/r;
    pts.push([cutU, -base]);
    /* lower edge runs back to the face, or to the tab's far end when flush */
    const backU = Wy - tab, backLow = lowAtFace + tab*r/R;
    if(backLow > -base) pts.push([backU, backLow]);
    s+=svgPoly(pts.map(p=>[X(D(p[0])),Y(p[1])]),MAT.string);
    // highlight the bearing surface; its label goes in the open wedge below
    if(tab>0.01) s+=svgLine(X(D(Wy-tab)),Y(tabTop),X(D(Wy)),Y(tabTop),'stroke="#0f6fbf" stroke-width="1.8"');
    // the nosing line the notches are laid out from
    s+=svgLine(X(D(Wy)),Y(edgeAtFace),X(D(Wy+(N-1)*R)),Y(edgeAtFace-(N-1)*r),
      'stroke="#0f6fbf" stroke-width=".9" stroke-dasharray="4 3"');
    const plumbBot=Math.max(lowAtFace,-base);
    s+=svgLine(X(D(Wy)),Y(seatTop),X(D(Wy)),Y(plumbBot),'stroke="#6b5335" stroke-width="1.6"');
    // label sits BELOW the plumb base, in the open wedge under the stringer
    if(tab>0.01)
      s+=svgLead(X(D(Wy-tab/2)),Y(tabTop),X(D(Wy))+26,Y(plumbBot)+16,
        t("bears {0} on the platform frame — no ledger needed", fmtIn(tab)));
    else
      s+=svgLead(X(D(Wy)),Y((seatTop+plumbBot)/2),X(D(Wy))+26,Y(plumbBot)+16,
        t("plumb cut on the face — needs a ledger or hangers"));
    s+=svgText(X(D(Wy+(N-1)*R))-6,Y(-base)-7,t("cut stringer"),'font-size="9" fill="#6b5335" text-anchor="end"');
    if(base>0) s+=svgLead(X(D(Wy+(N-1)*R))-14,Y(-base/2),X(D(Wy+(N-1)*R))-20,Y(-deckT-joistD)+24,t("level cut bears on the joist"),"end");
  } else {
    for(const f of P.frames) s+=box(f.u0,f.u1,f.zBot,f.zTop,MAT.frame);
    for(const b of boxSupportBlocks(model)) if(b.legName==="front")
      s+=box(Wy+(b.k-1)*R, Wy+(b.k-1)*R+sk(S.frameStock).t*2, -base, b.height-base, MAT.block);
  }
  if(S.riserStyle==="closed") for(const ri of P.risers) s+=box(ri.u, ri.u+P.rt, ri.zBot, ri.zTop, MAT.riser);
  for(const tr of P.treads){
    for(const b of tr.bds) s+=box(b.u, b.u+b.w, tr.z-P.tt, tr.z, MAT.tread);
    tagLayer+=svgText(X(D(tr.u0))+3,Y(tr.z)-5,levelTag(model,tr.k)+" · "+L(tr.z),TAGSTYLE);
  }
  // name the two landings, so the numbered steps read unambiguously
  s+=svgText(X(D(Wy-pd))+5,Y(H)-16,t("platform = top landing"),'font-size="8.5" fill="#33556e"');
  // far left, below the deck line — the run dimension lives on the right
  s+=svgText(X(uMin)+4,Y(0)+13,t("deck = bottom landing"),'font-size="8.5" fill="#78838f"');
  /* Platform decking last: it is the top tread, so it overhangs by the nosing. */
  s+=box(Wy-pd,Wy+model.riserT+nose,H-P.st,H,MAT.platDeck);
  if(nose>0.01) s+=svgLead(X(D(Wy+model.riserT+nose/2)),Y(H-P.st/2),X(D(Wy))+16,Y(H)+14,t("platform nosing {0}", fmtIn(nose)));
  s+=dimLineV(X(uMin)-14,Y(H),Y(0),dimLbl,"left");
  if(base>0){
    s+=dimLineV(X(uMin)-14,Y(0),Y(-base),fmtIn(base),"left");
    s+=svgText(X(uMin)-14,Y(-base)+16,note1,'font-size="8.5" fill="#8a6a45" text-anchor="end"');
    s+=svgText(X(uMin)-14,Y(-base)+26,note2,'font-size="8.5" fill="#8a6a45" text-anchor="end"');
  }
  const lastT=P.treads[P.treads.length-1];
  if(lastT){
    /* Run is nosing to nosing — dimension it between the two nosing tips, not
       between frame faces (same length, but the frame reads as the wrong datum). */
    const tip=lastT.u0+model.Tb;
    s+=svgLine(X(D(tip)),Y(lastT.z-r*0.5),X(D(tip)),Y(0)+28,'stroke="#999" stroke-width=".6" stroke-dasharray="2 2"');
    s+=svgLine(X(D(tip-R)),Y(lastT.z+r*0.5),X(D(tip-R)),Y(0)+28,'stroke="#999" stroke-width=".6" stroke-dasharray="2 2"');
    s+=dimLineH(X(D(tip-R)),X(D(tip)),Y(0)+24,t("R = {0} nosing to nosing", L(R)));
    s+=dimLineV(X(D(lastT.u0+model.Tb))+20,Y(lastT.z),Y(lastT.z-r),t("r = {0}", L(r)));
    // nosing is measured from the riser FACE, not the frame
    if(nose>0.01) s+=dimLineH(X(D(lastT.u0+R+model.riserT)),X(D(lastT.u0+model.Tb)),Y(lastT.z)-14,L(nose));
  }
  s+=tagLayer;                             // level tags, above the boards
  s+=svgText(mL,Ht-24,footer,'font-size="9" fill="#78838f"');
  s+=scaleBarSVG(mL,Ht-8,scale);
  s+="</svg>";
  return declutterSVG(s);
}

/* ONE description of a stringer, used by both drawings and by the cut
   schedule, so the sheet and the numbers can never disagree.

   Two coordinate systems:
     profile — x runs out along the stair, y up. The nosing line is y = x·r/R.
     board   — x' along the board from the end you start at, y' down from the
               TOP EDGE, which IS the nosing line:
                   x' = (x·R + y·r)/Ls      y' = (x·r − y·R)/Ls
               so every notch is the same right triangle sitting on the top
               edge, its hypotenuse Ls long, one Ls apart.

   The bottom end is a plumb face `drop` below the bottom seat, then a LEVEL cut
   that bears flat — it runs horizontally to the board's lower edge, it is not a
   line to the corner of the board. */
function stringerBoardLayout(c,r,R,drop,bw,topRun,topLift){
  const Ls=hyp(r,R), ux=R/Ls, uy=r/Ls, px=uy, py=-ux;  // px,py = perpendicular, below the nosing line
  const lift = topRun>0 ? (topLift||0) : 0;
  /* WITHOUT A TAB THE LAST NOTCH HAS NO RISER FACE. The topmost triangle taken
     off the edge has its vertical leg in the very plane the board is cut off
     in, so the wedge above the top seat is not material — approach the apex
     (c·R, c·r) from inside the board and there is nothing there. The board's
     top corner is the top SEAT's back corner, (c·R, (c−1)·r), and one plumb cut
     runs from it down to the lower edge. Carrying the outline up to the apex
     and back down the same line drew a zero-width spike above the board — the
     thin vertical line — and made the board r²/Ls (≈4" at 7/11) too long. */
  const topRiser = topRun>0;
  const notch=[[0,0]];
  for(let i=0;i<c;i++){
    notch.push([(i+1)*R, i*r]);                                   // seat, out to the riser plane
    if(i<c-1 || topRiser) notch.push([(i+1)*R,(i+1)*r]);          // riser face, up
  }
  /* Flush tab: THERE the last riser face is real — it is the front of the tab —
     and stays plumb at x=c*R, after which the top edge runs back LEVEL.
     Sloping it (a straight continuation of the nosing line) would draw an
     angled top riser: not buildable, and it could not pass under the decking. */
  if(topRiser){ if(lift>0.001) notch.push([c*R, c*r-lift]); notch.push([c*R+topRun, c*r-lift]); }
  const tipX=c*R+(topRun>0?topRun:0), tipY=topRiser ? c*r-lift : (c-1)*r;
  const t1=(tipX-bw*px)/ux,  lowTip=bw*py+t1*uy;         // lower edge under the top end
  const t0=(-drop-bw*py)/uy, lowCut=bw*px+t0*ux;         // where the bottom level cut meets it
  const lowAt0=-bw*Ls/R;                                 // lower edge at the bottom plumb face
  /* Two ways a board and a stair can be mismatched, both of which used to make
     the outline cross itself:
       - too SHORT: a one-notch jack out of a 2x12 is deeper than its own run,
         so the lower edge dives past the bearing plane before the top cut and
         the level cut has to stop AT the plumb cut;
       - too NARROW: the lower edge never gets down to the bearing plane, so
         there is no level cut at all and the board's bottom is its own edge —
         it needs packing up, which `reachesBearing` reports. */
  const reachesBearing = lowAt0 <= -drop + 1e-9;
  const botY = reachesBearing ? -drop : lowAt0;
  const aLow=[tipX, Math.max(lowTip, botY)];
  const bLow=[reachesBearing ? Math.min(Math.max(lowCut,0), tipX) : 0, botY];
  const bottom = (Math.abs(aLow[0]-bLow[0])<1e-9 && Math.abs(aLow[1]-bLow[1])<1e-9) ? [aLow] : [aLow, bLow];
  const outline=notch.concat(bottom, bLow[0]>1e-9 ? [[0,botY]] : []);
  const B = p => [(p[0]*R + p[1]*r)/Ls, (p[0]*r - p[1]*R)/Ls];
  const raw = outline.map(B);
  const startOff = -Math.min(...raw.map(p=>p[0]));       // first mark, from the board end
  const board = raw.map(p=>[p[0]+startOff, p[1]]);
  return {Ls, lift, px, py, ux, uy, outline, board, B, startOff,
          req: Math.max(...board.map(p=>p[0])),
          tipX, tipY, aLow, bLow,
          notchDepth: r*R/Ls,        // perpendicular bite, from the top edge
          setback:    r*r/Ls,        // riser cut, back from its mark on the top edge
          topRiser, reachesBearing, botY,
          cutsThrough: bw <= r*R/Ls + 1e-9,   // notch deeper than the board: not a stringer at all
          /* Height of the top plumb cut: down from the tab's back corner, or —
             with no tab — down from the top seat, so one rise shorter. Measured
             off the clamped lower edge, so a short board reports what it is. */
          topPlumb:   tipY - aLow[1],
          bottomLevel: bLow[0],      // length of the bottom bearing cut
          pitchDeg: Math.atan2(r,R)*180/Math.PI};
}

function stringerProfileSVG(c,r,R,drop,bw,title,topRun,topLift){
  if(c<=0) return "<p>"+t("No notches to draw.")+"</p>";
  const Ls=hyp(r,R);
  const lay=stringerBoardLayout(c,r,R,drop,bw,topRun,topLift);
  /* A notch deeper than the board is not a stringer — drawing it would produce
     a shape that cannot exist. Say so instead; the Framing tab already errors. */
  if(lay.cutsThrough) return '<div class="msg e">'
    +t("Not drawn: at rise {0} on a run of {1} the notch is {2} deep, which cuts clean through a {3} board ({4}). Use wider stock for this one.",
       fmtIn(r), fmtIn(R), fmtIn(lay.notchDepth), S.stringerStock, fmtIn(bw))+"</div>";
  const px=lay.px, py=lay.py, lift=lay.lift;
  const tipX=lay.tipX, tipY=lay.tipY, outline=lay.outline;
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  /* The nosing line and its last mark are drawn too, and without a tab they run
     PAST the board — mark c sits on the offcut side of the plumb cut — so the
     frame has to be sized from them, not from the outline alone. */
  for(const [x,y] of outline.concat([[c*R, c*r]])){
    x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y); }
  /* Title lives in its own band at the TOP, the explanation of the top cut in
     its own band at the BOTTOM, so neither can collide with the drawing. The
     cut labels on the geometry stay terse — the cut schedule below the sheet
     carries the full wording. */
  const topLbl = topRun>0 ? t("level cut {0}", fmtIn(topRun)) : "";
  const tipLbl = t("plumb cut {0}", fmtIn(Math.max(0,lay.topPlumb)));
  const foot   = topRun>0
    ? t("top: the level cut bears on the platform frame — the last riser face stays plumb")
    : t("top: a plumb cut — nothing bears on it, see the cut schedule below");
  const margin=36, mT=44, mB=60, scale=Math.min(8, 660/Math.max(1,x1-x0));
  const Xat=x=>margin+(x-x0)*scale;
  const W=Math.max((x1-x0)*scale+2*margin+40,
                   margin+estTextW(title,10)+24,
                   margin+estTextW(foot,8.5)+24,
                   Xat(tipX)+4+estTextW(tipLbl,8.5)+8,
                   topRun>0 ? Xat(c*R)+3+estTextW(topLbl,8.5)+8 : 0);
  const H=(y1-y0)*scale+mT+mB;
  const X=Xat, Y=y=>mT+(y1-y)*scale;
  let s=svgOpen(W,H);
  // board outline: lower edge, bottom plumb face + level cut, top plumb cut
  s+=svgPoly(outline.map(p=>[X(p[0]),Y(p[1])]),MAT.string);
  /* Notch profile drawn heavy — this is the cut line. It stops at the last
     SEAT when there is no tab: that seat's back corner is the top of the board,
     and the riser cut there is the plumb cut, drawn as part of the outline. */
  let path="M"+X(0).toFixed(1)+" "+Y(0).toFixed(1);
  for(let i=0;i<c;i++){
    path+=" H"+X((i+1)*R).toFixed(1);
    if(i<c-1 || lay.topRiser) path+=" V"+Y((i+1)*r).toFixed(1);
  }
  s+='<path d="'+path+'" fill="none" stroke="#654" stroke-width="2"/>';
  // nosing line + a layout tick at every notch corner (spacing = Ls along the edge)
  s+=svgLine(X(0),Y(0),X(c*R),Y(c*r),'stroke="#0f6fbf" stroke-width="1" stroke-dasharray="3 3"');
  for(let i=0;i<=c;i++){
    const tx=i*R, ty=i*r;
    s+=svgLine(X(tx),Y(ty),X(tx+2.2*px),Y(ty+2.2*py),'stroke="#0f6fbf" stroke-width="1.2"');
    if(i<c) s+=svgText(X(tx+R/2),Y(ty+r/2)-2,String(i+1),'font-size="9" fill="#0f6fbf" text-anchor="middle"');
  }
  s+=svgText(margin,16,title,'font-size="10" fill="#333"');
  s+=svgText(X(0)-2,Y(lay.botY)+13,
    lay.reachesBearing ? t("level cut — bears here, drop {0}", fmtIn(drop))
                       : t("board too narrow to reach the bearing plane — pack it up {0}", fmtIn(-drop-lay.botY)),
    'font-size="8.5" fill="#a55"');
  if(topRun>0){
    /* the tab's top is LEVEL — draw it heavy so the plumb last riser reads */
    s+=svgLine(X(c*R),Y(c*r-lift),X(tipX),Y(tipY),'stroke="#0f6fbf" stroke-width="2"');
    s+=svgText(X(c*R)+3,Y(c*r-lift)-6,topLbl,'font-size="8.5" fill="#0f6fbf"');
  }
  s+=svgText(X(tipX)+4,Y(tipY)+13,tipLbl,'font-size="8.5" fill="#a55"');
  s+=svgText(margin,H-26,foot,'font-size="8.5" fill="#78838f"');
  s+=scaleBarSVG(margin, H-10, scale);
  s+="</svg>";
  return declutterSVG(s);
}
/* The same stringer seen ON THE BOARD you buy: the stock laid flat, the cut
   nested inside it, and the offcut at the end. Profile coords are rotated into
   board coords, where the nosing line IS the board's top edge:
       x' = (u·R + z·r)/Ls        y' = (u·r − z·R)/Ls
   so every notch is a triangle on the top edge, one Ls apart. */
function stringerStockSVG(c,r,R,drop,bw,stockLen,title,copies,topRun,topLift){
  if(c<=0) return "";
  const Ls=hyp(r,R);
  const lay=stringerBoardLayout(c,r,R,drop,bw,topRun,topLift);
  if(lay.cutsThrough) return "";                  // the profile sheet explains why
  const x0=lay.startOff, pts=lay.board, req=lay.req;
  /* Without a tab the last mark lands on the OFFCUT side of the plumb cut, so
     it can sit past the cut length — the board has to be drawn wide enough to
     show it, or the tick runs off the canvas. */
  const total=Math.max(stockLen||0, req, x0+c*Ls);
  const kerf=S.kerf||0;
  /* How many of THIS stringer come out of one board — otherwise the sheet
     implies a whole board per stringer while the cut list packs several. */
  const nFit=Math.max(1, Math.min(copies||1, Math.floor((total+kerf)/(req+kerf))));
  const used=nFit*req+(nFit-1)*kerf;
  const waste=total-used;
  const sc=Math.min(6.5, 680/Math.max(total,1));
  const mL=46, mR=30, mT=40, mB=52;
  const W=Math.max(mL+total*sc+mR, mL+estTextW(title,10)+24), H=mT+bw*sc+mB;
  const X=x=>mL+x*sc, Y=y=>mT+y*sc;
  let s=svgOpen(W,H);
  // the board you buy
  s+=svgRect(X(0),Y(0),total*sc,bw*sc,'fill="#f2ede4" stroke="#9d8f7a" stroke-width="1"');
  for(let n=0;n<nFit;n++){
    const dx=n*(req+kerf);
    s+=svgPoly(pts.map(p=>[X(p[0]+dx),Y(p[1])]),MAT.string);
    if(n>0) s+=svgLine(X(dx-kerf/2),Y(0),X(dx-kerf/2),Y(bw),'stroke="#a55" stroke-width="1" stroke-dasharray="2 2"');
    // layout marks along the top edge, every Ls
    for(let i=0;i<=c;i++){
      const xm=dx+x0+i*Ls;
      s+=svgLine(X(xm),Y(0),X(xm),Y(0)-9,'stroke="#0f6fbf" stroke-width="1.2"');
      if(n===0) s+=svgText(X(xm),Y(0)-12,L(i*Ls),'font-size="8" fill="#0f6fbf" text-anchor="middle"');
      if(i<c) s+=svgText(X(xm+Ls/2),Y(r*R/Ls*0.6),String(i+1),'font-size="10" fill="#0f6fbf" text-anchor="middle"');
    }
  }
  if(waste>0.5){
    s+=svgRect(X(used),Y(0),waste*sc,bw*sc,'fill="#e8e2d6" stroke="#bfae95" stroke-dasharray="3 2"');
    /* A thin offcut leaves no room for its own label — keep the text inside the
       canvas rather than centred on a 1-1/2" strip at the very end. */
    const oLbl=t("offcut {0}", L(waste)), oW=estTextW(oLbl,9);
    const oCx=Math.min(Math.max(X(used+waste/2), oW/2+4), W-oW/2-4);
    s+=svgText(oCx,Y(bw/2)+3,oLbl,'font-size="9" fill="#8a7a5f" text-anchor="middle"');
  }
  s+=svgText(X(0),Y(0)-24,t("marks along the top edge, every {0} — first mark {1} from the left end", L(Ls), L(x0)),'font-size="8.5" fill="#0f6fbf"');
  s+=dimLineH(X(0),X(req),Y(bw)+20,t("cut length {0}", L(req)));
  s+=dimLineH(X(0),X(total),Y(bw)+38,
    nFit>1 ? t("buy {0} — {1} per board", L(total), nFit) : t("buy {0}", L(total)));
  s+=svgText(mL,H-8,title,'font-size="10" fill="#333"');
  s+="</svg>";
  return declutterSVG(s);
}
/* ---------- 18g. every run at the corner, and where it comes from ---------
   Three different "runs" live at a corner and they are measured along three
   different directions. All three come out of the SAME ring growth — the ring
   advances R in y, and (R − dc) in x once the clip is eating into it — so each
   is just that growth resolved along a different line:

     leg        R                measured square to the leg face
     hip        hyp(R − dc, R)   measured along the joint line
     face       (2R − dc)/√2     measured square to the 45 degree face

   The face one is the perpendicular gap between consecutive face lines
   x + y = S_k, where S_k = Wx + Wy + 2kR − c_k. Consecutive S differ by
   2R − dc, and a gap of ΔS between two lines of slope −1 is ΔS/√2.

   Set dc = 0 and all of it collapses: hyp(R,R) = 2R/√2 = R√2, the square
   corner's single hip. Which is the whole point — R√2 is 1.414× the leg run and
   395 mm at 7/11, over the code max, and dc > 0 is what pulls it back. */
function cornerRuns(model){
  const R=model.R, r=model.r, dc=model.taper.dc, bw=sk(S.stringerStock).w;
  const mk=(key,label,run,dx,dy,note)=>{
    const nd = r*run/hyp(r,run);
    return {key,label,run,dx,dy,note, ratio:run/R, mm:run*MM,
            notch:nd, throat:bw-nd, minBoard:nd+S.throatMin,
            fits: bw >= nd+S.throatMin-1e-9,
            codeOK: run*MM>=CODE.runMin && run*MM<=CODE.runMax};
  };
  const rows=[mk("leg", t("Leg step — the normal run"), R, R, 0,
                 t("square to the leg face, nosing tip to nosing tip"))];
  if(model.taper.on){
    rows.push(mk("hip", t("Corner hips H1 H2 — {0}° in plan", dec(model.taper.sawDeg.toFixed(1))),
      hyp(R-dc,R), R-dc, R, t("along the joint line: the ring grows {0} in x and {1} in y", fmtIn(R-dc), fmtIn(R))));
    rows.push(mk("face", t("Corner face — the step depth at the corner"), model.taper.g, null, null,
      t("square to the 45° face: consecutive face lines x+y=S are {0} apart in S, and ÷√2 gives the perpendicular gap", fmtIn(2*R-dc))));
    rows.push(mk("sqhip", t("(a square corner's single 45° hip, for comparison)"), R*Math.SQRT2, R, R,
      t("the same formulas at clip growth 0 — hyp(R,R) = 2R/√2 = R√2")));
  } else {
    rows.push(mk("sqhip", t("Hip H — 45° in plan"), R*Math.SQRT2, R, R,
      t("along the diagonal: the ring grows {0} in x AND {0} in y, so the hip covers hyp of the two", fmtIn(R))));
  }
  return rows;
}
function cornerRunsHTML(model){
  const rows=cornerRuns(model);
  /* Notch and throat only mean something for stringers; a box frame has neither. */
  const str = S.method==="stringers";
  let h='<h3>'+t("Runs at the corner — where each number comes from")+'</h3>'
    +'<div class="note">'+t("Three different runs live at a corner, measured along three different directions, and all of them come out of the same ring growth: the ring advances R square to the leg face, and R − dc along it once the clip is eating in. Set the clip growth to 0 and every one of them collapses to R×√2 — the square corner's single hip. That is exactly what a taper is for.")+'</div>'
    +'<table class="cuts"><thead><tr><th>'+t("What")+'</th><th>'+t("Formula")+'</th><th>'+t("Run")+'</th><th>×R</th>'
    +(str?'<th>'+t("Notch")+'</th><th>'+t("Throat in a {0}", S.stringerStock)+'</th>':'')
    +'<th>'+t("Measured how")+'</th></tr></thead><tbody>';
  const FORM={leg:"R", hip:"hyp(R − dc, R)", face:"(2R − dc) ÷ √2", sqhip:"R × √2"};
  for(const x of rows){
    h+="<tr><td>"+x.label+"</td><td>"+FORM[x.key]+"</td>"
      +"<td>"+LD(x.run)+" <span class='dec'>"+dec(Math.round(x.mm))+" mm</span>"
        +(x.codeOK?"":' <span class="pill rip">'+t("outside code")+"</span>")+"</td>"
      +"<td>×"+dec(x.ratio.toFixed(3))+"</td>"
      +(str?"<td>"+fmtIn(x.notch)+"</td>"
        +"<td>"+fmtIn(x.throat)+(x.fits?' <span class="pill ok">'+t("ok")+"</span>":' <span class="pill rip">'+t("needs {0}", fmtIn(x.minBoard))+"</span>")+"</td>":"")
      +'<td class="tl">'+x.note+"</td></tr>";
  }
  return h+"</tbody></table>";
}

/* ---------- 18h. plan cuts on a stringer that sits at an angle -------------
   A leg stringer is square to its face, so every cut on it is square in plan:
   the seats, the riser faces, the bottom, all of it. A corner or hip stringer
   sits at an angle, and exactly ONE thing about it stops being square — and
   only for some connection types.

   THE NOTCHES ARE STILL SQUARE. A seat is a horizontal cut and a riser face is
   a vertical one, both straight across the board. It makes no difference that
   the tread landing on the seat arrives at 45 degrees. Same for the bottom
   level cut: it bears flat on the deck, square across. That is worth saying out
   loud, because it is the part people expect to be complicated.

   What is NOT square is where the board meets the PLATFORM, and even that
   depends on how it gets there:

     top tread down : the board butts the platform's outside corner from
                      outside. Its end has to be cut to that corner, which is a
                      90 degree vee — the two faces of the vee ARE the two
                      platform faces. Its apex sits at the corner point, at
                      mid-thickness, and the two saw settings come out as
                      phi and 90 - phi where phi is the board's plan angle.
     flush half/full: the board rides OVER the rim, like a rafter over a plate,
                      and its tab ends in free air inside the platform. Nothing
                      butts anything, so nothing needs a plan bevel at all. */
function stringerPlanCuts(model, planDeg, lay, topRun){
  const th=sk(S.stringerStock).t, phi=planDeg*Math.PI/180;
  const bevels = !(topRun>0);          // a flush tab rides over — no bevel
  return {
    planDeg, th, bevels,
    sawFront: planDeg,                 // the face lying along the platform's front
    sawSide: 90-planDeg,               // the face lying along its side
    hornFront: th/2*Math.tan(phi),     // how far that edge reaches past the apex
    hornSide:  Math.tan(phi)>1e-9 ? th/2/Math.tan(phi) : 0,
    sawReach: Math.max(planDeg, 90-planDeg) <= 60,
    /* where it is: the board's very top end when it butts, measured from the
       bottom end along the board */
    at: lay.req, atMark: lay.startOff + (lay.req-lay.startOff)
  };
}
/* The board seen FROM ABOVE: a strip length × thickness, so an angled end cut
   shows as a line across the thickness. Full length on top, then the end
   enlarged with the platform corner it has to fit. */
function stringerTopViewSVG(model, g){
  const th=sk(S.stringerStock).t;
  const lay=stringerBoardLayout(g.c,g.r,g.R,g.drop,g.bw,g.topRun,g.topLift);
  const pc=stringerPlanCuts(model, g.planDeg, lay, g.topRun);
  const BL=lay.req;                                   // board length; L() is the formatter
  /* The end profile. The apex sits ON the platform's corner point at
     mid-thickness; each edge reaches past it by its own horn, so the profile is
        (0,0) → (A+hornSide, 0) → (A, th/2) → (A+hornFront, th) → (0, th)
     with A = BL − the longer horn. At 45° both horns are th/2 and it is the
     symmetric vee everyone expects; at 22.5° it is lopsided. */
  const A = BL - Math.max(pc.hornSide, pc.hornFront);
  const endProfile = pc.bevels
    ? [[0,0],[A+pc.hornSide,0],[A,th/2],[A+pc.hornFront,th],[0,th]]
    : [[0,0],[BL,0],[BL,th],[0,th]];
  /* never let a missing label print "undefined" into a drawing */
  const title=t("{0} — top view, the board seen from above ({1} thick)", g.name||t("stringer"), fmtIn(th));
  const foot=pc.bevels
    ? t("The top end butts the platform's outside corner, so it is a 90° vee — and the two saw settings come out {0}° and {1}°. Everything else on this board is square across.",
        dec(pc.sawSide.toFixed(1)), dec(pc.sawFront.toFixed(1)))
    : t("A flush tab rides OVER the platform rim, like a rafter over a plate, so nothing butts anything — every cut on this board is square across, exactly like a leg stringer.");
  const mL=58, mR=54, mT=36, gap=52, mB=66;
  const sc=Math.min(6.5, 620/Math.max(BL,1));
  const stripH=Math.max(th*sc, 10);
  const ext=Math.max(pc.hornSide,pc.hornFront)+th*1.6;   // how much of the end to enlarge
  const dsc=Math.min(30, 260/Math.max(ext+th*1.4,1));
  const detTop=mT+stripH+gap, detH=th*dsc*2.6;
  const W=Math.max(mL+BL*sc+mR, mL+estTextW(title,10)+24, mL+estTextW(foot,8.5)+24, 460);
  const H=detTop+detH+mB;
  const X=x=>mL+x*sc, Y=y=>mT+y*sc;
  let s=svgOpen(W,H);
  s+=svgText(mL,16,title,'font-size="10" fill="#333"');
  /* ---- the whole board, from above ---- */
  s+=svgPoly(endProfile.map(p=>[X(p[0]),Y(p[1])]),MAT.string);
  for(let i=0;i<=g.c;i++){
    const xm=lay.startOff+i*lay.Ls;
    if(xm>BL+0.01) continue;
    s+=svgLine(X(xm),Y(0),X(xm),Y(0)-7,'stroke="#0f6fbf" stroke-width="1.1"');
  }
  s+=svgText(X(0),Y(0)-11,t("every notch is square across the board — the {0}° is only in plan", dec(g.planDeg.toFixed(1))),'font-size="8.5" fill="#0f6fbf"');
  s+=svgText(X(0)-4,Y(th/2)+3,t("foot"),'font-size="8.5" fill="#78838f" text-anchor="end"');
  s+=svgText(X(BL)+6,Y(th/2)+3,t("platform"),'font-size="8.5" fill="#78838f"');
  s+=dimLineH(X(0),X(BL),Y(th)+20,t("cut length {0}", L(BL)));
  if(pc.bevels) s+=dimLineH(X(A),X(BL),Y(th)+38,t("the vee, {0} deep", L(BL-A)));
  /* ---- the top end, enlarged ---- */
  const DX=x=>mL+30+x*dsc, DY=y=>detTop+th*dsc*0.8+y*dsc;
  s+=svgText(mL,detTop-8,pc.bevels
      ? t("top end enlarged — the apex lands on the platform's corner point, at mid-thickness")
      : t("top end enlarged — square across; it simply lies on top of the rim"),'font-size="9" fill="#667"');
  if(pc.bevels){
    // the platform's 90° corner, which IS the shape of the vee
    s+=svgPoly([[DX(ext),DY(th/2)],[DX(ext+th*1.3),DY(th/2)],[DX(ext+th*1.3),DY(th*1.9)],
                [DX(ext-pc.hornFront+pc.hornFront),DY(th*1.9)]].map(p=>p),MAT.plat);
    s+=svgText(DX(ext+4),DY(th*1.9)+13,t("platform frame — its corner is the vee"),'font-size="8.5" fill="#33556e"');
    s+=svgPoly([[DX(0),DY(0)],[DX(ext-Math.max(pc.hornSide,pc.hornFront)+pc.hornSide),DY(0)],
                [DX(ext-Math.max(pc.hornSide,pc.hornFront)),DY(th/2)],
                [DX(ext-Math.max(pc.hornSide,pc.hornFront)+pc.hornFront),DY(th)],
                [DX(0),DY(th)]],MAT.string);
    const ax=ext-Math.max(pc.hornSide,pc.hornFront);
    s+=svgLine(DX(ax+pc.hornSide),DY(0),DX(ax),DY(th/2),'stroke="#a55" stroke-width="2.2"');
    s+=svgLine(DX(ax),DY(th/2),DX(ax+pc.hornFront),DY(th),'stroke="#a55" stroke-width="2.2"');
    s+=svgLead(DX(ax+pc.hornSide/2),DY(th/4),DX(ext+th*1.5),DY(-th*0.5),
      t("{0}° — this face lies on the side rim", dec(pc.sawSide.toFixed(1))));
    s+=svgLead(DX(ax+pc.hornFront/2),DY(th*0.75),DX(ext+th*1.5),DY(th*1.3),
      t("{0}° — this face lies on the front rim", dec(pc.sawFront.toFixed(1))));
    s+=svgText(DX(ax)-5,DY(th/2)+3,t("apex"),'font-size="8.5" fill="#a55" text-anchor="end"');
    if(!pc.sawReach) s+=svgText(DX(0),DY(th)+22,
      t("{0}° is past a mitre saw — cut that face by hand or notch it", dec(Math.max(pc.sawSide,pc.sawFront).toFixed(1))),
      'font-size="8.5" fill="#b45309"');
  } else {
    s+=svgPoly([[DX(0),DY(0)],[DX(ext),DY(0)],[DX(ext),DY(th)],[DX(0),DY(th)]],MAT.string);
    s+=svgLine(DX(ext),DY(0),DX(ext),DY(th),'stroke="#a55" stroke-width="2.2"');
    s+=svgLead(DX(ext),DY(th/2),DX(ext)+22,DY(-th*0.4),t("90° — square across"));
  }
  s+=svgText(mL,H-24,foot,'font-size="8.5" fill="#78838f"');
  s+=scaleBarSVG(mL,H-8,sc);
  s+="</svg>";
  return declutterSVG(s);
}
/* The plan cuts as a table: where, at what angle, against what. */
function planCutsHTML(model, g){
  const lay=stringerBoardLayout(g.c,g.r,g.R,g.drop,g.bw,g.topRun,g.topLift);
  const pc=stringerPlanCuts(model, g.planDeg, lay, g.topRun);
  const rows=[];
  if(pc.bevels){
    rows.push([t("Top end, side-rim face"), t("at the very end, {0} from the foot", L(lay.req)),
      dec(pc.sawSide.toFixed(1))+"°", t("lies flat on the platform's SIDE rim; this edge runs {0} past the apex", fmtIn(pc.hornSide))]);
    rows.push([t("Top end, front-rim face"), t("meets the first at the apex, {0} back", L(Math.max(pc.hornSide,pc.hornFront))),
      dec(pc.sawFront.toFixed(1))+"°", t("lies flat on the platform's FRONT rim; this edge runs {0} past the apex", fmtIn(pc.hornFront))]);
  } else {
    rows.push([t("Top end (back of the tab)"), t("at the very end, {0} from the foot", L(lay.req)),
      "90°", t("free end, inside the platform footprint — nothing to fit, so square is right")]);
  }
  rows.push([t("Every notch — seats and riser faces"), t("at each layout mark"), "90°",
    t("a seat is horizontal and a riser face is vertical, both straight across. That the tread lands on it at {0}° changes nothing.", dec(g.planDeg.toFixed(1)))]);
  rows.push([t("Bottom level cut"), t("at the foot"), "90°", t("bears flat on the deck, square across")]);
  let h='<h5>'+t("Plan cuts — what is NOT square, and where")+'</h5>'
    +'<table class="cuts"><thead><tr><th>'+t("Cut")+'</th><th>'+t("Where")+'</th><th>'+t("Plan angle")+'</th><th>'+t("Why")+'</th></tr></thead><tbody>';
  rows.forEach(rw=>{ h+="<tr><td>"+rw[0]+"</td><td>"+rw[1]+"</td><td><b>"+rw[2]+"</b></td><td>"+rw[3]+"</td></tr>"; });
  h+="</tbody></table>";
  if(pc.bevels && !pc.sawReach)
    h+='<div class="msg w">'+t("{0}° is past the range of a mitre saw (about 60°). Cut the {1}° face on the saw and the other by hand, or notch the end instead — it only has to clear the rim, not look pretty.",
        dec(Math.max(pc.sawSide,pc.sawFront).toFixed(1)), dec(Math.min(pc.sawSide,pc.sawFront).toFixed(1)))+'</div>';
  return h+'<div class="svgwrap">'+stringerTopViewSVG(model,g)+"</div>";
}

/* Trade names, and why a corner stair has three kinds: the stringers that reach
   the platform run the whole flight (COMMON); the miter cuts the ones nearer
   the corner short, so they carry fewer notches (JACK); the diagonal at the
   outside corner is the HIP. */
function stringerRole(legName, kmin){
  return kmin===1 ? t("common stringer ({0} leg)", t(legName))
                  : t("jack stringer ({0} leg), from level {1} down", t(legName), kmin);
}
const notchCount = c => c===1 ? t("1 notch") : t("{0} notches", c);
/* F1, F2, F3, F4, F5 -> F1–F5; anything not a plain run stays a list */
function idRange(ids){
  if(ids.length<3) return ids.join(", ");
  const p=ids[0].replace(/\d+$/,""), num=ids.map(x=>parseInt(x.slice(p.length),10));
  const run=num.every((v,i)=>i===0 || v===num[i-1]+1) && ids.every(x=>x.startsWith(p));
  return run ? ids[0]+"–"+ids[ids.length-1] : ids.join(", ");
}

/* The numbers you actually cut to, in the order you cut them. Everything here
   comes out of stringerBoardLayout(), the same function that draws the two
   sheets above it, so a number can never contradict a drawing. */
function cutScheduleHTML(model, g){
  const {c,r,R,Ls,drop,bw,topRun,topLift,reqLen,boardLen,notchDepth,throat,minWidth,qty,name,hip} = g;
  const lay = stringerBoardLayout(c,r,R,drop,bw,topRun,topLift);
  const tt = sk(S.treadStock).t;
  const flush = topRun>0;
  const markEnd = lay.startOff + c*Ls;                 // last mark, from the board end
  const past = lay.req - markEnd;                      // signed: negative when the mark is on the offcut

  let h = "<h5>"+t("Cut schedule — {0}{1}", name, qty>1?t(" × {0}", qty):"")+"</h5>";

  h += '<div class="cutgrid"><div class="kv">'
    +"<dt>"+t("Framing square")+"</dt><dd>"+t("rise {0} on the tongue, run {1} on the blade", fmtIn(r), fmtIn(R))+"</dd>"
    +"<dt>"+t("Mark spacing on the top edge")+"</dt><dd>"+LD(Ls)+" "+t("(the diagonal)")+"</dd>"
    +"<dt>"+t("Pitch")+"</dt><dd>"+dec(lay.pitchDeg.toFixed(1))+"°</dd>"
    +"<dt>"+t("Notch bite from the top edge")+"</dt><dd>"+LD(notchDepth)+"</dd>"
    +"<dt>"+t("Riser cut, back from its mark")+"</dt><dd>"+LD(lay.setback)+' <span class="pill">r²/'+t("diagonal")+"</span></dd>"
    +"<dt>"+t("Throat left")+"</dt><dd>"+fmtIn(throat)
      +(throat<S.throatMin?' <span class="pill rip">'+t("below your {0} minimum", fmtIn(S.throatMin))+"</span>"
                          :' <span class="pill ok">'+t("ok")+"</span>")+"</dd>"
    +"</div><div class=\"kv\">"
    +"<dt>"+t("Board")+"</dt><dd>"+S.stringerStock+" — "+t("{0} wide", fmtIn(bw))+"</dd>"
    +"<dt>"+t("Minimum width for this pitch")+"</dt><dd>"+fmtIn(minWidth)+"</dd>"
    +"<dt>"+t("First mark, from the bottom end")+"</dt><dd>"+LD(lay.startOff)+"</dd>"
    +"<dt>"+t("Last mark, from the bottom end")+"</dt><dd>"+LD(markEnd)+"</dd>"
    +"<dt>"+t("Material past the last mark")+"</dt><dd>"
      +(past>0.01 ? LD(past)
                  : t("none — the board ends {0} short of it, so that mark falls on the offcut", fmtIn(-past)))+"</dd>"
    +"<dt>"+t("Cut length needed")+"</dt><dd>"+LD(reqLen)+(boardLen?" — "+t("from a {0} board", L(boardLen)):' <span class="pill rip">'+t("needs splice")+"</span>")+"</dd>"
    +"</div></div>";

  /* --- the cuts, bottom to top ------------------------------------------- */
  const rows = [];
  rows.push([t("Bottom riser face"), t("plumb"), LD(drop),
    t("The \"drop\": one tread thickness ({0}) so the first step comes out at {1}{2}.",
      fmtIn(tt), fmtIn(r), model.base>0 ? t(", plus {0} down to the deck joists", fmtIn(model.base)) : "")]);
  rows.push([t("Bottom seat"), t("level"), LD(lay.bottomLevel),
    lay.reachesBearing
      ? t("Bears flat on {0}. Runs from the foot of the plumb face out to the lower edge of the board.",
          model.base>0 ? t("the deck joists") : t("the deck surface"))
      : t("There is none — a {0} is not deep enough to reach the bearing plane here. The board stops {1} short and has to be packed up, or use wider stock.", S.stringerStock, fmtIn(-drop-lay.botY))]);
  rows.push([t("Tread (seat) cut × {0}", c), t("level"), LD(R),
    t("From each mark, running back toward the bottom end. The full unit run — this is the surface the tread lands on.")]);
  rows.push([t("Riser cut × {0}", c), t("plumb"), LD(r),
    t("Meets the seat cut {0} back from the same mark. Do not overcut past the apex — a saw kerf run long is a crack.", fmtIn(lay.setback))]);
  if(flush){
    if(lay.lift>0.001) rows.push([t("Trim the top corner"), t("level"), LD(lay.lift),
      t("Your platform decking is thicker than your treads, so the corner has to come down this much to pass under it.")]);
    rows.push([t("Top bearing tab"), t("level"), LD(topRun),
      t("Runs back under the platform from the last mark and sits on the frame. LEVEL, not a continuation of the slope — the last riser face stays plumb.")]);
    rows.push([t("Back of the tab"), t("plumb"), LD(Math.max(0,lay.topPlumb)),
      lay.topPlumb<=0.25
        ? t("The board is not deep enough for a tab this long — it tapers to nothing. Use wider stock, or the half-tread connection.")
        : t("Free end, hidden under the platform decking. Cut it plumb so it can be tight to whatever is behind it.")]);
  } else if(g.kmin>1){
    /* a jack never reaches the platform — the miter cut it short partway down */
    rows.push([t("Top plumb cut"), t("plumb"), LD(Math.max(0,lay.topPlumb)),
      t("This board does not reach the platform — the 45° miter cuts it short. Its top butts the framing of {0}, so it needs a cleat, a hanger or solid blocking there. The connection type set above does not apply to it.", levelTag(model, g.kmin-1))]);
  } else {
    rows.push([t("Top plumb cut"), t("plumb"), LD(Math.max(0,lay.topPlumb)),
      t("Butts the outside face of the platform frame at the last mark. Nothing bears on it — this is the connection that needs a ledger, a cleat or stringer hangers.")]);
  }
  h += '<table class="cuts"><thead><tr><th>#</th><th>'+t("Cut")+"</th><th>"+t("Type")+"</th><th>"+t("Size")+"</th><th>"+t("Why / how")+"</th></tr></thead><tbody>";
  rows.forEach((rw,i)=>{ h += "<tr><td>"+(i+1)+"</td><td>"+rw[0]+"</td><td>"+rw[1]+"</td><td>"+rw[2]+"</td><td>"+rw[3]+"</td></tr>"; });
  h += "</tbody></table>";

  /* --- marks, measured from ONE datum ------------------------------------ */
  h += '<table><thead><tr><th>'+t("Mark")+"</th><th>"+t("From the bottom end")+"</th><th>"+t("Seat / level")+"</th><th>"+t("Notch")+"</th></tr></thead><tbody>";
  /* Mark 0 is the BOTTOM end. Mark i is the front (nosing) corner of the seat
     that carries level N−1−i, so mark 0 is the lowest tread and mark c is the
     top end, which has no seat. */
  for(let i=0;i<=c;i++){
    const lvl = model.N-1-i;
    h += "<tr><td>"+i+"</td><td>"+LD(lay.startOff+i*Ls)+"</td><td>"
      +(i<c ? levelTag(model, lvl)+" — "+t("tread top {0} above the deck", fmtIn(model.H-lvl*r))
            : t("no seat — top end of the board"))
      +"</td><td>"+(i<c ? t("notch {0} starts here", i+1)
                        : flush ? t("tab starts here")
                                : t("top plumb cut — lands on the offcut side, {0} past the end of the board", fmtIn(lay.startOff+c*Ls-lay.req)))
      +"</td></tr>";
  }
  h += "</tbody></table>";

  h += '<div class="note">'
    +t("Measure every mark from the SAME end of the board, not from the previous mark — stepping the square {0} times accumulates its own thickness. Cut the notches with a circular saw stopping short of the apex and finish the corner with a handsaw; running the kerf past the apex is what splits stringers.", c);
  if(hip) h += " "+t("The hip carries all {0} notches on a run of R×√2 = {1}, so it bites deepest and has the least throat of any board in the job. Its seats are square across the face — it is the tread boards landing on it that are cut at 45°, and both legs' boards bear on the same seat, so keep it dead flat.", c, LD(R));
  h += "</div>";
  return h;
}

/* ---------- 18f. box frames, drawn as boards -----------------------------
   The plan view shows the FINISHED stair, so the boxes under it are hidden
   lines and you cannot see what to build. This draws one box on its own, as
   the boards it is made of: outer rim, inner rim, joists between them, and the
   45 degree miters where the two legs meet at the outside and inside corners.

   Outer corner at (Xo,Yo) = (Wx+kR, Wy+kR), inner at (Xi,Yi) one run back. The
   miter runs corner to corner, so each rim is a parallelogram-ended board, not
   a rectangle: the front outer rim's LONG point is at Xo and its short point
   one thickness back. */
function boxFramePlanSVG(model,k){
  const bx=boxesForLevel(model,k), R=model.R, tk=sk(S.frameStock).t;
  const Xo=model.Wx+k*R, Yo=model.Wy+k*R, Xi=Xo-R, Yi=Yo-R;
  const legF=bx.legs[0], legS=bx.legs[1];
  /* Gutters sized from the real label text — a 9-joist box or a long French
     string is far wider than any fixed margin would allow for. */
  const LBL={
    outer:t("outer rim {0}", L(legF.outer)),
    inner:t("inner rim {0}", L(legF.inner)),
    sOuter:t("side outer rim {0}", L(legS.outer)),
    sInner:t("side inner rim {0}", L(legS.inner)),
    joist:t("{0} joists × {1} @ {2} o.c.", legF.joistCount+legS.joistCount, L(legF.joistLen), fmtIn(legF.joistSpacing)),
    block:t("corner block, 45°")
  };
  const title=t("{0} — rim {1} of {2}, mitered both corners", levelTag(model,k), LD(bx.rimH), S.frameStock);
  const foot=(bx.isBottom ? t("bottom box — bears on {0}", model.base>0?t("the deck joists"):t("the deck surface"))
                          : t("bears on the tread boards of {0}, over its inner rim", levelTag(model,k+1)))
    +" · "+t("same orientation as the plan view — wall at the top, steps descend +Y, side leg +X");
  const mT=46, mB=58;
  /* the depth dimension hangs off the LEFT edge, and "1168 mm" is twice as wide
     as "46"" — size that gutter from the label too */
  const mL=Math.max(54, estTextW(L(Yo),10)+30);
  const mR=Math.max(60, Math.max(...Object.keys(LBL).map(x=>estTextW(LBL[x],10)))+26);
  const sc=Math.min(6.5, 560/Math.max(Xo,1), 420/Math.max(Yo,1));
  const W=Math.max(mL+Xo*sc+mR,
                   mL+estTextW(title.replace(/<[^>]*>/g,""),10)+24,
                   mL+estTextW(foot,9)+24);
  const H=mT+Yo*sc+mB;
  /* SAME ORIENTATION AS THE PLAN VIEW: +x right, +y DOWN, house wall along
     y = 0 at the top, steps descending toward the bottom of the sheet, side leg
     off to the right. Drawing +y upward mirrored the box against the plan. */
  const X=x=>mL+x*sc, Y=y=>mT+y*sc;
  const poly=(pts,st)=>svgPoly(pts.map(p=>[X(p[0]),Y(p[1])]),st);
  let s=svgOpen(W,H);
  // house wall, so which way is up is never in doubt
  s+=svgRect(X(0)-3,Y(0)-9,Xo*sc+3,9,MAT.wall);
  s+=svgText(X(1),Y(0)-12,t("house wall"),'font-size="9" fill="#78838f"');
  // the step above, for context — this box lands on its tread boards
  s+=svgRect(X(0),Y(0),Xi*sc,Yi*sc,'fill="#f2f5f8" stroke="#c3ced8" stroke-width=".8" stroke-dasharray="4 3"');
  s+=svgText(X(Xi/2),Y(Yi/2),t("step above"),'font-size="9" fill="#8b98a5" text-anchor="middle"');
  // joists first, so the rims read as continuous over them
  const joists=[];
  for(let i=0;i<legF.joistCount;i++){
    const x=Math.min(i*legF.joistSpacing, legF.outer-tk);
    if(x+tk>Xi+tk) continue;                       // past the corner: the side leg's ground
    joists.push([[x,Yi+tk],[x+tk,Yi+tk],[x+tk,Yo-tk],[x,Yo-tk]]);
  }
  for(let i=0;i<legS.joistCount;i++){
    const y=Math.min(i*legS.joistSpacing, legS.outer-tk);
    if(y+tk>Yi+tk) continue;
    joists.push([[Xi+tk,y],[Xo-tk,y],[Xo-tk,y+tk],[Xi+tk,y+tk]]);
  }
  for(const j of joists) s+=poly(j,MAT.joist);
  /* Rims. With a taper the legs stop short of the point and a third pair of
     rims closes the 45° face; with a square corner cO/cI are 0 and this reduces
     to the two mitered L rims the tool has always drawn. */
  const cO=model.clip(k), cI=model.clip(k-1), m=model.taper.m;
  s+=poly([[0,Yo-tk],[Xo-cO-tk*m,Yo-tk],[Xo-cO,Yo],[0,Yo]],MAT.rim);          // front outer
  s+=poly([[Xo-tk,0],[Xo,0],[Xo,Yo-cO],[Xo-tk,Yo-cO-tk*m]],MAT.rim);          // side outer
  s+=poly([[0,Yi],[Xi-cI,Yi],[Xi-cI+tk*m,Yi+tk],[0,Yi+tk]],MAT.rim);          // front inner
  s+=poly([[Xi,0],[Xi+tk,0],[Xi+tk,Yi-cI+tk*m],[Xi,Yi-cI]],MAT.rim);          // side inner
  if(bx.diag){
    // the corner face's own rims, along the 45° diagonal
    const band=(c,off)=>{                    // rim just inside the face line at clip c
      const p1=[Xo-c-0*off, Yo], p2=[Xo, Yo-c];      // the face itself
      const n=off/Math.SQRT2;                        // inward normal step
      return [[p1[0]-n,p1[1]-n],[p2[0]-n,p2[1]-n],[p2[0]-n-tk/Math.SQRT2,p2[1]-n-tk/Math.SQRT2],
              [p1[0]-n-tk/Math.SQRT2,p1[1]-n-tk/Math.SQRT2]];
    };
    s+=poly(band(cO,0),MAT.rim);                                  // corner outer rim
    if(!bx.diag.triangle) s+=poly([[Xi-cI,Yi],[Xi,Yi-cI],
      [Xi+tk/Math.SQRT2,Yi-cI+tk/Math.SQRT2],[Xi-cI+tk/Math.SQRT2,Yi+tk/Math.SQRT2]],MAT.rim);
  } else {
    // corner block on the miter
    s+=poly([[Xi+tk,Yi+tk],[Xi+tk+tk*2,Yi+tk],[Xi+tk,Yi+tk+tk*2]],MAT.block);
  }
  s+=svgLine(X(Xi-cI),Y(Yi),X(Xo-cO),Y(Yo),'stroke="#8c3b3b" stroke-width="1.1" stroke-dasharray="5 3"');
  if(bx.diag) s+=svgLine(X(Xi),Y(Yi-cI),X(Xo),Y(Yo-cO),'stroke="#8c3b3b" stroke-width="1.1" stroke-dasharray="5 3"');
  /* Callouts down the right gutter, in reading order top to bottom — which is
     also the order you meet the boards walking down the stair. */
  const gx=X(Xo)+10;
  s+=svgText(mL,14,title,'font-size="10" fill="#333"');
  s+=svgLead(X(Xi+tk/2),Y(Yo*0.10),gx,Y(Yo*0.10),LBL.sInner);
  s+=svgLead(X(Xo-tk/2),Y(Yo*0.28),gx,Y(Yo*0.28),LBL.sOuter);
  if(joists.length) s+=svgLead(X(Math.min(legF.joistSpacing,Xi)+tk/2),Y((Yi+Yo)/2),gx,Y(Yo*0.48),LBL.joist);
